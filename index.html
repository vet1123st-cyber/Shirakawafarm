/* --- 考察レポート --- */
function reportCard(rows){
  const M = Analysis.metricInfo();
  const c = el('div', { class: 'card' });
  const title = Analysis.sel.length === 1
    ? fmtDateFull(Analysis.sel[0]) : Analysis.sel.length + 'つの測定日';
  c.appendChild(el('h2', {}, '考察レポート',
    el('span', { class: 'note' }, title + '（' + rows.length + '件）')));

  const items = rows.map(r => {
    const v = M.get(r);
    const s = v != null ? Calc.std(M.std, r.day) : null;
    return { r, v, s, zone: s ? Calc.stdZone(M.std, r.day, v) : null,
             diff: s ? v - s.avg : null };
  }).filter(x => x.v != null && x.s);

  if (!items.length){ c.appendChild(el('div', { class: 'empty' }, 'データがありません')); return c; }

  const under = items.filter(x => x.zone === 'under').sort((a,b) => a.diff - b.diff);
  const below = items.filter(x => x.zone === 'in' && x.diff < 0).sort((a,b) => a.diff - b.diff);
  const over  = items.filter(x => x.zone === 'over').sort((a,b) => b.diff - a.diff);

  const section = (label, list, cls, render) => {
    if (!list.length) return null;
    const box = el('div', { class: 'note ' + cls, style: 'margin-bottom:12px' });
    box.appendChild(el('div', { style: 'font-weight:700;margin-bottom:7px' },
      label + '　' + list.length + '頭'));
    box.appendChild(render(list));
    return box;
  };

  const asList = list => {
    const ul = el('div');
    list.slice(0, 20).forEach(x => {
      ul.appendChild(el('div', {
        style: 'padding:4px 0;cursor:pointer;line-height:1.6',
        onclick: () => App.openCow(x.r.cow.cow_no, 'weight')
      },
        el('b', { style: 'color:var(--s1)' }, x.r.cow.tag4),
        ' — ' + x.r.day + '日齢, ' + M.label + ' ' + r1(x.v) + M.unit +
        '（標準平均 ' + r1(x.s.avg) + ', 差 ' + (x.diff >= 0 ? '+' : '') + r1(x.diff) + M.unit + '）' +
        (x.r.ful != null ? '　充足率 ' + r1(x.r.ful) + '%' : '')));
    });
    if (list.length > 20)
      ul.appendChild(el('div', { style: 'color:var(--muted);font-size:calc(11.5px * var(--fs));margin-top:6px' },
        'ほか ' + (list.length - 20) + '頭'));
    return ul;
  };
  // 指で押せるよう、番号は文中リンクではなくチップにしています
  const asChips = list => {
    const box = el('div', { class: 'chips sm' });
    list.slice(0, 40).forEach(x => box.appendChild(el('button', {
      class: 'chip', style: 'background:var(--surface)',
      onclick: () => App.openCow(x.r.cow.cow_no, 'weight')
    }, x.r.cow.tag4,
       el('span', { style: 'color:var(--muted);font-weight:500;margin-left:5px' },
         r1(x.v) + M.unit))));
    if (list.length > 40)
      box.appendChild(el('div', { style: 'color:var(--muted);font-size:var(--t1);align-self:center' },
        'ほか ' + (list.length - 40) + '頭'));
    return box;
  };

  const a = section('⚠ 発育遅延（標準以下）', under, 'crit', asList);
  const b = section('◻ 標準内だが平均を下回る', below, 'warn', asChips);
  const d = section('★ 標準の上限を超えた優良個体', over, '', asChips);
  if (a) c.appendChild(a);
  if (b) c.appendChild(b);
  if (d) c.appendChild(d);

  // まとめ
  const fuls = rows.map(r => r.ful).filter(v => v != null);
  if (fuls.length){
    const mean = fuls.reduce((x,y)=>x+y,0)/fuls.length;
    const sorted = fuls.slice().sort((x,y)=>x-y);
    c.appendChild(el('div', { class: 'tiles', style: 'margin-top:4px' },
      el('div', { class: 'tile' }, el('div', { class: 'k' }, '充足率の平均'),
        el('div', { class: 'v' }, r1(mean), el('small', {}, '%')),
        el('div', { class: 'd ' + (mean >= 100 ? 'good' : mean < 95 ? 'bad' : '') },
          '中央値 ' + r1(pctl(sorted, .5)) + '%')),
      el('div', { class: 'tile' }, el('div', { class: 'k' }, '90%未満'),
        el('div', { class: 'v' }, String(fuls.filter(v => v < 90).length), el('small', {}, '頭')),
        el('div', { class: 'd' }, r0(fuls.filter(v => v < 90).length / fuls.length * 100) + '%')),
      el('div', { class: 'tile' }, el('div', { class: 'k' }, '一番低い'),
        el('div', { class: 'v' }, r1(sorted[0]), el('small', {}, '%')),
        el('div', { class: 'd' }, '一番高い ' + r1(sorted[sorted.length-1]) + '%'))));
  }

  c.appendChild(el('div', { class: 'btnrow', style: 'margin-top:12px' },
    el('button', { class: 'btn sm', onclick: () => exportAnalysis(rows) }, '📤 この一覧をCSVで書き出す')));
  return c;
}

function exportAnalysis(rows){
  const M = Analysis.metricInfo();
  const out = rows.map(r => {
    const s = Calc.std(M.std, r.day);
    return {
      '4桁': r.cow.tag4, '個体識別番号': r.cow.cow_no, '名号': r.cow.name,
      '測定日': r.date, '生年月日': r.cow.birth_date, '日齢': r.day,
      '胸囲cm': r.chest ?? '', '推定体重kg': r.kg != null ? r1(r.kg) : '',
      '推奨体重kg': s ? r1(Calc.std('weight', r.day).avg) : '',
      '充足率%': r.ful != null ? r1(r.ful) : '',
      '判定': (z => z === 'over' ? '標準以上' : z === 'under' ? '標準以下'
                  : z === 'in' ? '標準内' : '')(Calc.stdZone('weight', r.day, r.kg))
    };
  });
  if (!out.length){ toast('書き出すデータがありません', true); return; }
  const cols = Object.keys(out[0]);
  const blob = new Blob(['﻿' + toCSV(out, cols)], { type: 'text/csv;charset=utf-8' });
  const a = el('a', { href: URL.createObjectURL(blob),
    download: '白川牧場_測定日分析_' + today() + '.csv' });
  document.body.appendChild(a); a.click(); a.remove();
  toast(out.length + '件を書き出しました');
}

/* ------------------------------------------------------------
   16. 哺乳ボード — 現場での毎日の入力
   ------------------------------------------------------------
   使い方の想定：
     1)「プログラムの量を入れる」でその日のおおまかな量を一括で埋める
     2) 下痢や肺炎で下がった牛だけ、± ボタンで個別に直す
     3) 気になった牛だけ 飲み残し・便の状態 を押す
     4) まとめて保存
   ------------------------------------------------------------ */

const MilkBoard = {
  date: null,
  step: 0.5,            // ± ボタンの刻み（L）
  rows: [],             // { cow, day, prog, am, pm, refused, feces, note, open, changed }
  filter: 'milk',       // milk | all | flagged
  sort: LS.get('sw.mbSort', 'pen'),   // pen（歩く順）| group（群の順）
  showOpts: LS.get('sw.mbOpts', false),   // 並び順と刻みを開いているか
  showRecord: LS.get('sw.mbRec', false),  // 「この牧場のこれまで」を開いているか
  loaded: false,

  reset(){ this.loaded = false; this.loading = false; this.savedLoaded = false;
           this.rows = []; this.date = null; },

  build(){
    const date = this.date || today();
    // 「その日」時点の群で判定する（過去の日を入れ直すときに名簿が変わらないように）
    const list = Store.cows.filter(c => Calc.groupOf(c, date).milk);

    // 並び順は2通り。
    //   pen  … 実際に歩くハッチの順（飛ばし・二度づけが減る）
    //   group… 群の順（初乳→増乳→ピーク→減乳→離乳）
    const byPen = this.sort === 'pen' && Pens.all().length;
    const penOrder = c => {
      const p = Pens.byName(c.pen);
      return p ? p.order : 99999;      // 部屋が未設定の子は最後に回す
    };
    const cows = list.sort((a, b) => byPen
      ? (penOrder(a) - penOrder(b)) ||
        ((ageDays(a.birth_date, date) ?? 0) - (ageDays(b.birth_date, date) ?? 0))
      : (Calc.groupOf(a, date).order - Calc.groupOf(b, date).order) ||
        ((ageDays(a.birth_date, date) ?? 0) - (ageDays(b.birth_date, date) ?? 0)));

    this.rows = cows.map(c => {
      const day = ageDays(c.birth_date, date);
      const key = Calc.programKey(c);
      const prog = Calc.programAt(key, day, date);
      const g = Calc.groupOf(c, date);
      const lw = Store.latestWeight[String(c.cow_no)] || null;
      // 体重は直近の測定を使い、無ければ標準の平均で代用する（%表示の分母）
      const kg = lw ? lw.kg : (Calc.std('weight', day)?.avg ?? null);
      return { cow: c, day, group: g, progKey: key, prog,
               kg, kgFrom: lw ? (lw.measured ? '実測 ' + fmtDate(lw.date)
                                             : '胸囲から推定 ' + fmtDate(lw.date))
                              : '標準の平均（未測定）',
               prevAm: null, prevPm: null, prevDate: null,
               am: null, pm: null, refused: '', feces: '', note: '',
               saved: false, open: false, changed: false };
    });
    this.date = date;
    this.loaded = true;
    this.savedLoaded = false;
  },

  /** その日すでに保存してある値を読み込んで、画面に出しておく。
      入れ直しのときに「何が入っているか」が見えないと直せないため。 */
  async loadSaved(){
    if (this.loading) return;
    this.loading = true;
    try {
      // 前日の分も一緒に読む。「前回よりどれだけ増やしたか」を出すため。
      const prevDate = addDays(this.date, -1);
      const [d, dp] = await Promise.all([
        Store.call({ action: 'export', table: 'milk_feed', date: this.date }),
        Store.call({ action: 'export', table: 'milk_feed', date: prevDate })
      ]);
      const byPrev = {};
      (dp.rows || []).forEach(m => {
        (byPrev[String(m.cow_no)] = byPrev[String(m.cow_no)] || []).push(m);
      });
      this.rows.forEach(r => {
        const list = byPrev[String(r.cow.cow_no)];
        if (!list || !list.length) return;
        const per = list.filter(m => /^[0-9]+$/.test(String(m.feeding_no || '').trim()));
        r.prevDate = prevDate;
        if (per.length){
          const a = per.find(m => String(m.feeding_no).trim() === '1');
          const p = per.find(m => String(m.feeding_no).trim() === '2');
          r.prevAm = a ? num(a.volume_l) : null;
          r.prevPm = p ? num(p.volume_l) : null;
        } else {
          const feeds = Calc.perDay() || 2;
          const total = list.reduce((s, m) => s + (num(m.volume_l, 0) || 0), 0);
          r.prevAm = r.prevPm = Math.round(total / feeds * 100) / 100;
        }
      });

      const by = {};
      (d.rows || []).forEach(m => {
        (by[String(m.cow_no)] = by[String(m.cow_no)] || []).push(m);
      });
      this.rows.forEach(r => {
        const list = by[String(r.cow.cow_no)];
        if (!list || !list.length) return;
        const per = list.filter(m => /^[0-9]+$/.test(String(m.feeding_no || '').trim()));
        const use = per.length ? per : list;
        const am = use.find(m => String(m.feeding_no).trim() === '1');
        const pm = use.find(m => String(m.feeding_no).trim() === '2');
        if (per.length){
          if (am) r.am = num(am.volume_l);
          if (pm) r.pm = num(pm.volume_l);
        } else {
          // 「1日分」でまとめて入っている行は、回数で割って朝夕に振り分ける
          const feeds = Calc.perDay() || 2;
          const total = use.reduce((s, m) => s + (num(m.volume_l, 0) || 0), 0);
          r.am = r.pm = Math.round(total / feeds * 100) / 100;
        }
        const src = use[0] || list[0];
        r.refused = src.refused || '';
        r.feces = src.feces || '';
        r.note = src.note || '';
        r.saved = true;
      });
    } finally { this.loading = false; }
  },

  fillProgram(){
    this.rows.forEach(r => {
      if (r.prog && r.prog.perFeed > 0){
        if (r.am == null) r.am = r.prog.perFeed;
        if (r.pm == null) r.pm = r.prog.perFeed;
      }
    });
  },

  filtered(){
    if (this.filter === 'all') return this.rows;
    if (this.filter === 'flagged')
      return this.rows.filter(r => r.refused || (r.feces && r.feces !== '正常') || r.note);
    return this.rows;
  },

  totals(){
    let heads = 0, litres = 0, powder = 0;
    const g = Calc.powderConc(this.date);
    this.rows.forEach(r => {
      const a = num(r.am, 0) || 0, p = num(r.pm, 0) || 0;
      if (a + p > 0){ heads++; litres += a + p; powder += (a + p) * g; }
    });
    return { heads, litres, powder };
  }
};

function viewMilkBoard(){
  if (!MilkBoard.loaded) MilkBoard.build();
  // その日すでに保存してある値を後から流し込む（読めたら描き直す）
  if (!MilkBoard.savedLoaded && !MilkBoard.loading){
    MilkBoard.savedLoaded = true;
    MilkBoard.loadSaved()
      .then(() => { if (App.view === 'milkboard') App.render(); })
      .catch(() => {});
  }
  const wrap = el('div');
  const S = Calc.S();
  const nSaved = MilkBoard.rows.filter(r => r.saved).length;
  App.setTop('今日の哺乳',
    MilkBoard.rows.length + '頭' + (nSaved ? '（保存済み ' + nSaved + '頭）' : ''), true);

  /* --- 日付と、いちばん使うボタンだけを上に --- */
  /* スマホでは、この上の欄が画面を全部使ってしまうと、牛が1頭も見えません。
     毎日いじらない「並び順」と「刻み」は、⚙ を押したときだけ出します。 */
  const head = el('div', { class: 'card tight' });
  const fDate = inp({ type: 'date', value: MilkBoard.date,
                      style: 'max-width:150px;min-height:var(--tap-sm);font-size:var(--t2)' });
  fDate.addEventListener('change', () => {
    MilkBoard.date = fDate.value; MilkBoard.loaded = false; App.render();
  });
  const gear = el('button', {
    class: 'btn sm ghost', style: 'flex:none;padding:6px 12px',
    'aria-pressed': MilkBoard.showOpts,
    onclick: () => { MilkBoard.showOpts = !MilkBoard.showOpts;
                     LS.set('sw.mbOpts', MilkBoard.showOpts); App.render(); }
  }, '⚙ 設定');
  head.appendChild(el('div', {
    style: 'display:flex;gap:8px;align-items:center;margin-bottom:8px' },
    fDate,
    el('div', { class: 't-micro', style: 'flex:1;color:var(--muted);line-height:1.4' },
      MilkBoard.sort === 'pen' ? '歩く順' : '群の順',
      '　± ' + (MilkBoard.step < 1 ? r1(MilkBoard.step) : MilkBoard.step) + 'L'),
    gear));

  head.appendChild(el('button', { class: 'btn primary',
    onclick: () => { MilkBoard.fillProgram(); App.render(); } },
    '① プログラムの量を入れる'));
  head.appendChild(el('div', { class: 't-micro',
    style: 'margin-top:6px;color:var(--muted);line-height:1.5' },
    '② そのあと、下がった牛だけ ± で直します（数値は1回あたりのL）。',
    '　朝 ' + S['routine.am_milk'] + ' ／ 夕 ' + S['routine.pm_milk']));

  if (MilkBoard.showOpts){
    /* 並び順（牛舎の配置を作ってあるときだけ出す） */
    if (Pens.all().length){
      head.appendChild(el('hr', { class: 'sep', style: 'margin:12px 0 8px' }));
      head.appendChild(el('div', { class: 't-micro',
        style: 'color:var(--muted);font-weight:700;margin-bottom:5px' }, '並び順'));
      head.appendChild(el('div', { class: 'seg' },
        [['pen', '歩く順'], ['group', '群の順']].map(([v, t]) => el('button', {
          'aria-pressed': MilkBoard.sort === v,
          onclick: () => { MilkBoard.sort = v; LS.set('sw.mbSort', v);
                           MilkBoard.loaded = false; App.render(); }
        }, t))));
      head.appendChild(el('div', { class: 'hint' },
        MilkBoard.sort === 'pen'
          ? 'ハッチを実際に歩く順に並びます。飛ばしや二度づけが減ります。'
          : '初乳→増乳→ピーク→減乳→離乳 の順に並びます。'));
    }

    head.appendChild(el('hr', { class: 'sep', style: 'margin:12px 0 8px' }));
    head.appendChild(el('div', { class: 't-micro',
      style: 'color:var(--muted);font-weight:700;margin-bottom:5px' }, '± ボタンの刻み'));
    head.appendChild(el('div', { class: 'seg' },
      [0.2, 0.3, 0.5, 1, 2].map(v => el('button', {
        'aria-pressed': MilkBoard.step === v,
        onclick: () => { MilkBoard.step = v; App.render(); }
      }, (v < 1 ? r1(v) : String(v)) + 'L'))));
  }
  wrap.appendChild(head);

  /* --- 一覧 --- */
  const list = el('div', { class: 'card' });
  const t = MilkBoard.totals();
  list.appendChild(el('h2', {}, '哺乳中の牛',
    el('span', { class: 'note' }, t.heads + '頭 · 計 ' + r1(t.litres) + ' L · 粉 ' +
      (t.powder >= 1000 ? r1(t.powder/1000) + ' kg' : r0(t.powder) + ' g'))));

  if (!MilkBoard.rows.length){
    list.appendChild(el('div', { class: 'empty' }, '哺乳中の牛がいません'));
    wrap.appendChild(list);
    return wrap;
  }

  // 見出しは並び順に合わせる（歩く順なら段ごと、群の順なら群ごと）
  const byPen = MilkBoard.sort === 'pen' && Pens.all().length > 0;
  const headOf = r => {
    if (!byPen) return { key: 'g:' + r.group.key, label: r.group.label };
    const p = Pens.byName(r.cow.pen);
    if (!p) return { key: 'none', label: '部屋が未設定' };
    // 歩く順のときは、部屋の種類でまとめる（外ハッチ／小ハッチ／ペアハッチ…）
    const k = penKind(p.kind);
    return { key: 'k:' + k.key, label: k.label };
  };
  let lastHead = null;
  MilkBoard.rows.forEach(r => {
    const h = headOf(r);
    if (h.key !== lastHead){
      lastHead = h.key;
      const n = MilkBoard.rows.filter(x => headOf(x).key === h.key).length;
      list.appendChild(el('div', {
        style: 'font-size:var(--t1);font-weight:700;color:var(--muted);margin:14px 0 4px;' +
               'padding-bottom:4px;border-bottom:2px solid var(--grid)'
      }, h.label,
        el('span', { style: 'font-weight:400;margin-left:8px' }, n + '頭')));
    }
    list.appendChild(milkRow(r));
  });
  wrap.appendChild(list);

  /* --- 保存 --- */
  wrap.appendChild(el('div', { style: 'height:8px' }));
  const bar = el('div', { class: 'actionbar' });
  const btn = el('button', { class: 'btn primary' }, '保存する');
  btn.onclick = () => submitting(btn, async () => {
    const g = Calc.powderConc(MilkBoard.date);
    const colo = num(Calc.S()['group.colostrum_days'], 3);
    let saved = 0, cows = 0;

    for (const r of MilkBoard.rows){
      const a = num(r.am), p2 = num(r.pm);
      if (a == null && p2 == null) continue;   // 触っていない牛は何もしない
      if (r.saved && !r.changed) continue;     // 保存済みで直していない牛は送らない
      const type = r.day <= colo ? '初乳' : '代用乳';
      const mk = (no, v) => ({
        cow_no: r.cow.cow_no, date: MilkBoard.date, feeding_no: no,
        milk_type: type, volume_l: v, powder_g_per_l: g,
        refused: r.refused || '', feces: r.feces || '', note: r.note || ''
      });
      const rows = [];
      if (a != null && a >= 0) rows.push(mk('1', a));
      if (p2 != null && p2 >= 0) rows.push(mk('2', p2));
      if (!rows.length) continue;
      // その牛のその日の記録を入れ直す。
      // 何度保存しても増えず、直した値がそのまま残ります。
      await Store.replace('milk_feed', { cow_no: r.cow.cow_no, date: MilkBoard.date }, rows);
      saved += rows.length; cows++;

      if (r.feces && r.feces !== '正常')
        await Store.replace('events',
          { cow_no: r.cow.cow_no, date: MilkBoard.date, type: '便異常' },
          [{ cow_no: r.cow.cow_no, date: MilkBoard.date, type: '便異常',
             detail: r.feces, note: r.note || '' }]);

      btn.innerHTML = '';
      btn.appendChild(document.createTextNode('保存中… ' + cows + '頭'));
    }
    if (!saved){
      const done = MilkBoard.rows.filter(r => r.saved).length;
      throw new Error(done ? 'すべて保存済みです（直した牛はありません）'
                           : '入力された量がありません');
    }
    Analysis.reset();
    toast(cows + '頭分を保存しました');
    MilkBoard.reset();
    App.go('entry');
  });
  bar.appendChild(btn);
  bar.appendChild(el('div', { class: 'meta' },
    t.heads + '頭 · 計 ' + r1(t.litres) + ' L · 粉 ' +
    (t.powder >= 1000 ? r1(t.powder/1000) + ' kg' : r0(t.powder) + ' g')));
  wrap.appendChild(bar);
  return wrap;
}

/** その行の「無理のない量か」を、朝と夕それぞれで見て、悪いほうを返す */
function rowSafety(r){
  const opt = key => ({
    prevPerFeed: key === 'am' ? r.prevAm : r.prevPm,
    programPerFeed: r.prog ? r.prog.perFeed : null,
    progKey: r.progKey, feces: r.feces, refused: r.refused, day: r.day
  });
  const rank = { ok: 0, watch: 1, low: 2, high: 3 };
  const a = Calc.feedSafety(r.am, r.kg, opt('am'));
  const p = Calc.feedSafety(r.pm, r.kg, opt('pm'));
  const worst = rank[p.level] > rank[a.level] ? p : a;
  // 注意書きは朝夕あわせて重複を除く
  const notes = Array.from(new Set(a.notes.concat(p.notes)));
  return Object.assign({}, worst, { notes, am: a, pm: p });
}

const SAFETY_TONE = {
  ok:    { color: '--good', label: '' },
  watch: { color: '--warn', label: '確認' },
  low:   { color: '--serious', label: '少なめ' },
  high:  { color: '--crit', label: '多め' }
};

/* --- 1頭分の行 --- */
function milkRow(r){
  const safe = rowSafety(r);
  const flagged = (r.feces && r.feces !== '正常') || safe.level === 'high';
  // 和牛はホルスタインと哺乳量がまるで違うので、行ごと色で分かるようにする
  const wagyu = isWagyu(r.cow);
  const box = el('div', {
    style: 'border-bottom:1px solid var(--grid);padding:8px 0' +
           (flagged
             ? ';background:color-mix(in srgb,var(--crit) 6%,transparent);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:8px'
             : wagyu
               ? ';background:color-mix(in srgb,var(--s2) 6%,transparent);margin:0 -6px;' +
                 'padding-left:9px;padding-right:6px;border-radius:8px;' +
                 'box-shadow:inset 3px 0 0 var(--s2)'
               : '')
  });

  const total = (num(r.am, 0) || 0) + (num(r.pm, 0) || 0);
  const target = r.prog ? r.prog.perDay : null;
  const short = target != null && total > 0 && total < target - 0.05;

  /* 上段：番号・日齢・合計 */
  if (r.open){ box.id = 'mbOpen'; box.style.scrollMarginBottom = '210px'; }
  const top = el('div', {
    style: 'display:flex;align-items:center;gap:10px;cursor:pointer',
    onclick: () => {
      MilkBoard.rows.forEach(x => { if (x !== r) x.open = false; });  // 一度に1頭だけ開く
      r.open = !r.open;
      App.render();
      if (r.open) setTimeout(() => {
        const t = $('#mbOpen');
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 40);
    }
  },
    el('div', { style: 'min-width:60px' },
      el('div', { style: 'font-size:var(--t5);font-weight:800;line-height:1.15;' +
                         'font-variant-numeric:tabular-nums' }, r.cow.tag4),
      el('div', { style: 'font-size:var(--t0);color:var(' + (wagyu ? '--s2' : '--muted') + ')' },
        (wagyu ? '和牛 ' : '') + r.day + '日' + (r.cow.pen ? '　' + r.cow.pen : ''))),
    el('div', { style: 'flex:1;min-width:0;font-size:var(--t1);color:var(--muted);line-height:1.5' },
      r.prog ? r1(r.prog.perFeed) + ' L/回・粉' + r0(r.prog.powderPerFeed) + 'g' : '',
      r.saved && !r.changed
        ? el('span', { class: 'badge good', style: 'margin-left:6px' }, '保存済み') : null,
      r.refused ? el('span', { class: 'badge warn', style: 'margin-left:6px' }, '残' ) : null,
      r.feces && r.feces !== '正常'
        ? el('span', { class: 'badge crit', style: 'margin-left:6px' }, r.feces) : null,
      safe.level !== 'ok'
        ? el('span', { class: 'badge ' + (safe.level === 'high' ? 'crit' : 'warn'),
                       style: 'margin-left:6px' }, SAFETY_TONE[safe.level].label) : null,
      short ? el('div', { style: 'color:var(--serious);font-weight:600' },
        '目安より −' + r1(target - total) + ' L') : null),
    el('div', { style: 'text-align:right;min-width:82px' },
      el('div', { style: 'font-size:var(--t4);font-weight:800;font-variant-numeric:tabular-nums' +
                         (safe.level === 'high' ? ';color:var(--crit)' : '') },
        total > 0 ? r1(total) + ' L'
                  : el('span', { style: 'color:var(--muted);font-weight:500;font-size:var(--t1)' }, '未入力')),
      el('div', { style: 'font-size:var(--t0);color:var(--muted)' },
        '朝 ' + (r.am != null ? r1(r.am) : '—') + ' / 夕 ' + (r.pm != null ? r1(r.pm) : '—')),
      safe.pctBW != null && total > 0
        ? el('div', { style: 'font-size:var(--t0);color:var(--muted)' },
            '体重の ' + r1(safe.pctBW) + '%/回') : null),
    el('div', { style: 'color:var(--muted);font-size:var(--t2);width:16px' }, r.open ? '▲' : '▼'));
  box.appendChild(top);

  if (!r.open) return box;

  /* 下段：詳細 */
  const det = el('div', { style: 'padding:10px 0 4px' });

  const feedRow = (label, key, time) => {
    const f = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
      value: r[key] == null ? '' : r1(r[key]) });
    f.addEventListener('input', () => {
      r[key] = f.value === '' ? null : num(f.value); r.changed = true; });
    const bump = d => {
      const cur = num(r[key], 0) ?? 0;
      r[key] = Math.max(0, Math.round((cur + d) * 100) / 100);
      r.changed = true; App.render();
    };
    const prog = r.prog ? r1(r.prog.perFeed) : null;
    return el('div', { style: 'margin-bottom:12px' },
      el('div', { style: 'display:flex;align-items:baseline;gap:8px;margin-bottom:6px' },
        el('div', { style: 'font-size:var(--t3);font-weight:700' }, label),
        el('div', { style: 'font-size:var(--t0);color:var(--muted)' }, time),
        prog ? el('button', {
          class: 'btn sm ghost',
          style: 'margin-left:auto;min-height:40px;padding:4px 12px;font-size:var(--t1)',
          onclick: () => { r[key] = num(prog); r.changed = true; App.render(); }
        }, '目安 ' + prog + 'L にする') : null),
      el('div', { class: 'stepper' },
        el('button', { onclick: () => bump(-MilkBoard.step), 'aria-label': label + 'を減らす' }, '−'),
        el('div', { style: 'flex:1' }, f),
        el('button', { onclick: () => bump(MilkBoard.step), 'aria-label': label + 'を増やす' }, '＋'),
        el('span', { style: 'font-size:var(--t2);color:var(--muted);flex:none' }, 'L')));
  };
  const S = Calc.S();
  det.appendChild(feedRow('朝', 'am', S['routine.am_milk']));
  det.appendChild(feedRow('夕', 'pm', S['routine.pm_milk']));

  det.appendChild(el('div', { class: 't-micro', style: 'margin:-4px 0 12px;color:var(--muted)' },
    '± は ' + (MilkBoard.step < 1 ? r1(MilkBoard.step) : MilkBoard.step) + ' L 刻み（上の ⚙ で変えられます）'));

  /* この子にとって無理のない量か。
     入れる数字を先に出して、その結果としてここを見る順にしています
     （スマホでは、先に説明が来ると入力欄が画面の外に出てしまうため）。 */
  det.appendChild(safetyCard(r, safe, total));

  /* 飲み残し */
  det.appendChild(el('div', { class: 't-micro',
    style: 'font-weight:650;margin-bottom:4px;color:var(--muted)' }, '飲み残し'));
  det.appendChild(el('div', { class: 'chips sm', style: 'margin-bottom:10px' },
    el('button', { class: 'chip', 'aria-pressed': r.refused === '',
      onclick: () => { r.refused = ''; r.changed = true; App.render(); } }, 'なし'),
    el('button', { class: 'chip', 'aria-pressed': r.refused === 'あり',
      onclick: () => { r.refused = 'あり'; r.changed = true; App.render(); } }, 'あり')));

  /* 便の状態 */
  det.appendChild(el('div', { class: 't-micro',
    style: 'font-weight:650;margin-bottom:4px;color:var(--muted)' },
    '便の状態 ', el('span', { style: 'font-weight:400' }, '気になったときだけ')));
  det.appendChild(el('div', { class: 'chips sm', style: 'margin-bottom:10px' },
    el('button', { class: 'chip', 'aria-pressed': r.feces === '',
      onclick: () => { r.feces = ''; r.changed = true; App.render(); } }, '—'),
    FECES.map(f => el('button', {
      class: 'chip', 'aria-pressed': r.feces === f.key,
      style: r.feces === f.key ? 'background:var(' + f.color + ');border-color:transparent;color:#fff' : '',
      onclick: () => { r.feces = f.key; r.changed = true; App.render(); }
    }, f.label))));

  /* メモ */
  const fn = inp({ type: 'text', value: r.note, placeholder: '下痢・肺炎・治療など' });
  fn.addEventListener('input', () => { r.note = fn.value; r.changed = true; });
  det.appendChild(field('メモ', fn));

  /* 次の牛へ。ここが現場でいちばん押される場所なので、大きく前に出す。
     順番は、上の並び（歩く順）のまま。入れ終わったらそのまま歩いて次へ行けます。 */
  const idx = MilkBoard.rows.indexOf(r);
  const next = MilkBoard.rows[idx + 1];
  det.appendChild(el('button', {
    class: 'btn primary', style: 'width:100%;margin-top:4px',
    onclick: () => {
      MilkBoard.rows.forEach(x => { x.open = false; });
      if (next){
        next.open = true;
        App.render();
        setTimeout(() => {
          const t2 = $('#mbOpen');
          if (t2) t2.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 40);
      } else {
        App.render();
        toast('最後の牛です。下の「保存する」を押してください');
      }
    }
  }, next ? '次の牛へ　' + next.cow.tag4 + '　▼' : '入力おわり（最後の牛です）'));

  det.appendChild(el('div', { class: 'btnrow', style: 'margin-top:8px' },
    el('button', { class: 'btn sm ghost', onclick: () => App.openCow(r.cow.cow_no) }, 'カルテ'),
    el('button', { class: 'btn sm ghost',
      onclick: () => { r.am = r.pm = null; r.refused = ''; r.feces = ''; r.note = '';
                       r.changed = false; App.render(); } }, 'この牛を空に')));

  box.appendChild(det);
  return box;
}

/* ------------------------------------------------------------
   「この子にとって無理のない量か」を出すカード
   ------------------------------------------------------------
   3つを重ねて見せています。
     ・体重に対する1回量（%）… その子の大きさに対して
     ・日齢の目安との差       … 月齢に対して
     ・牧場のこれまでの実績   … 同じ日齢帯で同じくらいの量で育てた牛はどうだったか
   3つ目はデータが貯まってから効くので、頭数(n)を必ず添えています。
   ------------------------------------------------------------ */
function safetyCard(r, safe, total){
  const box = el('div', {
    style: 'background:var(--surface-2);border-radius:var(--r-sm);padding:10px 11px;' +
           'margin-bottom:12px'
  });

  const tone = SAFETY_TONE[safe.level];
  const head = el('div', {
    style: 'display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap' });
  head.appendChild(el('div', {
    style: 'font-size:var(--t2);font-weight:700;color:var(' + tone.color + ')' },
    safe.level === 'ok' ? '◎ 無理のない量です'
      : safe.level === 'high' ? '▲ 多いかもしれません'
      : safe.level === 'low' ? '▽ 目安より少なめです'
      : '△ 確認してください'));
  if (total > 0)
    head.appendChild(el('div', { style: 'font-size:var(--t1);color:var(--muted)' },
      '1日 ' + r1(total) + ' L'));
  box.appendChild(head);

  /* 体重に対する1回量 */
  if (safe.pctBW != null){
    const ceil = safe.ceilPct;
    const kv = el('div', { style: 'font-size:var(--t1);line-height:1.7' });
    kv.appendChild(el('div', {},
      '体重 ' + r0(r.kg) + ' kg に対して ',
      el('b', {}, r1(safe.pctBW) + '%'), ' /回',
      ceil != null
        ? el('span', { style: 'color:var(--muted)' },
            '（この牧場のいつもの上限 ' + r1(ceil) + '%）') : null));
    kv.appendChild(el('div', { style: 'color:var(--muted);font-size:var(--t0)' },
      '体重は ' + r.kgFrom));
    box.appendChild(kv);

    // 帯（0〜上限の1.15倍を横棒にして、今の位置を出す）
    if (ceil != null){
      const span = ceil * 1.3;
      const pos = clamp(safe.pctBW / span * 100, 0, 100);
      const okEnd = clamp(ceil / span * 100, 0, 100);
      const warnEnd = clamp(ceil * 1.15 / span * 100, 0, 100);
      box.appendChild(el('div', {
        style: 'position:relative;height:12px;border-radius:6px;margin:10px 0 4px;' +
               'background:linear-gradient(to right,' +
               'color-mix(in srgb,var(--good) 45%,transparent) 0 ' + okEnd + '%,' +
               'color-mix(in srgb,var(--warn) 55%,transparent) ' + okEnd + '% ' + warnEnd + '%,' +
               'color-mix(in srgb,var(--crit) 50%,transparent) ' + warnEnd + '% 100%)'
      },
        el('div', {
          style: 'position:absolute;top:-3px;left:' + pos + '%;transform:translateX(-50%);' +
                 'width:4px;height:18px;border-radius:2px;background:var(--ink);' +
                 'box-shadow:0 0 0 2px var(--surface-2)'
        })));
      box.appendChild(el('div', {
        style: 'display:flex;justify-content:space-between;font-size:var(--t0);color:var(--muted)' },
        el('span', {}, '少ない'), el('span', {}, 'いつもの上限'), el('span', {}, '多い')));
    }
  }

  /* 気をつけたいこと */
  if (safe.notes.length){
    const ul = el('div', { style: 'margin-top:10px' });
    safe.notes.forEach(n => ul.appendChild(el('div', {
      style: 'font-size:var(--t1);line-height:1.65;padding-left:16px;text-indent:-16px;' +
             'color:var(' + (safe.level === 'high' ? '--crit' : '--ink-2') + ')'
    }, '・' + n)));
    box.appendChild(ul);
  }

  /* 牧場のこれまでの実績。
     毎回は要らない話なので、スマホでは畳んでおいて、押したときだけ出します。 */
  box.appendChild(el('hr', { class: 'sep', style: 'margin:10px 0 8px' }));
  const rec = el('div', { hidden: !MilkBoard.showRecord });
  rec.appendChild(farmRecordLine(r, total));
  const tog = el('button', {
    class: 'btn sm ghost',
    style: 'width:100%;min-height:36px;padding:4px 10px;font-size:var(--tmicro)'
  }, (MilkBoard.showRecord ? '▲ ' : '▼ ') + 'この牧場のこれまでと比べる');
  tog.onclick = () => {
    MilkBoard.showRecord = !MilkBoard.showRecord;
    LS.set('sw.mbRec', MilkBoard.showRecord);
    rec.hidden = !MilkBoard.showRecord;
    tog.textContent = (MilkBoard.showRecord ? '▲ ' : '▼ ') + 'この牧場のこれまでと比べる';
  };
  box.appendChild(tog);
  box.appendChild(rec);
  return box;
}

/** 同じ日齢帯・同じくらいの量で育てた牛が、その後どうだったか */
function farmRecordLine(r, total){
  const wrap = el('div', { style: 'font-size:var(--t1);line-height:1.7' });
  const bk = r.day == null ? null : Math.floor(r.day / 10) * 10;
  wrap.appendChild(el('div', {
    style: 'font-size:var(--t0);color:var(--muted);font-weight:700;margin-bottom:4px' },
    'この牧場のこれまで' + (bk == null ? '' : '（' + bk + '〜' + (bk + 9) + '日齢）')));

  if (!(total > 0)){
    wrap.appendChild(el('div', { style: 'color:var(--muted)' },
      '量を入れると、同じくらいの量で育てた牛のその後が出ます。'));
    return wrap;
  }

  const rec = Calc.feedRecord(r.day, total);
  const seen = Calc.feedRangeSeen(r.day);

  if (!rec || rec.n < 3){
    wrap.appendChild(el('div', { style: 'color:var(--muted)' },
      '比べられる記録がまだ足りません',
      rec ? '（' + rec.n + '頭）' : '',
      '。哺乳の記録が貯まると、',
      el('b', {}, 'この量で育てた牛のその後の増体と下痢の出方'),
      'がここに出ます。'));
    if (seen && seen.n >= 3)
      wrap.appendChild(el('div', { style: 'color:var(--muted);margin-top:4px' },
        'これまでこの日齢帯で与えてきた量: ' + r1(seen.min) + '〜' + r1(seen.max) +
        ' L/日（' + seen.n + '頭ぶん）'));
    return wrap;
  }

  const parts = [];
  parts.push(el('div', {},
    '同じくらいの量（' + r1(rec.level) + ' L/日）で育てた ',
    el('b', {}, rec.n + '頭'),
    rec.matched ? '' : '（近い水準）'));
  if (rec.dgP50 != null)
    parts.push(el('div', {},
      'その後20日の増体 ',
      el('b', {}, r2(rec.dgP50) + ' kg/日'),
      el('span', { style: 'color:var(--muted)' },
        '（幅 ' + r2(rec.dgP25) + '〜' + r2(rec.dgP75) + '・' + rec.dgN + '頭）')));
  if (rec.scoursPct != null)
    parts.push(el('div', {},
      'このうち便が乱れた牛 ',
      el('b', { style: rec.scoursPct >= 30 ? 'color:var(--crit)' : '' },
        r0(rec.scoursPct) + '%')));
  parts.forEach(p => wrap.appendChild(p));

  if (seen && seen.rows.length > 1){
    wrap.appendChild(el('div', {
      style: 'margin-top:8px;font-size:var(--t0);color:var(--muted)' },
      'この日齢帯の他の量: ' +
      seen.rows.map(x => r1(x.level) + 'L→' +
        (x.dgP50 != null ? r2(x.dgP50) : '—') + 'kg/日(' + x.n + '頭)').join('　')));
  }
  return wrap;
}

/* ------------------------------------------------------------
   17. 牛舎の見取り図 — 牛をマグネットのように置く
   ------------------------------------------------------------
   ・牛舎とハッチを図として描き、その上に牛の番号札（マグネット）を置きます
   ・置き方は2つ。どちらでも同じことができます。
       1) 牛札をタップ → 置きたい部屋をタップ
       2) 牛札をそのまま指でつまんで、部屋の上まで運ぶ
     現場では手袋のこともあるので、確実に効く「タップ→タップ」を主にして、
     ドラッグはできる人向けの近道として足しています。
   ・配置の編集モードでは、部屋そのものを図の上で動かせます
   ------------------------------------------------------------ */

const PenView = {
  open: null,       // いま開いている部屋
  edit: false,      // 部屋を動かすモード
  holding: null,    // つまんでいる牛の cow_no（タップ→タップ用）
  zoom: LS.get('sw.penZoom', 'fit'),   // fit | s | m | l
  moved: null       // 直前の移動（戻す用）
};

const ZOOM_PX = { s: 20, m: 28, l: 38 };

function viewPens(){
  const wrap = el('div');
  const pens = Pens.all();
  App.setTop('牛舎の配置', pens.length ? pens.length + '部屋' : '未設定', true);

  if (!pens.length){ wrap.appendChild(penSetupCard()); return wrap; }

  if (PenView.holding) wrap.appendChild(holdingBar());
  if (PenView.moved) wrap.appendChild(undoBar());

  wrap.appendChild(penMapCard());
  wrap.appendChild(penTrayCard());
  if (PenView.open){
    const p = Pens.byName(PenView.open);
    if (p) wrap.appendChild(penDetailCard(p));
  }
  wrap.appendChild(penToolsCard());
  if (PenView.edit) wrap.appendChild(penEditCard());
  return wrap;
}

/* ------------------------------------------------------------
   見取り図
   ------------------------------------------------------------ */
function cellPx(){
  if (PenView.zoom !== 'fit') return ZOOM_PX[PenView.zoom] || 28;
  const ext = Pens.extent();
  const avail = Math.min(window.innerWidth, 760) - 28 - 32;   // 画面幅 − 余白
  // 20px を下回ると部屋の名前が読めなくなるので、そこから先は縮めずに横スクロールにする
  return clamp(Math.floor(avail / Math.max(ext.w, 1)), 20, 34);
}

function penMapCard(){
  const c = el('div', { class: 'card' });
  const ext = Pens.extent();
  const cell = cellPx();

  c.appendChild(el('h2', {}, '見取り図',
    el('span', { class: 'note' },
      Store.cows.filter(x => String(x.pen || '').trim()).length + '頭を配置済み')));

  const canvas = el('div', {
    id: 'penCanvas',
    style: 'position:relative;width:' + (ext.w * cell) + 'px;height:' + (ext.h * cell) + 'px;' +
           'background-image:radial-gradient(var(--grid) 1px, transparent 1px);' +
           'background-size:' + cell + 'px ' + cell + 'px;' +
           'background-position:' + (cell / 2) + 'px ' + (cell / 2) + 'px;' +
           'border-radius:10px;margin:2px 0'
  });
  // 建物の枠を先に（後ろに）描いてから、部屋を上に重ねる
  Pens.buildings().forEach(p => canvas.appendChild(buildingBox(p, cell)));
  Pens.all().forEach(p => canvas.appendChild(penBox(p, cell)));

  // 横幅が画面に収まっているときは、箱の中でスクロールさせず、
  // ページごと上から下へ見られるようにする（縦型で見るときはこちらが自然）
  const avail = Math.min(window.innerWidth, 760) - 28 - 32;
  const fitsWidth = ext.w * cell <= avail + 2;
  const scroller = el('div', {
    style: fitsWidth
      ? 'overflow:visible'
      : 'overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;' +
        'padding:0 16px 6px;max-height:62vh;overscroll-behavior:contain'
  }, canvas);
  c.appendChild(scroller);

  /* 拡大縮小 */
  c.appendChild(el('div', { class: 'seg', style: 'margin-top:10px' },
    [['fit', '自動'], ['s', '小'], ['m', '中'], ['l', '大']].map(([v, t]) =>
      el('button', { 'aria-pressed': PenView.zoom === v,
        onclick: () => { PenView.zoom = v; LS.set('sw.penZoom', v); App.render(); } }, t))));

  c.appendChild(el('div', { class: 'hint' },
    PenView.edit
      ? '部屋を指でつまんで動かせます。大きさは、部屋をタップして「広さ」で直せます。'
      : PenView.holding
        ? '置きたい部屋をタップしてください。'
        : '牛の札をタップ → 置きたい部屋をタップ、で移せます。'));
  return c;
}

/* --- 建物の枠（牛は入らない。図の向きを分かりやすくするためのもの） --- */
function buildingBox(p, cell){
  const box = el('div', {
    'data-building': p.name,
    style: 'position:absolute;z-index:0;left:' + (p.x * cell) + 'px;top:' + (p.y * cell) + 'px;' +
           'width:' + (p.w * cell) + 'px;height:' + (p.h * cell) + 'px;' +
           'border-radius:10px;border:2px solid color-mix(in srgb,var(--s2) 40%,transparent);' +
           'background:color-mix(in srgb,var(--s2) 7%,transparent);' +
           (PenView.edit ? 'touch-action:none;cursor:pointer;' : 'pointer-events:none;')
  });
  box.appendChild(el('div', {
    style: 'position:absolute;top:3px;left:7px;font-size:' +
           Math.max(9, Math.min(13, cell * 0.5)) + 'px;font-weight:700;' +
           'color:color-mix(in srgb,var(--s2) 75%,var(--ink));pointer-events:none'
  }, p.name));
  if (PenView.edit) attachPenDrag(box, p, cell);
  return box;
}

/* --- 部屋のマス --- */
function penBox(p, cell){
  const k = penKind(p.kind);
  const L = Pens.load(p);
  const on = PenView.open === p.name;
  const target = !!PenView.holding;

  const box = el('div', {
    'data-pen': p.name,
    style: 'position:absolute;z-index:1;left:' + (p.x * cell) + 'px;top:' + (p.y * cell) + 'px;' +
           'width:' + (p.w * cell) + 'px;height:' + (p.h * cell) + 'px;' +
           'border-radius:8px;overflow:hidden;cursor:pointer;' +
           'border:2px solid ' + (L.over ? 'var(--crit)'
                                : on ? 'var(' + k.color + ')' : 'var(--line)') + ';' +
           'background:' + (target ? 'color-mix(in srgb,var(--s1) 10%,var(--surface))'
                            : on ? 'color-mix(in srgb,var(' + k.color + ') 10%,var(--surface))'
                            : 'var(--surface)') + ';' +
           (target ? 'box-shadow:0 0 0 2px color-mix(in srgb,var(--s1) 45%,transparent);' : '') +
           (PenView.edit ? 'touch-action:none;' : '')
  });

  // 名前と頭数。狭い部屋では頭数を省いて、名前が切れないようにする
  const boxW = p.w * cell;
  const showCount = boxW >= 96;

  if (cell >= 18)
    box.appendChild(el('div', {
      style: 'position:absolute;top:2px;left:5px;right:' + (showCount ? 32 : 5) + 'px;font-size:' +
             Math.max(9, Math.min(13, cell * 0.42)) + 'px;font-weight:700;line-height:1.2;' +
             'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;' +
             'color:var(--ink-2)'
    }, p.name));

  // 中の牛（マグネット）
  const inside = el('div', {
    style: 'position:absolute;left:3px;right:3px;bottom:3px;' +
           'top:' + (cell >= 18 ? Math.max(14, cell * 0.55) : 3) + 'px;' +
           'display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;overflow:hidden'
  });
  const list = Pens.cowsIn(p.name);
  const magnetW = Math.max(30, Math.min(46, cell * 1.5));
  list.slice(0, 12).forEach(cow => inside.appendChild(cowMagnet(cow, magnetW)));
  if (list.length > 12)
    inside.appendChild(el('div', {
      style: 'font-size:10px;color:var(--muted);align-self:center' }, '+' + (list.length - 12)));
  box.appendChild(inside);

  // 頭数／定員
  if (showCount)
    box.appendChild(el('div', {
      style: 'position:absolute;right:4px;top:2px;font-size:' +
             Math.max(9, Math.min(12, cell * 0.38)) + 'px;font-weight:700;pointer-events:none;' +
             'color:var(' + (L.over ? '--crit' : '--muted') + ')'
    }, L.n + (L.cap ? '/' + L.cap : '')));

  box.addEventListener('click', e => {
    if (PenView.edit) return;
    if (e.target.closest('[data-cow]')) return;    // 牛札のタップが優先
    if (PenView.holding){
      const cow = Store.cows.find(x => String(x.cow_no) === PenView.holding);
      PenView.holding = null;
      moveCow(cow, p.name);
      return;
    }
    // タップしたら、その場で出し入れできるポップアップを出す
    PenView.open = p.name;
    openPenSheet(p);
  });

  if (PenView.edit) attachPenDrag(box, p, cell);
  return box;
}

/* --- 牛の番号札（マグネット） --- */
function cowMagnet(cow, w){
  const held = PenView.holding === String(cow.cow_no);
  const g = Calc.groupOf(cow);
  const al = cowAlerts(cow, g);
  const bad = al.some(a => a.k === 'crit');
  const m = el('div', {
    'data-cow': String(cow.cow_no),
    style: 'flex:none;width:' + w + 'px;height:' + Math.round(w * 0.58) + 'px;' +
           'border-radius:5px;display:grid;place-items:center;cursor:pointer;' +
           'font-size:' + Math.max(9, Math.round(w * 0.30)) + 'px;font-weight:800;' +
           'font-variant-numeric:tabular-nums;line-height:1;touch-action:none;' +
           'border:1px solid ' + (bad ? 'var(--crit)' : 'color-mix(in srgb,var(' + g.color + ') 55%,transparent)') + ';' +
           'background:' + (held ? 'var(--ink)'
                            : 'color-mix(in srgb,var(' + g.color + ') 22%,var(--surface))') + ';' +
           'color:' + (held ? 'var(--page)' : 'var(--ink)') + ';' +
           (held ? 'transform:scale(1.12);box-shadow:0 3px 10px rgba(0,0,0,.3)' : '')
  }, cow.tag4 || '—');

  m.addEventListener('click', e => {
    e.stopPropagation();
    if (PenView.edit) return;
    PenView.holding = held ? null : String(cow.cow_no);
    App.render();
  });
  attachMagnetDrag(m, cow);
  return m;
}

/* ------------------------------------------------------------
   つまんで運ぶ（ドラッグ）
   ------------------------------------------------------------
   指を離した場所の下にある部屋に置きます。
   ちょっと触れただけでは動かないよう、8px 以上動いてから始めます。
   ------------------------------------------------------------ */
function attachMagnetDrag(node, cow){
  let ghost = null, startX = 0, startY = 0, dragging = false, id = null;
  let scroller = null;   // 画面の端まで運んだときに、ゆっくり自動で送る

  // 画面の上下の端に近づいたら、そのまま運べるようにスクロールする。
  // これが無いと、図の下にある「置き場」まで指で運べません。
  const autoScroll = (y) => {
    const edge = 90, speed = 12;
    let dir = 0;
    if (y < edge) dir = -1;
    else if (y > window.innerHeight - edge) dir = 1;
    if (!dir){ if (scroller){ clearInterval(scroller); scroller = null; } return; }
    if (scroller) return;
    scroller = setInterval(() => window.scrollBy(0, dir * speed), 16);
  };
  const stopScroll = () => { if (scroller){ clearInterval(scroller); scroller = null; } };

  const findPen = (x, y) => {
    const els = document.elementsFromPoint(x, y);
    for (const e of els){
      const box = e.closest && e.closest('[data-pen]');
      if (box) return box.getAttribute('data-pen');
      if (e.id === 'penTray') return '';          // 置き場に戻す＝部屋なし
    }
    return null;
  };
  const clear = () => {
    stopScroll();
    if (ghost) ghost.remove();
    ghost = null; dragging = false;
    document.querySelectorAll('[data-pen]').forEach(b => b.style.outline = '');
    const t = document.querySelector('#penTray');
    if (t) t.style.borderColor = '';
  };

  node.addEventListener('pointerdown', e => {
    if (PenView.edit) return;
    id = e.pointerId; startX = e.clientX; startY = e.clientY; dragging = false;
  });
  node.addEventListener('pointermove', e => {
    if (e.pointerId !== id || PenView.edit) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!dragging){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      dragging = true;
      node.setPointerCapture(id);
      ghost = el('div', {
        style: 'position:fixed;z-index:300;pointer-events:none;padding:8px 12px;' +
               'border-radius:8px;background:var(--ink);color:var(--page);' +
               'font-size:var(--t3);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35)'
      }, cow.tag4 || '—');
      document.body.appendChild(ghost);
    }
    ghost.style.left = (e.clientX - 26) + 'px';
    ghost.style.top = (e.clientY - 46) + 'px';
    autoScroll(e.clientY);
    const hit = findPen(e.clientX, e.clientY);
    document.querySelectorAll('[data-pen]').forEach(b =>
      b.style.outline = (hit && b.getAttribute('data-pen') === hit)
        ? '3px solid var(--s1)' : '');
    const tray = document.querySelector('#penTray');
    if (tray) tray.style.borderColor = hit === '' ? 'var(--s1)' : '';
  });
  const end = e => {
    if (e.pointerId !== id) return;
    if (!dragging){ clear(); return; }
    const hit = findPen(e.clientX, e.clientY);
    clear();
    if (hit != null && hit !== String(cow.pen || '').trim()){
      PenView.holding = null;
      moveCow(cow, hit);
    } else App.render();
  };
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', () => clear());
}

/* --- 部屋そのものを動かす（編集モード） --- */
function attachPenDrag(box, pen, cell){
  let sx = 0, sy = 0, ox = 0, oy = 0, moving = false, id = null;
  box.addEventListener('pointerdown', e => {
    id = e.pointerId; sx = e.clientX; sy = e.clientY; ox = pen.x; oy = pen.y;
    moving = false;
  });
  box.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moving){
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      moving = true; box.setPointerCapture(id); box.style.zIndex = '20';
      box.style.boxShadow = '0 8px 20px rgba(0,0,0,.28)';
    }
    const nx = Math.max(0, ox + Math.round(dx / cell));
    const ny = Math.max(0, oy + Math.round(dy / cell));
    box.style.left = (nx * cell) + 'px';
    box.style.top = (ny * cell) + 'px';
    box.dataset.nx = nx; box.dataset.ny = ny;
  });
  box.addEventListener('pointerup', async e => {
    if (e.pointerId !== id) return;
    box.style.boxShadow = ''; box.style.zIndex = '';
    if (!moving){ PenView.open = pen.name; App.render(); return; }
    const nx = num(box.dataset.nx, pen.x), ny = num(box.dataset.ny, pen.y);
    if (nx === pen.x && ny === pen.y){ App.render(); return; }
    try {
      await Store.edit('pens', pen.id, { x: String(nx), y: String(ny) });
      MilkBoard.reset(); App.render();
    } catch (err){ toast(err.message || String(err), true); App.render(); }
  });
}

/* ------------------------------------------------------------
   置き場（まだ部屋に入っていない牛）
   ------------------------------------------------------------ */
function penTrayCard(){
  const un = Pens.unassigned()
    .filter(c => { const d = ageDays(c.birth_date); return d != null && d <= 400; })
    .sort((a, b) => (ageDays(a.birth_date) ?? 0) - (ageDays(b.birth_date) ?? 0));

  const c = el('div', { class: 'card' });
  c.appendChild(el('h2', {}, 'まだ置いていない牛',
    el('span', { class: 'note' }, un.length ? un.length + '頭' : 'なし')));

  const tray = el('div', {
    id: 'penTray',
    style: 'display:flex;flex-wrap:wrap;gap:7px;min-height:56px;padding:9px;' +
           'border-radius:10px;border:2px dashed var(--line);background:var(--surface-2)'
  });
  if (!un.length){
    tray.appendChild(el('div', {
      style: 'color:var(--muted);font-size:var(--t1);align-self:center' },
      PenView.holding ? 'ここに置くと「部屋なし」に戻ります'
                      : '全部の牛が部屋に入っています'));
  } else {
    un.slice(0, 40).forEach(cow => tray.appendChild(cowMagnet(cow, 46)));
    if (un.length > 40)
      tray.appendChild(el('div', {
        style: 'font-size:var(--t1);color:var(--muted);align-self:center' },
        'ほか ' + (un.length - 40) + '頭'));
  }
  tray.addEventListener('click', () => {
    if (!PenView.holding) return;
    const cow = Store.cows.find(x => String(x.cow_no) === PenView.holding);
    PenView.holding = null;
    moveCow(cow, '');
  });
  c.appendChild(tray);
  c.appendChild(el('div', { class: 'hint' },
    '札をタップしてから、図の部屋をタップすると入ります。つまんで運んでも入ります。'));
  return c;
}

/* --- つまんでいる最中に出る帯 --- */
function holdingBar(){
  const cow = Store.cows.find(x => String(x.cow_no) === PenView.holding);
  if (!cow) return el('div');
  return el('div', {
    style: 'position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:25;' +
           'display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:12px;' +
           'background:var(--s1);color:#fff;border-radius:var(--r-sm);box-shadow:var(--shadow)' },
    el('div', { style: 'flex:1;min-width:0' },
      el('div', { style: 'font-size:var(--t3);font-weight:800;line-height:1.25' },
        cow.tag4, el('span', { style: 'font-weight:600;font-size:var(--t1)' }, ' を移動中')),
      el('div', { style: 'font-size:var(--t1);opacity:.9;line-height:1.4' },

/* ------------------------------------------------------------
   移動を実行する
   ------------------------------------------------------------ */
async function moveCow(cow, toName, opts){
  opts = opts || {};
  if (!cow) return;
  const from = String(cow.pen || '').trim();
  const to = String(toName || '').trim();
  if (from === to){ App.render(); return; }
  try {
    await Store.saveCow({ cow_no: cow.cow_no, pen: to });
    await Store.add('events', {
      cow_no: cow.cow_no, date: today(), type: '移動',
      detail: (from || '部屋なし') + ' → ' + (to || '部屋なし'), note: ''
    });
    MilkBoard.reset();
    PenView.moved = opts.undo ? null : { cow_no: cow.cow_no, from, to };
    toast(cow.tag4 + ' → ' + (to || '部屋なし'));
    // ポップアップの中から呼ばれたときは、下の画面を描き直さない（ちらつき防止）
    if (!opts.silentRender) App.render();
  } catch (e){
    toast(e.message || String(e), true);
    App.render();
  }
}

/* --- この部屋に入れる --- */
/* ------------------------------------------------------------
   部屋をタップしたときに出るポップアップ
   ------------------------------------------------------------
   ここだけで、その部屋の中身がぜんぶ分かって、出し入れもできます。
   ・4桁を入れる → その牛をこの部屋に入れる
   ・中の牛の「出す」→ 置き場（部屋なし）に戻す
   図まで戻らなくていいので、現場で一番早い道です。
   ------------------------------------------------------------ */
function openPenSheet(pen){
  sheet(pen.name, (b, close) => {
    const body = el('div');
    b.appendChild(body);

    const paint = () => {
      const p = Pens.byName(pen.name) || pen;
      const L = Pens.load(p);
      const k = penKind(p.kind);
      const list = Pens.cowsIn(p.name)
        .sort((a, c) => (ageDays(a.birth_date) ?? 9999) - (ageDays(c.birth_date) ?? 9999));
      body.innerHTML = '';

      body.appendChild(el('div', { class: 'hint', style: 'margin:-4px 0 10px' },
        k.label + '　' + L.n + (L.cap ? ' / ' + L.cap : '') + '頭' +
        (L.over ? '　⚠ 定員を超えています' : '')));

      /* --- 4桁で入れる --- */
      const q = inp({ type: 'text', inputmode: 'numeric', maxlength: 6, autocomplete: 'off',
                      placeholder: '4桁', style: 'font-size:var(--t5);letter-spacing:.10em' });
      const found = el('div', { style: 'margin-top:8px' });
      const put = async cow => {
        if (!cow) return;
        if (String(cow.pen || '') === p.name){ toast('もうこの部屋にいます'); return; }
        await moveCow(cow, p.name, { silentRender: true });
        q.value = ''; paint(); setTimeout(() => q.focus(), 30);
      };
      const look = () => {
        found.innerHTML = '';
        const s = q.value.trim();
        if (!s) return;
        const hits = App.findCow(s).slice(0, 6);
        if (!hits.length){
          found.appendChild(el('div', { class: 'hint' }, 'その番号の牛はいません'));
          return;
        }
        hits.forEach(c => found.appendChild(el('div', { class: 'row',
          onclick: () => put(c) },
          el('div', { class: 'no' }, c.tag4),
          el('div', { class: 'mid' },
            el('div', { class: 'l1' },
              ageDays(c.birth_date) != null ? ageDays(c.birth_date) + '日齢' : '—',
              c.breed && /和|黒毛/.test(c.breed)
                ? el('span', { class: 'badge wagyu', style: 'margin-left:7px' }, '和') : null),
            el('div', { class: 'l2' }, c.pen ? 'いまは ' + c.pen : '部屋なし')),
          el('div', { class: 'rt' }, '入れる'))));
        // 1頭に決まったら、そのまま入れられるように大きなボタンも出す
        if (hits.length === 1 && q.value.trim().length >= 4){
          const go = el('button', { class: 'btn primary', style: 'width:100%;margin-top:8px' },
            hits[0].tag4 + ' を ' + p.name + ' に入れる');
          go.onclick = () => submitting(go, () => put(hits[0]));
          found.appendChild(go);
        }
      };
      q.addEventListener('input', look);
      q.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const hits = App.findCow(q.value.trim());
        if (hits.length === 1) put(hits[0]);
      });
      body.appendChild(field('4桁を入れて、この部屋に入れる', q));
      body.appendChild(found);

      /* --- いま入っている牛 --- */
      body.appendChild(el('div', { class: 'seph' }, 'いまこの部屋にいる牛'));
      if (!list.length){
        body.appendChild(el('div', { class: 'empty', style: 'padding:16px 10px' }, '空です'));
      } else {
        list.forEach(cow => {
          const d = ageDays(cow.birth_date);
          const g = Calc.groupOf(cow);
          const out = el('button', { class: 'btn sm ghost', style: 'flex:none;padding:5px 11px' },
            '出す');
          out.onclick = e => {
            e.stopPropagation();
            submitting(out, async () => {
              await moveCow(cow, '', { silentRender: true });
              paint();
            });
          };
          body.appendChild(el('div', { class: 'row',
            onclick: () => { close(); App.openCow(cow.cow_no); } },
            el('div', { class: 'no' }, cow.tag4 || '—'),
            el('div', { class: 'mid' },
              el('div', { class: 'l1' }, d != null ? d + '日齢' : '—',
                el('span', { class: 'badge', style: 'margin-left:7px;background:color-mix(in srgb,var(' +
                  g.color + ') 18%,transparent)' }, g.short),
                isWagyu(cow) ? el('span', { class: 'badge wagyu', style: 'margin-left:5px' }, '和') : null),
              el('div', { class: 'l2' }, cow.name || '')),
            out));
        });
      }

      /* --- そのほか --- */
      body.appendChild(el('div', { class: 'btnrow', style: 'margin-top:12px' },
        el('button', { class: 'btn sm ghost',
          onclick: () => { close(); openPenAssign(p); } }, '一覧から入れる'),
        el('button', { class: 'btn sm ghost',
          onclick: () => { close(); openPenMoveAll(p); } }, 'まとめて移す'),
        el('button', { class: 'btn sm ghost',
          onclick: () => { close(); openPenForm(p); } }, '部屋を直す')));
    };

    paint();
  }, { focus: false });
}

function openPenAssign(pen){
  sheet(pen.name + ' — 牛を入れる', (b, close) => {
    const q = inp({ type: 'text', inputmode: 'numeric', placeholder: '4桁 / 名号で探す' });
    const hits = el('div');
    const paint = () => {
      hits.innerHTML = '';
      const s = q.value.trim();
      const list = s ? App.findCow(s).slice(0, 12)
        : Pens.unassigned()
            .filter(c => { const d = ageDays(c.birth_date); return d != null && d <= 400; })
            .slice(0, 12);
      if (!list.length){
        hits.appendChild(el('div', { class: 'empty', style: 'padding:20px' },
          s ? '該当なし' : '部屋が未設定の牛はいません'));
        return;
      }
      list.forEach(c => hits.appendChild(el('div', { class: 'row',
        onclick: () => { close(); moveCow(c, pen.name); } },
        el('div', { class: 'no' }, c.tag4),
        el('div', { class: 'mid' },
          el('div', { class: 'l1' },
            ageDays(c.birth_date) != null ? ageDays(c.birth_date) + '日齢' : ''),
          el('div', { class: 'l2' }, c.pen ? 'いまは ' + c.pen : '部屋なし')),
        el('div', { class: 'rt' }, '入れる'))));
    };
    q.addEventListener('input', paint);
    b.appendChild(field('牛を探す', q));
    b.appendChild(hits);
    paint();
  }, { focus: false });
}

/**
 * 見取り図を縦型に並べ直す。
 * 歩く順のまま、横幅を画面に収まる幅まで詰めて、上から下へ流します。
 * 建物の枠は、中に入っていた部屋を包む形に付け直します。
 */
async function relayoutVertical(){
  const rooms = Pens.all();
  if (!rooms.length) return;

  // 並べ直す前に、どの部屋がどの建物の中にいたかを覚えておく
  const inside = {};
  Pens.buildings().forEach(b => {
    inside[b.id] = rooms.filter(p =>
      p.x >= b.x && p.y >= b.y && p.x + p.w <= b.x + b.w && p.y + p.h <= b.y + b.h)
      .map(p => p.name);
  });

  const MAXW = MAP_WIDTH;      // 画面に収まる横幅（マス）
  const pos = {};
  let x = 0, y = 0, lineH = 0;
  rooms.forEach(p => {
    if (x > 0 && x + p.w > MAXW){ x = 0; y += lineH + 1; lineH = 0; }
    pos[p.name] = { x, y };
    x += p.w + 1;
    lineH = Math.max(lineH, p.h);
  });

  try {
    // 部屋も建物も、まとめて1回で送ります（1部屋ずつだと部屋の数だけ待たされます）
    const upd = rooms.map(p => ({ id: p.id, x: String(pos[p.name].x), y: String(pos[p.name].y) }));
    // 建物を、中の部屋を包む大きさに付け直す
    for (const b of Pens.buildings()){
      const names = inside[b.id] || [];
      const mine = names.map(n => pos[n]).filter(Boolean)
        .map(q => ({ q, p: rooms.find(r => pos[r.name] === q) }));
      if (!mine.length) continue;
      const xs = mine.map(m => m.q.x), ys = mine.map(m => m.q.y);
      const x2 = Math.max(...mine.map(m => m.q.x + m.p.w));
      const y2 = Math.max(...mine.map(m => m.q.y + m.p.h));
      upd.push({
        id: b.id,
        x: String(Math.max(0, Math.min(...xs) - 1)),
        y: String(Math.max(0, Math.min(...ys) - 1)),
        w: String(x2 - Math.max(0, Math.min(...xs) - 1) + 1),
        h: String(y2 - Math.max(0, Math.min(...ys) - 1) + 1)
      });
    }
    await Store.editMany('pens', upd);
    MilkBoard.reset();
    toast('縦に並べ直しました'); App.render();
  } catch (e){ toast(e.message || String(e), true); }
}

/** 歩く順を入れ替える */
async function swapRoute(i, j){
  const list = Pens.all();
  const a = list[i], b = list[j];
  if (!a || !b) return;
  try {
    await Store.editMany('pens', [{ id: a.id, col: String(b.seq) },
                                  { id: b.id, col: String(a.seq) }]);
    MilkBoard.reset(); App.render();
  } catch (e){ toast(e.message || String(e), true); }
}

/** 図の並びから順番を作り直す */
async function resetRouteFromMap(){
  const list = Pens.all().slice()
    .sort((a, b) => (a.y - b.y) || (a.x - b.x) || (a.name < b.name ? -1 : 1));
  try {
    await Store.editMany('pens', list.map((p, i) => ({ id: p.id, col: String(i + 1) })));
    MilkBoard.reset();
    toast('図の並びで作り直しました'); App.render();
  } catch (e){ toast(e.message || String(e), true); }
}

function openPenForm(pen){
  const isNew = !pen;
  pen = pen || {};
  sheet(isNew ? '部屋を追加' : pen.name + ' を直す', (b, close) => {
    const k0 = penKind(pen.kind || 'hutch');
    const fName = inp({ type: 'text', value: pen.name || '', placeholder: '例 ハッチ1' });
    const fKind = sel({}, PEN_KIND_LIST.map(k => [k.key, k.label]), pen.kind || 'hutch');
    const fCap  = inp({ type: 'number', inputmode: 'numeric',
                        value: pen.capacity ?? k0.cap, placeholder: '頭' });
    const fW    = inp({ type: 'number', inputmode: 'numeric', value: pen.w ?? k0.w });
    const fH    = inp({ type: 'number', inputmode: 'numeric', value: pen.h ?? k0.h });
    const fNote = inp({ type: 'text', value: pen.note || '', placeholder: '備考' });

    fKind.addEventListener('change', () => {
      const k = penKind(fKind.value);
      if (k.cap) fCap.value = String(k.cap);
      fW.value = String(k.w); fH.value = String(k.h);
    });

    b.appendChild(field('名前', fName, '哺乳のときに読む名前です。「ハッチ1」「育成①」など。'));
    b.appendChild(el('div', { class: 'grid2' },
      field('種類', fKind), field('定員（頭）', fCap)));
    b.appendChild(el('div', { class: 'grid2' },
      field('図での横幅（マス）', fW), field('図での高さ（マス）', fH)));
    b.appendChild(el('div', { class: 'hint', style: 'margin:-8px 0 12px' },
      '場所は、図の上でつまんで動かして決めます。'));
    b.appendChild(field('備考', fNote));

    const btn = el('button', { class: 'btn primary' }, isNew ? '追加する' : '保存する');
    btn.onclick = () => submitting(btn, async () => {
      const name = fName.value.trim();
      if (!name) throw new Error('名前を入れてください');
      const dup = Pens.all().find(p => p.name === name && p.id !== pen.id);
      if (dup) throw new Error('同じ名前の部屋があります');
      const w = clamp(num(fW.value, 3) || 3, 1, 20);
      const h = clamp(num(fH.value, 3) || 3, 1, 20);
      const row = { name, kind: fKind.value, capacity: fCap.value,
                    w: String(w), h: String(h), group_hint: pen.group_hint || '',
                    active: '1', note: fNote.value.trim() };
      if (isNew){
        const pos = findFreeSpot(w, h);
        row.x = String(pos.x); row.y = String(pos.y);
        row.row = String(pos.y + 1);
        row.col = String(Pens.all().length + 1);   // 歩く順は最後に足す
        await Store.add('pens', row);
      } else {
        await Store.edit('pens', pen.id, row);
        if (pen.name && pen.name !== name){
          for (const c of Pens.cowsIn(pen.name))
            await Store.saveCow({ cow_no: c.cow_no, pen: name });
        }
      }
      MilkBoard.reset();
      close(); toast(isNew ? '追加しました' : '保存しました'); App.render();
    });
    b.appendChild(btn);

    if (!isNew){
      const L = Pens.load(pen);
      const del = el('button', { class: 'btn danger ghost', style: 'margin-top:9px' },
        L.n ? 'この部屋を消す（' + L.n + '頭は部屋なしに戻ります）' : 'この部屋を消す');
      del.onclick = () => submitting(del, async () => {
        for (const c of Pens.cowsIn(pen.name))
          await Store.saveCow({ cow_no: c.cow_no, pen: '' });
        await Store.del('pens', pen.id);
        MilkBoard.reset();
        if (PenView.open === pen.name) PenView.open = null;
        close(); toast('消しました'); App.render();
      });
      b.appendChild(del);
    }
  });
}

/** 空いているマス目を探す（新しい部屋の置き場所） */
function findFreeSpot(w, h){
  const ext = Pens.extent();
  for (let y = 0; y < ext.h + h + 2; y++)
    for (let x = 0; x < Math.max(ext.w, w + 2); x++)
      if (Pens.freeAt(x, y, w, h)) return { x, y };
  return { x: 0, y: ext.h + 1 };
}

function openPenBulkAdd(){
  sheet('まとめて追加', (b, close) => {
    const fBase = inp({ type: 'text', value: 'ハッチ', placeholder: '例 ハッチ' });
    const fFrom = inp({ type: 'number', inputmode: 'numeric', value: '1' });
    const fN    = inp({ type: 'number', inputmode: 'numeric', value: '6' });
    const fKind = sel({}, PEN_KIND_LIST.map(k => [k.key, k.label]), 'hutch');
    const fCap  = inp({ type: 'number', inputmode: 'numeric', value: '1' });
    const out = el('div', { class: 'hint' });
    const sync = () => {
      const n = clamp(num(fN.value, 0) || 0, 0, 40);
      const from = num(fFrom.value, 1) || 1;
      const names = [];
      for (let i = 0; i < n; i++) names.push(fBase.value.trim() + (from + i));
      out.textContent = names.length ? '作る部屋: ' + names.join('、') : '';
    };
    [fBase, fFrom, fN].forEach(x => x.addEventListener('input', sync));
    fKind.addEventListener('change', () => {
      const cap = penKind(fKind.value).cap; if (cap) fCap.value = String(cap); sync();
    });

    b.appendChild(field('名前のもと', fBase, '「ハッチ」と入れると ハッチ1、ハッチ2 … と作ります。'));
    b.appendChild(el('div', { class: 'grid2' },
      field('何番から', fFrom), field('いくつ', fN)));
    b.appendChild(el('div', { class: 'grid2' },
      field('種類', fKind), field('定員（頭）', fCap)));
    b.appendChild(el('div', { class: 'hint' }, '図の下のほうに、横一列に並べて作ります。'));
    b.appendChild(out); sync();

    const btn = el('button', { class: 'btn primary' }, '作る');
    btn.onclick = () => submitting(btn, async () => {
      const base = fBase.value.trim();
      if (!base) throw new Error('名前のもとを入れてください');
      const n = clamp(num(fN.value, 0) || 0, 1, 40);
      const from = num(fFrom.value, 1) || 1;
      const k = penKind(fKind.value);
      const ext = Pens.extent();
      const y = Pens.all().length ? ext.h : 0;
      const exist = new Set(Pens.all().map(p => p.name));
      const rows = [];
      const perLine = Math.max(1, Math.floor((MAP_WIDTH + 1) / (k.w + 1)));
      let x = 0, col = 0, yy = y;
      for (let i = 0; i < n; i++){
        const name = base + (from + i);
        if (exist.has(name)) continue;
        if (col >= perLine){ col = 0; x = 0; yy += k.h + 1; }
        rows.push({ id: uid(), name, kind: k.key, capacity: fCap.value,
                    x: String(x), y: String(yy), w: String(k.w), h: String(k.h),
                    row: String(yy + 1),
                    col: String(Pens.all().length + rows.length + 1),
                    group_hint: '', active: '1', note: '' });
        x += k.w + 1; col++;
      }
      if (!rows.length) throw new Error('作る部屋がありません（同じ名前が既にあります）');
      await Store.bulk('pens', rows);
      MilkBoard.reset();
      close(); toast(rows.length + '部屋を作りました'); App.render();
    });
    b.appendChild(btn);
  }, { focus: false });
}

/* 哺乳のときに回る順番（下書き）。若い牛のいる所から順に。 */
const PEN_SEED_ROUTE = [
  '外ハッチ1','外ハッチ2','外ハッチ3',
  '小1','小2','小3','小4','小5','小6',
  'ハッチ1','ハッチ2','ハッチ3','ハッチ4',

/**
 * 下書きの配置を作る。
 * wipe を true にすると、いまある部屋をぜんぶ消してから作り直します
 * （前の版で作った部屋が残っているときのため）。牛は部屋なしに戻ります。
 */
async function seedPens(wipe){
  if (wipe){
    const old = Pens.every();
    // 新しい下書きに無い部屋に入っていた牛は、いったん部屋なしに戻す
    // （名前だけ残ると、どの部屋にも出てこない迷子になってしまうため）
    const keep = new Set(PEN_SEED.map(p => p.name));
    const lost = Store.cows.filter(c => {
      const n = String(c.pen || '').trim();
      return n && !keep.has(n);
    });
    for (const c of lost) await Store.saveCow({ cow_no: c.cow_no, pen: '' });
    for (const p of old) await Store.del('pens', p.id);
  }
  const rows = PEN_SEED.map(p => {
    const i = PEN_SEED_ROUTE.indexOf(p.name);
    return {
      id: uid(), name: p.name, kind: p.kind, capacity: p.cap,
      x: String(p.x), y: String(p.y), w: String(p.w), h: String(p.h),
      row: String(p.y + 1), col: String(i >= 0 ? i + 1 : 0),
      group_hint: '', active: '1', note: ''
    };
  });
  await Store.bulk('pens', rows);
  MilkBoard.reset();
  toast(rows.filter(r => r.kind !== 'building').length + '部屋を作りました');
  App.render();
}

/* ------------------------------------------------------------
   新しい画面が出ていないか、自分で見に行く
   ------------------------------------------------------------
   スマホのブラウザは、いちど読んだ index.html をしばらく持ち続けます。
   そのままだと「更新しました」と言っても皆の画面が古いままになるので、
   アプリのほうから確かめに行きます。

   ・version.txt（数十バイト）だけを、毎回かならず取りに行く
   ・自分（BUILD_ID）より新しければ、?v=新しい日時 を付けて読み直す
     → ブラウザにとっては初めて見るURLなので、必ず新しいものが来る
   ・URLを皆に配り直す必要はありません。ブックマークは元のままで大丈夫です
   ・version.txt が無い・読めないときは、何もしません（今までどおり動く）
   ------------------------------------------------------------ */
const Updater = {
  latest: null,      // サーバにある版
  stuck: false,      // 読み直したのに変わらなかった（＝置き忘れ）

  /** いま開いているページの、問い合わせを外したURL */
  baseUrl(){ return location.origin + location.pathname; },

  async check(opts){
    opts = opts || {};
    if (location.protocol === 'file:') return null;      // 手元で開いているときは何もしない
    if (/@@/.test(BUILD_ID)) return null;                // 版が埋め込まれていない
    let remote = null;
    try {
      const res = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      remote = (await res.text()).trim();
    } catch (e){ return null; }                          // 圏外など。黙って諦める
    if (!remote || remote === BUILD_ID){
      sessionStorage.removeItem('sw.tried');
      this.latest = null;
      return null;
    }
    this.latest = remote;

    // 読み直したのにまだ古い＝index.html の置き忘れ。
    // 何度も読み直すと画面が固まるので、1回でやめて案内だけ出す。
    if (sessionStorage.getItem('sw.tried') === remote){
      this.stuck = true;
      return remote;
    }
    if (opts.auto === false) return remote;
    this.apply(remote);
    return remote;
  },

  /** 読み直す */
  apply(remote){
    sessionStorage.setItem('sw.tried', remote || this.latest || '1');
    location.replace(this.baseUrl() + '?v=' + encodeURIComponent(remote || this.latest || Date.now()));
  }
};

/* 起動処理 */

  App.render();
  // 画面より先に、新しい版が出ていないかを確かめる。
  // 新しければここで読み直しが走るので、この先は動きません。
  await Updater.check();
  try {
    await Store.init();
    Analysis.reset();
    MilkBoard.reset();
    App.ready = true;
    App.render();
    if (!Store.isRemote && !Store.cows.length) showWelcome();

    App.ready = true;
    App.view = 'settings';
    App.render();
    const main = $('#main .view');
    if (main) main.insertBefore(el('div', { class: 'note crit' },
      el('b', {}, '接続できませんでした。'), ' ', e.message), main.firstChild);
  }
})();

  sheet('はじめに', (b, close) => {
    b.appendChild(el('div', { class: 'note' },
      el('b', {}, 'いまは「お試しモード」です。'),
      ' 入力したデータはこの端末にだけ残り、他の人とは共有されません。'));
    b.appendChild(el('div', { style: 'font-size:calc(13.5px * var(--fs));line-height:1.9;margin-bottom:16px' },
      '農場の方と共有するには、Googleスプレッドシートと繋ぐ設定が必要です。',
      el('br'), '同梱の「セットアップ手順書」に沿って一度だけ設定すれば、',
      'あとはURLを送るだけで誰でも使えるようになります。'));
    b.appendChild(el('button', { class: 'btn primary',
      onclick: () => { close(); App.go('settings'); } }, '接続の設定をする'));
    b.appendChild(el('button', { class: 'btn ghost', style: 'margin-top:8px',
      onclick: () => { close(); loadDemo(); } }, 'まずお試しデータで動きを見る'));
    b.appendChild(el('button', { class: 'btn ghost', style: 'margin-top:8px', onclick: close },
      '空の状態から使う'));
  }, { focus: false });
}

/* お試し用のサンプル（共有モードでは絶対に作りません） */
async function loadDemo(){
  if (Store.isRemote){ toast('共有モードではお試しデータは作れません', true); return; }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const cows = [], weights = [], milk = [], starter = [], repro = [];
  const base = new Date(); base.setDate(base.getDate() - 400);

  for (let i = 0; i < 26; i++){
    const no = '1234567' + String(100 + i).slice(-3);
    const ageOffset = Math.round(rnd(5, 380));
    const birth = ymd(new Date(Date.now() - ageOffset * DAY));
    const small = Math.random() < .3;
    const bw = small ? rnd(30, 38) : rnd(38, 48);
    cows.push({ cow_no: no, tag4: no.slice(-4), neck_no: String(200 + i),
      name: '', birth_date: birth, sex: '雌', breed: i % 7 === 0 ? '和牛' : 'ホルスタイン',
      dam_no: '', sire_code: 'S' + (100 + (i % 5)), birth_weight: r1(bw),
      program: '', status: '育成' });

    const dg = small ? rnd(.55, .78) : rnd(.75, 1.0);
    for (let d = 0; d <= Math.min(ageOffset, 400); d += 14){
      const kg = bw + dg * d * rnd(.94, 1.06);
      const chest = Calc.chestForWeight(kg);
      if (chest) weights.push({ cow_no: no, date: addDays(birth, d),
        chest_cm: r1(chest), weight_actual: '', weight_est: r1(kg), source: '胸囲' });
    }
    const wean = small ? 95 : 78;
    for (let d = 1; d <= Math.min(ageOffset, wean); d++){
      const pk = small ? 'b' : 'a';
      const p = Calc.programAt(pk, d);
      if (p && p.perDay > 0) milk.push({ cow_no: no, date: addDays(birth, d),
        milk_type: d <= 2 ? '初乳' : '代用乳', volume_l: r1(p.perDay * rnd(.95, 1)),
        powder_g_per_l: 140, feeding_no: '1日分' });
      const s = Math.max(0, (d - 10) * (small ? .022 : .032) * rnd(.8, 1.2));
      if (s > 0.01) starter.push({ cow_no: no, date: addDays(birth, d), intake_kg: r2(s) });
    }
    if (ageOffset > 400){
      repro.push({ cow_no: no, date: addDays(birth, 400), type: 'AI', sire_code: 'S200' });
    }
  }
  await Store.bulk('cows', cows);
  await Store.bulk('weights', weights);
  await Store.bulk('milk_feed', milk);
  await Store.bulk('starter', starter);
  if (repro.length) await Store.bulk('repro', repro);
  await Store.init();
  toast('お試しデータを作りました（' + cows.length + '頭）');
  App.go('herd');
}
