                        placeholder: '母の番号（4桁でも可）' });
    const fSireC= inp({ type: 'text', value: cow.sire_code || '', placeholder: '精液コード' });
    const fSireN= inp({ type: 'text', value: cow.sire_name || '', placeholder: '種雄牛名' });
    const fBW   = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
                        value: cow.birth_weight || '', placeholder: 'kg' });
    const fBC   = inp({ type: 'number', inputmode: 'decimal', step: '0.5',
                        value: cow.birth_chest || '', placeholder: 'cm' });
    const fPen  = inp({ type: 'text', value: cow.pen || '', placeholder: '牛房・グループ' });
    const fProg = sel({}, [['','自動（品種と出生体重で判定）']].concat(
      Calc.programKeys().map(k => [k, Calc.programMeta(k).name])), cow.program || '');
    const fNote = el('textarea', { class: 'inp' }, cow.note || '');

    const estOut = el('div', { class: 'hint' });
    const syncEst = () => {
      const w = Calc.estWeight(fBC.value);
      estOut.textContent = w == null ? '' : '胸囲からの推定体重 ' + r1(w) + ' kg';
      if (w != null && !fBW.value) fBW.placeholder = r1(w) + ' （胸囲からの推定）';
    };
    fBC.addEventListener('input', syncEst);

    const tag4Out = el('div', { class: 'hint' });
    const syncTag = () => {
      const d = mid4(fNo.value);
      tag4Out.textContent = d ? 'この牛の4桁は ' + d + ' になります（' + fmtEarTag(fNo.value) + '）' : '';
    };
    fNo.addEventListener('input', syncTag);
    b.appendChild(field('個体識別番号（耳標10桁）<span class="opt">必須</span>', fNo,
      '4桁は自動で決まります。12345-6789-0 なら 6789 です。'));
    b.appendChild(tag4Out);
    syncTag();
    b.appendChild(field('4桁を手で決める <span class="opt">ふつうは空欄</span>', fMgmt,
      '耳標がまだ分からないときや、別の番号で呼んでいるときだけ入れてください。'));
    b.appendChild(el('div', { class: 'grid2' },
      field('生年月日', fBirth), field('性別', fSex)));
    b.appendChild(el('div', { class: 'grid2' },
      field('品種', fBreed), field('ネック番号 <span class="opt">任意</span>', fNeck)));
    b.appendChild(field('名号 <span class="opt">任意</span>', fName));
    b.appendChild(el('div', { class: 'grid2' },
      field('出生体重 (kg)', fBW), field('出生時の胸囲 (cm)', fBC)));
    b.appendChild(estOut);
    b.appendChild(field('哺乳プログラムの群', fProg,
      '空欄なら、和牛は和牛用の群へ、ホルスタインは出生体重が牧場の下位25%に入る子を発育停滞群へ自動で振り分けます。'));
    b.appendChild(el('hr', { class: 'sep' }));
    b.appendChild(el('div', { class: 'grid2' },
      field('母の4桁', fDamM), field('母の耳標10桁 <span class="opt">任意</span>', fDam)));
    b.appendChild(el('div', { class: 'grid2' },
      field('精液コード', fSireC), field('種雄牛名', fSireN)));
    b.appendChild(el('div', { class: 'grid2' },
      field('牛房 <span class="opt">任意</span>', fPen), null));
    b.appendChild(field('備考', fNote));

    const btn = el('button', { class: 'btn primary' }, isNew ? '登録する' : '保存する');
    btn.onclick = () => submitting(btn, async () => {
      const mgmt = fMgmt.value.trim().replace(/[\s　]/g, '');
      let no = fNo.value.trim().replace(/[^0-9]/g, '');
      if (!no && !mgmt) throw new Error('管理番号か個体識別番号のどちらかを入れてください');
      // 耳標がまだ分からない場合は管理番号から仮のキーを作る（あとから直せます）
      if (!no) no = 'M' + mgmt;
      let bw = fBW.value;
      if (!bw && fBC.value){ const w = Calc.estWeight(fBC.value); if (w) bw = r1(w); }
      const saved = await Store.saveCow({
        cow_no: no, mgmt_no: mgmt, neck_no: fNeck.value.trim(), name: fName.value.trim(),
        birth_date: fBirth.value, sex: fSex.value, breed: fBreed.value,
        dam_mgmt_no: fDamM.value.trim(), dam_no: fDam.value.trim(),
        sire_code: fSireC.value.trim(),
        sire_name: fSireN.value.trim(), birth_weight: bw, birth_chest: fBC.value,
        pen: fPen.value.trim(), note: fNote.value.trim(), program: fProg.value,
        status: cow.status || '育成'
      });
      MilkBoard.reset();
      close(); toast(isNew ? '登録しました' : '保存しました');
      searchBuf = '';
      App.openCow(saved.cow_no);
      // 出生登録のすぐ後は、初乳を入れる流れに乗せる。
      // 初乳はあとから思い出して書けるものではないので、ここで一度だけ聞きます。
      if (isNew) setTimeout(() => openColostrumForm(saved), 350);
    });
    b.appendChild(btn);
  });
}

/* --- 体重・胸囲 --- */
function openWeightForm(cow){
  sheet(cow.tag4 + ' — 体重・胸囲', (b, close) => {
    const fDate = inp({ type: 'date', value: today() });
    const fChest = inp({ type: 'number', inputmode: 'decimal', step: '0.5', placeholder: 'cm' });
    const fW = inp({ type: 'number', inputmode: 'decimal', step: '0.1', placeholder: 'kg（あれば）' });
    const fH = inp({ type: 'number', inputmode: 'decimal', step: '0.5', placeholder: 'cm（あれば）' });
    const fOp = inp({ type: 'text', value: Store.cfg.user || '', placeholder: '測定者' });
    const fNote = inp({ type: 'text', placeholder: '備考' });

    const wfOut = el('div', { class: 'v' }, '—', el('small', {}, 'kg'));
    const wfPct = el('div', { class: 'd' }, '');
    const out = el('div', { class: 'tile', style: 'margin:2px 0 14px' },
      el('div', { class: 'k' }, '推定体重'), wfOut, wfPct);
    const sync = () => {
      const w = num(fW.value) ?? Calc.estWeight(fChest.value);
      wfOut.firstChild.nodeValue = w == null ? '—' : r1(w);
      const day = daysBetween(cow.birth_date, fDate.value);
      const p = w != null && day != null ? Calc.percentile(cow, { day, kg: w }) : null;
      const ful = w != null && day != null ? Calc.fulfillment(day, w) : null;
      const trust = num(Calc.S()['weight.trust_max_cm'], 120);
      const over = num(fChest.value) != null && num(fChest.value) > trust && !num(fW.value);
      wfPct.textContent = over
        ? '胸囲' + r0(trust) + 'cmを超えています — 推定式の適用範囲外、参考値です'
        : [ful != null ? '充足率 ' + r1(ful) + '%' : '',
           p ? '牧場内 ' + r0(p.pct) + 'パーセンタイル' : ''].filter(Boolean).join('　')
          || (w == null ? '胸囲を入れてください' : '');
    };
    fChest.addEventListener('input', sync);
    fW.addEventListener('input', sync);
    fDate.addEventListener('change', sync);

    b.appendChild(field('測定日', fDate));
    b.appendChild(field('胸囲 (cm)', fChest,
      '胸囲だけで大丈夫です。体重は牧場の式で自動計算します。'));
    b.appendChild(out);
    b.appendChild(el('div', { class: 'grid2' },
      field('実測体重 (kg) <span class="opt">任意</span>', fW),
      field('体高 (cm) <span class="opt">任意</span>', fH)));
    b.appendChild(el('div', { class: 'hint' },
      '実測体重を入れた場合はそちらを優先して記録します。体高も標準値と比べられます。'));
    b.appendChild(el('div', { class: 'grid2' }, field('測定者', fOp), field('備考', fNote)));

    const btn = el('button', { class: 'btn primary' }, '記録する');
    btn.onclick = () => submitting(btn, async () => {
      if (!fChest.value && !fW.value) throw new Error('胸囲か体重のどちらかを入れてください');
      const est = Calc.estWeight(fChest.value);
      await Store.replace('weights', { cow_no: cow.cow_no, date: fDate.value }, [{
        cow_no: cow.cow_no, date: fDate.value,
        chest_cm: fChest.value, height_cm: fH.value, weight_actual: fW.value,
        weight_est: est != null ? r1(est) : '',
        source: fW.value ? '実測' : '胸囲', operator: fOp.value.trim(), note: fNote.value.trim()
      }]);
      Analysis.reset();
      Store.saveCfg({ user: fOp.value.trim() });
      close(); toast('記録しました'); App.render();
    });

/* --- 哺乳 --- */
function openMilkForm(cow){
  sheet(cow.tag4 + ' — 哺乳', (b, close) => {
    const day = ageDays(cow.birth_date);
    const pk = Calc.programKey(cow);
    const meta = Calc.programMeta(pk);
    const prog = Calc.programAt(pk, day);
    const S0 = Calc.S();
    const fDate = inp({ type: 'date', value: today() });
    const fType = sel({}, MILK_TYPES,
      day != null && day <= num(Calc.S()['group.colostrum_days'], 3) ? '初乳' : '代用乳');
    const fNo = sel({}, [['1','1回目（朝 ' + S0['routine.am_milk'] + '）'],
                         ['2','2回目（夕 ' + S0['routine.pm_milk'] + '）'],
                         ['3','3回目'],['','まとめて1日分']], '1');
    const fL = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
                     value: prog ? r1(prog.perFeed) : '', placeholder: 'L' });
    const fG = inp({ type: 'number', inputmode: 'numeric', step: '1',
                     value: String(Calc.powderConc(today())), placeholder: 'g/L' });
    const fNote = inp({ type: 'text', placeholder: '備考（飲み残しなど）' });

    const dmOut = el('div', { class: 'hint' });
    const gWrap = el('div');
    const sync = () => {
      const dm = Calc.milkDM({ volume_l: fL.value, milk_type: fType.value,
                               powder_g_per_l: fG.value, date: fDate.value });
      const L = num(fL.value, 0) || 0;
      dmOut.textContent = dm
        ? (fType.value === '代用乳'
            ? '粉 ' + r0(L * (num(fG.value) ?? Calc.powderConc(fDate.value))) + ' g ／ 乾物 ' + r2(dm) + ' kg'
            : '乾物 ' + r2(dm) + ' kg')
        : '';
      gWrap.hidden = fType.value !== '代用乳';
    };
    [fL, fG, fType, fDate].forEach(x => x.addEventListener('input', sync));
    fType.addEventListener('change', sync);

    if (prog)
      b.appendChild(el('div', { class: 'note' },
        el('b', {}, day + '日齢 · ' + meta.name + '：' + r1(prog.perFeed) + ' L/回'),
        '（1日 ' + r1(prog.perDay) + ' L・粉 ' + r0(prog.powderPerFeed) + ' g/回）'));

    b.appendChild(el('div', { class: 'grid2' }, field('日付', fDate), field('回', fNo)));
    b.appendChild(field('種類', fType));
    b.appendChild(field('給与量 (L)', fL));
    gWrap.appendChild(field('調乳濃度 (g/L)', fG,
      'お湯1Lあたりの粉の量。冬期の値は設定画面で切り替わります。'));
    b.appendChild(gWrap);
    b.appendChild(dmOut);
    b.appendChild(field('備考', fNote));

    const save = async () => {
      if (!fL.value) throw new Error('給与量を入れてください');
      const row = {
        cow_no: cow.cow_no, date: fDate.value, feeding_no: fNo.value,
        milk_type: fType.value, volume_l: fL.value,
        powder_g_per_l: fType.value === '代用乳' ? fG.value : '',
        note: fNote.value.trim()
      };
      // 同じ牛・同じ日・同じ回の記録は入れ直す（訂正できるように）
      await Store.replace('milk_feed',
        { cow_no: cow.cow_no, date: fDate.value, feeding_no: fNo.value }, [row]);
      Analysis.reset(); MilkBoard.reset();
    };
    const btn = el('button', { class: 'btn primary' }, '記録する');
    btn.onclick = () => submitting(btn, async () => {
      await save(); close(); toast('記録しました'); App.render();
    });
    const btn2 = el('button', { class: 'btn ghost', style: 'margin-top:8px' }, '記録して続けて次の牛へ');
    btn2.onclick = () => submitting(btn2, async () => {
      await save(); close(); toast(cow.tag4 + ' を記録'); App.go('search');
    });
    b.appendChild(btn); b.appendChild(btn2);
    sync();
  });
}

/* --- スターター --- */
function openStarterForm(cow){
  sheet(cow.tag4 + ' — スターター', (b, close) => {
    const fDate = inp({ type: 'date', value: today() });
    const fOff = inp({ type: 'number', inputmode: 'decimal', step: '0.05', placeholder: 'kg' });
    const fRef = inp({ type: 'number', inputmode: 'decimal', step: '0.05', placeholder: 'kg' });
    const fInt = inp({ type: 'number', inputmode: 'decimal', step: '0.05', placeholder: 'kg' });
    const fNote = inp({ type: 'text', placeholder: '備考' });
    const out = el('div', { class: 'hint' });
    const sync = () => {
      let kg = num(fInt.value);
      if (kg == null){
        const o = num(fOff.value);
        kg = o == null ? null : Math.max(0, o - (num(fRef.value, 0) || 0));
      }
      out.textContent = kg == null ? ''
        : '摂取 ' + r2(kg) + ' kg ／ 乾物 ' + r2(Calc.starterDM(kg)) + ' kg';
    };
    [fOff, fRef, fInt].forEach(x => x.addEventListener('input', sync));

    b.appendChild(field('日付', fDate));
    b.appendChild(el('div', { class: 'grid2' },
      field('給与量 (kg)', fOff), field('残飼 (kg)', fRef)));
    b.appendChild(field('摂取量を直接入れる場合 (kg)', fInt,
      '給与量と残飼を入れれば自動で計算します。'));
    b.appendChild(out);
    b.appendChild(field('備考', fNote));

    const btn = el('button', { class: 'btn primary' }, '記録する');
    btn.onclick = () => submitting(btn, async () => {
      let kg = num(fInt.value);
      if (kg == null){
        const o = num(fOff.value); if (o == null) throw new Error('給与量か摂取量を入れてください');
        kg = Math.max(0, o - (num(fRef.value, 0) || 0));
      }
      await Store.replace('starter', { cow_no: cow.cow_no, date: fDate.value }, [{
        cow_no: cow.cow_no, date: fDate.value, offered_kg: fOff.value,
        refused_kg: fRef.value, intake_kg: r2(kg), note: fNote.value.trim()
      }]);
      close(); toast('記録しました'); App.render();
    });
    b.appendChild(btn);
  });
}

/* --- 初乳 ---------------------------------------------------
   初乳は「あとから取り返せない」記録です。分娩からの時間・量・Brix を
   その場で残せるように、代用乳とは別のフォームにしています。
   ------------------------------------------------------------ */
const COLOSTRUM_SOURCE = ['母初乳', '凍結初乳', '他頭の初乳', '代用初乳', '移行乳'];
const COLOSTRUM_METHOD = ['哺乳瓶', 'バケツ', '経口カテーテル'];

function openColostrumForm(cow, row){
  row = row || {};
  const S = Calc.S();
  sheet(cow.tag4 + ' — 初乳を飲ませた記録', (b, close) => {
    const targetL = Calc.colostrumTargetL(cow);

    const fDate = inp({ type: 'date', value: row.date || today() });
    const fNo   = sel({}, [['1', '1回目'], ['2', '2回目'], ['3', '3回目']],
                      row.feeding_no || '1');
    const fHrs  = inp({ type: 'number', inputmode: 'decimal', step: '0.5',
                        value: row.hours_after_birth ?? '', placeholder: '例 1.5' });
    const fVol  = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
                        value: row.volume_l ?? '',
                        placeholder: targetL ? String(targetL) : 'L' });
    const fBrix = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
                        value: row.brix_pct ?? '', placeholder: '例 24.0' });
    const fSrc  = sel({}, COLOSTRUM_SOURCE, row.source || '母初乳');
    const fMth  = sel({}, COLOSTRUM_METHOD, row.method || '哺乳瓶');
    const fNote = inp({ type: 'text', value: row.note || '', placeholder: '備考' });

    /* 入れたそばから判定を出す */
    const out = el('div', { style: 'margin:2px 0 14px' });
    const sync = () => {
      out.innerHTML = '';
      const rows = [];
      const t = Calc.colostrumTimingGrade(fHrs.value);
      const q = Calc.colostrumBrixGrade(fBrix.value);
      if (t) rows.push(['飲ませた時間', t]);
      if (q) rows.push(['初乳の質', q]);
      const v = num(fVol.value);
      if (v != null && targetL != null){
        rows.push(['量', v >= targetL
          ? { label: '足りています', tone: 'good', hint: r1(v) + ' L（目安 ' + r1(targetL) + ' L）' }
          : { label: 'もう少し', tone: 'warn',
              hint: r1(v) + ' L。目安は出生体重の' +
                    r0(num(S['colostrum.volume_pct_bw'], 10)) + '%＝' + r1(targetL) + ' L' }]);
      }
      if (!rows.length){
        out.appendChild(el('div', { class: 'hint' },
          targetL != null
            ? 'この子の目安は ' + r1(targetL) + ' L（出生体重 ' + r1(num(cow.birth_weight)) + ' kg の' +
              r0(num(S['colostrum.volume_pct_bw'], 10)) + '%）です。'
            : '出生体重を登録すると、この子に必要な量が出せます。'));
        return;
      }
      rows.forEach(([k, g]) => out.appendChild(el('div', {
        style: 'display:flex;align-items:baseline;gap:9px;padding:5px 0;font-size:var(--t1)' },
        el('span', { style: 'color:var(--muted);min-width:96px' }, k),
        el('span', { class: 'badge ' + (g.tone === 'good' ? 'good' : g.tone === 'warn' ? 'warn' : 'crit') },
          g.label),
        el('span', { style: 'color:var(--ink-2)' }, g.hint))));
    };
    [fHrs, fVol, fBrix].forEach(x => x.addEventListener('input', sync));

    b.appendChild(el('div', { class: 'note' },
      el('b', {}, '初乳は早いほど・濃いほど吸収されます。'),
      ' 分娩後', r0(num(S['colostrum.first_hours_best'], 2)), '時間以内に、体重の',
      r0(num(S['colostrum.volume_pct_bw'], 10)), '%を目安に。',
      'Brix ', r0(num(S['colostrum.brix_good'], 22)), '%以上が合格です。'));

    b.appendChild(el('div', { class: 'grid2' }, field('日付', fDate), field('何回目', fNo)));
    b.appendChild(el('div', { class: 'grid2' },
      field('分娩から何時間後', fHrs),
      field('飲んだ量 (L)', fVol)));
    b.appendChild(el('div', { class: 'grid2' },
      field('Brix (%) <span class="opt">屈折計</span>', fBrix),
      field('種類', fSrc)));
    b.appendChild(field('飲ませ方', fMth));
    b.appendChild(out);
    b.appendChild(field('備考', fNote));
    sync();

    const btn = el('button', { class: 'btn primary' }, '記録する');
    btn.onclick = () => submitting(btn, async () => {
      if (num(fVol.value) == null) throw new Error('飲んだ量を入れてください');
      const rec = {
        cow_no: cow.cow_no, date: fDate.value, kind: '給与',
        feeding_no: fNo.value, hours_after_birth: fHrs.value, volume_l: fVol.value,
        brix_pct: fBrix.value, source: fSrc.value, method: fMth.value,
        serum_tp: '', serum_brix: '',
        operator: Store.cfg.user || '', note: fNote.value.trim()
      };
      // 同じ日の同じ回次は入れ直す（二度押しても増えません）
      await Store.replace('colostrum',
        { cow_no: cow.cow_no, date: fDate.value, kind: '給与', feeding_no: fNo.value }, [rec]);
      Store.invalidate(cow.cow_no);
      close(); toast('初乳を記録しました'); App.render();
    });
    b.appendChild(btn);
  });
}

/** 生後1週の血液検査から、初乳の移行がうまくいったかを残す */
function openTransferForm(cow, row){
  row = row || {};
  const S = Calc.S();
  sheet(cow.tag4 + ' — 初乳の移行判定', (b, close) => {
    const fDate = inp({ type: 'date', value: row.date || today() });
    const fTp   = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
                        value: row.serum_tp ?? '', placeholder: '例 6.4' });
    const fBrix = inp({ type: 'number', inputmode: 'decimal', step: '0.1',
                        value: row.serum_brix ?? '', placeholder: '例 8.6' });
    const fNote = inp({ type: 'text', value: row.note || '', placeholder: '備考' });
    const out = el('div', { style: 'margin:2px 0 14px' });

    const sync = () => {
      out.innerHTML = '';
      const tp = num(fTp.value) ?? Calc.serumBrixToTp(fBrix.value);
      const g = Calc.colostrumTransferGrade(tp);
      const d = daysBetween(cow.birth_date, fDate.value);
      const lo = num(S['colostrum.check_day_min'], 1), hi = num(S['colostrum.check_day_max'], 7);
      if (d != null && (d < lo || d > hi))
        out.appendChild(el('div', { class: 'note warn' },
          '生後 ' + d + '日です。移行判定は生後' + r0(lo) + '〜' + r0(hi) +
          '日の採血で見ます。'));
      if (!g){
        out.appendChild(el('div', { class: 'hint' },
          '総蛋白か血清Brixのどちらかを入れてください。両方あれば総蛋白を使います。'));
        return;
      }
      out.appendChild(el('div', {
        style: 'display:flex;align-items:baseline;gap:9px;font-size:var(--t1)' },
        el('span', { class: 'badge ' + (g.tone === 'good' ? 'good' : g.tone === 'warn' ? 'warn' : 'crit') },
          g.label),
        el('span', { style: 'color:var(--ink-2)' }, g.hint)));
      if (g.key === 'poor' || g.key === 'fair')
        out.appendChild(el('div', { class: 'hint' },
          'この子は下痢・肺炎が出やすい個体として、しばらく重点的に見てください。'));
    };
    [fTp, fBrix, fDate].forEach(x => x.addEventListener('input', sync));

    b.appendChild(el('div', { class: 'note' },
      '生後', r0(num(S['colostrum.check_day_min'], 1)), '〜',
      r0(num(S['colostrum.check_day_max'], 7)), '日に採血して、',
      el('b', {}, '初乳がちゃんと身についたか'), 'を確かめる記録です。'));
    b.appendChild(field('検査日', fDate));
    b.appendChild(el('div', { class: 'grid2' },
      field('血清総蛋白 (g/dL)', fTp), field('血清Brix (%) <span class="opt">任意</span>', fBrix)));
    b.appendChild(out);
    b.appendChild(field('備考', fNote));
    sync();

    const btn = el('button', { class: 'btn primary' }, '記録する');
    btn.onclick = () => submitting(btn, async () => {
      if (num(fTp.value) == null && num(fBrix.value) == null)
        throw new Error('総蛋白か血清Brixを入れてください');
      await Store.replace('colostrum',
        { cow_no: cow.cow_no, date: fDate.value, kind: '移行判定' },
        [{ cow_no: cow.cow_no, date: fDate.value, kind: '移行判定', feeding_no: '',
           hours_after_birth: '', volume_l: '', brix_pct: '', source: '', method: '',
           serum_tp: fTp.value, serum_brix: fBrix.value,
           operator: Store.cfg.user || '', note: fNote.value.trim() }]);
      Store.invalidate(cow.cow_no);
      close(); toast('移行判定を記録しました'); App.render();
    });
    b.appendChild(btn);
  });
}

/** 今日の哺乳入力がどこまで進んだか */
function todayProgress(){
  const pre = preweanCows().filter(c => {
    const p = Calc.programAt(Calc.programKey(c), ageDays(c.birth_date));
    return p && p.perDay > 0;
  });
  const set = Store.todayMilk || new Set();
  return { total: pre.length, done: pre.filter(c => set.has(String(c.cow_no))).length };
}

/** 今日いちばん気にしたい牛（牛群一覧と同じ判定を使う） */
function todayAlerts(){
  return Store.cows.map(c => {
    const g = Calc.groupOf(c);
    if (g.key === 'sold') return null;
    const alerts = cowAlerts(c, g);
    return alerts.length ? { c, g, d: ageDays(c.birth_date), alerts } : null;
  }).filter(Boolean)
    .sort((a, b) => {
      const w = x => x.alerts.some(y => y.k === 'crit') ? 0 : 1;
      return (w(a) - w(b)) || ((a.d ?? 99999) - (b.d ?? 99999));
    });
}

function preweanCows(){
  const keys = Calc.programKeys();
  const maxD = (keys.length ? Math.max(...keys.map(k => Calc.programMeta(k).weanMax)) : 100) + 10;
  return Store.cows.filter(c => {
    if (/売却|廃用|死亡|出荷/.test(String(c.status || ''))) return false;
    const d = ageDays(c.birth_date);
    return d != null && d >= 0 && d <= maxD;
  }).sort((a, b) => ageDays(a.birth_date) - ageDays(b.birth_date));
}

        const feeds = Calc.perDay();

                      <= num(Calc.S()['group.colostrum_days'], 3) ? '初乳' : '代用乳'),
          volume_l: r2(v * feeds), powder_g_per_l: Calc.powderConc(fDate.value),
          note: r1(v) + 'L × ' + feeds + '回' });
      }
      else if (kind === 'starter') rows.push({ cow_no: i.cow.cow_no, date: fDate.value,
        offered_kg: '', refused_kg: '', intake_kg: v });
      else { const w = Calc.estWeight(v);
        rows.push({ cow_no: i.cow.cow_no, date: fDate.value, chest_cm: v,
          height_cm: i.fh && i.fh.value ? i.fh.value : '',
          weight_actual: '', weight_est: w != null ? r1(w) : '', source: '胸囲',
          operator: Store.cfg.user || '' }); }
    });
    if (!rows.length) throw new Error('入力された値がありません');
    const table = kind === 'milk' ? 'milk_feed' : kind === 'starter' ? 'starter' : 'weights';
    // 牛ごとに「その日の記録」を入れ直す。二度押しても増えず、直した値が残ります。
    let n = 0;
    for (const row of rows){
      await Store.replace(table, { cow_no: row.cow_no, date: row.date }, [row]);
      n++;
      btn.innerHTML = ''; btn.appendChild(document.createTextNode('保存中… ' + n + '/' + rows.length));
    }
    Analysis.reset(); MilkBoard.reset();
    toast(rows.length + '頭分 保存しました');
    App.go('entry');
  });
  wrap.appendChild(btn);
  return wrap;
}

   11. 牛群一覧
   ------------------------------------------------------------ */
let herdFilter = { breed: '', group: '', alert: false };
let herdLimit = 50;

/** その牛でいま気にすべきこと。「今日」画面と牛群一覧で同じ判定を使います */
function cowAlerts(c, g){
  const S = Calc.S();
  const d = ageDays(c.birth_date);
  const m = ageMonths(c.birth_date);
  g = g || Calc.groupOf(c);
  const out = [];
  if (g.key === 'sold' || d == null) return out;
  const meta = Calc.programMeta(Calc.programKey(c));
  const tAi = num(S['target.first_ai_month'], 13.5);
  const tCal = num(S['target.first_calving_month'], 23.0);

  if ((g.key === 'milk3' || g.key === 'milk4') &&
      d >= meta.weanMin - 5 && d <= meta.weanMax + 5)
    out.push({ t: '離乳判断', k: 'warn' });
  if (g.key === 'breeding' && num(c.first_ai_month) == null && m >= tAi)
    out.push({ t: '初回AI未実施 ' + r1(m) + 'ヶ月', k: 'warn' });
  if ((g.key === 'breeding' || g.key === 'growing') && m != null && m >= tCal + 2)
    out.push({ t: '分娩月齢超過 ' + r1(m) + 'ヶ月', k: 'crit' });

  // 初乳の記録漏れ。生まれたばかりの子は、今からでも間に合うので強めに出す
  if (d <= 7 && !(Store.colostrumDone || new Set()).has(String(c.cow_no)))
    out.push({ t: '初乳が未記録', k: d <= 1 ? 'crit' : 'warn' });

  // 直近の便異常・疾病
  const ev = (Store.recentEvents || {})[String(c.cow_no)] || [];
  const bad = ev.filter(e => /便異常|下痢|肺炎|疾病/.test(String(e.type) + String(e.detail)))
                .sort((x, y) => String(x.date) < String(y.date) ? 1 : -1);
  if (bad.length){
    const ago = daysBetween(bad[0].date, today());
    out.push({ t: (bad[0].detail || bad[0].type) +
      (ago === 0 ? '（今日）' : '（' + ago + '日前）') +
      (bad.length > 1 ? ' ×' + bad.length : ''),
      k: bad.length >= 3 || /水下痢/.test(bad[0].detail || '') ? 'crit' : 'warn' });
  }
  return out;
}

      nPens
        ? 'ハッチ・群房の見取り図です。牛をスワイプすると隣の部屋へ移せます。'
        : '部屋を登録すると、哺乳ボードを実際に歩く順に並べられます。'),
    el('button', { class: 'btn' + (nPens ? '' : ' primary'),
      onclick: () => App.go('pens') },
      '🏠　牛舎の配置をひらく')));

  /* --- 測定日の分析への入口 --- */
  wrap.appendChild(el('div', { class: 'card' },
    el('h2', {}, '測定日ごとに分析する'),
    el('div', { class: 'hint', style: 'margin-bottom:10px' },
      '成長チャート（標準曲線つき）、充足率の内訳と箱ひげ図、発育遅延・優良個体の一覧が見られます。'),
    el('button', { class: 'btn primary', onclick: () => App.go('analysis') },
      '📈　測定日の分析をひらく')));

  /* --- 発育曲線 --- */
  const bm = Store.benchmark?.weightByAge;
  if (bm && Object.keys(bm).length){
    const key = herdFilter.breed || Object.keys(bm)[0];
    const brows = (bm[key] || []).filter(r => r.n >= 3 && r.day <= 800);
    if (brows.length >= 3){
      const c2 = el('div', { class: 'card' });
      c2.appendChild(el('h2', {}, key + ' の発育曲線', el('span', { class: 'note' }, '牧場の実測から')));
      c2.appendChild(Chart.plot({
        height: 240,
        x: { domain: [0, Math.max(...brows.map(r => r.day)) + 10], fmt: v => r0(v) + '日',
             tip: v => r0(v) + '日齢' },
        y: { zero: true, fmt: v => r0(v) },
        bands: [{ name: '牧場の25〜75%', color: cssVar('--band'),
                  points: brows.map(r => ({ x: r.day, lo: r.p25, hi: r.p75 })) }],
        series: [
          { name: '牧場の中央値', color: cssVar('--s1'), width: 2.5,
            points: brows.map(r => ({ x: r.day, y: r.p50 })), fmt: v => r0(v) + ' kg' },
          { name: '標準平均', color: cssVar('--s3'), width: 1.8, dashed: true, noEndLabel: true,
            points: brows.map(r => ({ x: r.day, y: Calc.std('weight', r.day)?.avg })),
            fmt: v => r0(v) + ' kg' }
        ],
        caption: '青＝牧場の実測、緑の破線＝標準平均。個体カルテの体重タブで自分の位置が見られます。'
      }));
      wrap.appendChild(c2);
    }
  } else {
    wrap.appendChild(el('div', { class: 'note warn' },
      el('b', {}, '体重・胸囲の測定データがまだありません。')));
  }

  /* --- 絞り込み --- */
  const breeds = Array.from(new Set(Store.cows.map(c => c.breed).filter(Boolean)));
  const fc = el('div', { class: 'card tight' });
  const chip = (label, on, fn) => el('button', { class: 'chip', 'aria-pressed': on,
    onclick: () => { fn(); herdLimit = 50; App.render(); } }, label);
  fc.appendChild(el('div', { class: 'chips', style: 'margin-bottom:8px' },
    chip('在籍すべて', herdFilter.group === '', () => herdFilter.group = ''),
    GROUP_LIST.filter(g => g.key !== 'unknown').map(g =>
      chip(g.short, herdFilter.group === g.key, () => herdFilter.group = g.key))));
  fc.appendChild(el('div', { class: 'chips' },
    chip('全品種', herdFilter.breed === '', () => herdFilter.breed = ''),
    breeds.map(b => chip(b, herdFilter.breed === b, () => herdFilter.breed = b)),
    chip('⚠ 要確認のみ', herdFilter.alert, () => herdFilter.alert = !herdFilter.alert)));
  wrap.appendChild(fc);

  /* --- 一覧 --- */
  let list = rows.filter(r => {
    if (herdFilter.breed && r.c.breed !== herdFilter.breed) return false;
    if (herdFilter.group) return r.g.key === herdFilter.group;
    return r.g.key !== 'sold';
  });
  if (herdFilter.alert) list = list.filter(r => r.alerts.length);
  list.sort((a, b) => (a.g.order - b.g.order) || ((a.d ?? 999999) - (b.d ?? 999999)));

  const lc = el('div', { class: 'card' });
  lc.appendChild(el('h2', {}, '個体一覧', el('span', { class: 'note' }, list.length + '頭')));
  if (!list.length){
    lc.appendChild(el('div', { class: 'empty' }, '該当する牛がいません'));
  } else {
    list.slice(0, herdLimit).forEach(r => lc.appendChild(herdRow(r)));
    if (list.length > herdLimit)
      lc.appendChild(el('button', { class: 'btn ghost', style: 'margin-top:12px',
        onclick: () => { herdLimit += 100; App.render(); } },
        'あと ' + (list.length - herdLimit) + '頭を表示'));
  }
  wrap.appendChild(lc);
  return wrap;
}

/** 売却・廃用した牛と在籍牛のゲノム値を比べて、選抜が効いているかを見る */
function genomicSelectionCard(rows){
  const g = Store.benchmark?.genomics;

  const c = el('div', { class: 'card' });

  c.appendChild(el('div', { class: 'tiles' },
    el('div', { class: 'tile' },
      el('div', { class: 'k' }, '測定済み'),
      el('div', { class: 'v' }, String(g.TPI.n), el('small', {}, '頭')),
      el('div', { class: 'd' }, '在籍 ' + kept + '頭 ／ 売却・廃用 ' + sold + '頭')),
    el('div', { class: 'tile' },
      el('div', { class: 'k' }, 'TPI の範囲'),

/* ------------------------------------------------------------
   申し送り
   ------------------------------------------------------------
   哺乳を何人かで回すようになると、「昨日◯番が半分残した」
   「◯番は治療中で朝だけ薬」が口頭で消えてしまいます。
   牛につく申し送りと、牛につかない申し送り（全体連絡）の両方を

function handoverCard(){

    el('span', { class: 'note' }, list.length ? list.length + '件' : '')));

  if (!list.length){
    c.appendChild(el('div', { class: 'hint', style: 'margin:-4px 0 12px' },
      '「昨日◯番が半分残した」「◯番は治療中」など、次に哺乳する人に伝えたいことを残せます。'));
  } else {

      c.appendChild(el('div', {

/** 申し送りを書く。牛を選ばなければ全体連絡になります。 */
function openHandoverForm(cow){
  sheet('申し送り', (b, close) => {
    const fCow = inp({ type: 'text', inputmode: 'numeric',
      value: cow ? cow.tag4 : '', placeholder: '4桁（全体連絡なら空欄）' });
    const hit = el('div', { class: 'hint' });
    const resolve = () => {
      const s = fCow.value.trim();
      if (!s) return null;
      const found = App.findCow(s);
      return found.length ? found[0] : undefined;   // undefined = 見つからない
    };
    fCow.addEventListener('input', () => {
      const f = resolve();
      hit.textContent = f === null ? '空欄なら全体への連絡になります'
        : f === undefined ? '該当する牛が見つかりません'
        : f.tag4 + '　' + (f.name || '') +
          (f.birth_date ? '　' + ageDays(f.birth_date) + '日齢' : '');
    });

    const fText = el('textarea', { class: 'inp', placeholder: '例）2058は昨日の夕、半分残した。今日は様子を見て増やさないでください。' });
    const fDate = inp({ type: 'date', value: today() });

    b.appendChild(el('div', { class: 'note' },
      '次に哺乳する人が「今日の記録」で最初に見る場所に出ます。7日たつと自動で消えます。'));
    b.appendChild(field('牛の4桁 <span class="opt">全体連絡なら空欄</span>', fCow));
    b.appendChild(hit);
    b.appendChild(field('内容', fText));
    b.appendChild(field('日付', fDate));

    const btn = el('button', { class: 'btn primary' }, '書き残す');
    btn.onclick = () => submitting(btn, async () => {
      const text = fText.value.trim();
      if (!text) throw new Error('内容を書いてください');
      const f = resolve();
      if (f === undefined) throw new Error('該当する牛が見つかりません（空欄なら全体連絡になります）');
      await Store.add('events', {
        cow_no: f ? f.cow_no : '', date: fDate.value,
        type: '申し送り', detail: text, note: ''
      });
      close(); toast('書き残しました'); App.render();
    });
    b.appendChild(btn);
  }, { focus: false });
}

/* ------------------------------------------------------------
   毎日の作業チェック
   ------------------------------------------------------------
   慣れた人には要らないものですが、これから入る人にとっては
   「何をどの順でやるのか」が形になっているだけで迷いが減ります。
   項目は設定画面（check.am / check.pm）で変えられます。
   ------------------------------------------------------------ */
/* 作業チェックを開いているか（毎日は要らないので既定は閉じる） */
let checkOpen = false;

function checkCard(){
  const S = Calc.S();
  const c = el('div', { class: 'card' });
  const slots = [
    { key: 'am', label: '朝', time: S['routine.am_milk'], items: splitList(S['check.am']) },
    { key: 'pm', label: '夕', time: S['routine.pm_milk'], items: splitList(S['check.pm']) }
  ].filter(s => s.items.length);
  if (!slots.length) return null;

  const doneOf = (slot, item) => (Store.todayChecks || [])
    .some(x => x.slot === slot && x.item === item && String(x.done) !== '' &&
               String(x.done) !== 'false' && String(x.done) !== '0');
  const total = slots.reduce((s, x) => s + x.items.length, 0);
  const done = slots.reduce((s, x) => s + x.items.filter(i => doneOf(x.key, i)).length, 0);

  // 慣れた人には毎日は要らないので、たたんでおく
  const next = (() => {
    for (const sl of slots)
      for (const i of sl.items) if (!doneOf(sl.key, i)) return sl.label + '　' + i;
    return null;
  })();

  c.appendChild(el('div', {
    style: 'display:flex;align-items:center;gap:12px;cursor:pointer;min-height:var(--tap)',
    onclick: () => { checkOpen = !checkOpen; App.render(); }
  },
    el('div', { style: 'flex:1;min-width:0' },
      el('div', { style: 'font-size:var(--t2);font-weight:700' }, '今日の作業'),
      el('div', { style: 'font-size:var(--t1);color:var(--muted)' },
        next ? '次は ' + next : 'すべて終わりました')),
    el('div', { style: 'font-size:var(--t3);font-weight:800;color:var(' +
      (done >= total ? '--good-ink' : '--ink-2') + ');font-variant-numeric:tabular-nums' },
      done + ' / ' + total),
    el('div', { style: 'color:var(--muted);font-size:var(--t2);width:16px' },
      checkOpen ? '▲' : '▼')));

  // 進み具合のバー（たたんでいても見えるように）
  c.appendChild(el('div', {
    style: 'height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:4px 0' },
    el('div', { style: 'height:100%;border-radius:4px;background:var(' +
      (done >= total ? '--good' : '--s1') + ');width:' +
      (total ? Math.max(done / total * 100, 1) : 0) + '%' })));

  if (!checkOpen) return c;

  slots.forEach(sl => {
    c.appendChild(el('div', {
      style: 'font-size:var(--t1);font-weight:700;color:var(--ink-2);margin:10px 0 6px' },
      sl.label, el('span', { style: 'font-weight:500;color:var(--muted);margin-left:8px' }, sl.time)));
    sl.items.forEach(item => {
      const on = doneOf(sl.key, item);
      c.appendChild(el('button', {
        style: 'display:flex;align-items:center;gap:12px;width:100%;text-align:left;' +
               'min-height:var(--tap);padding:8px 4px;background:none;border:0;' +
               'border-bottom:1px solid var(--grid);cursor:pointer;font-size:var(--t2)',
        onclick: () => toggleCheck(sl.key, item, !on)
      },
        el('span', {
          style: 'width:28px;height:28px;flex:none;border-radius:9px;display:grid;' +
                 'place-items:center;font-size:var(--t2);font-weight:800;' +
                 (on ? 'background:var(--good);color:#fff'
                     : 'border:2px solid var(--line);color:transparent')
        }, '✓'),
        el('span', { style: on ? 'color:var(--muted);text-decoration:line-through' : '' }, item)));
    });
  });

  c.appendChild(el('div', { class: 'hint', style: 'margin-top:10px' },
    '押した人と時刻が残ります。項目は 設定 →「毎日の作業チェック」で変えられます。'));
  return c;
}

function splitList(v){
  return String(v || '').split(/[,、]/).map(s => s.trim()).filter(Boolean);
}

async function toggleCheck(slot, item, on){
  const d = today();
  try {
    await Store.replace('daily_check', { date: d, slot, item },
      on ? [{ date: d, slot, item, done: '1', operator: Store.cfg.user || '', note: '' }] : []);
    // 画面をすぐ切り替えたいので、手元の控えも同時に直す
    Store.todayChecks = (Store.todayChecks || [])
      .filter(x => !(x.date === d && x.slot === slot && x.item === item));
    if (on) Store.todayChecks.push({ date: d, slot, item, done: '1',
                                     operator: Store.cfg.user || '' });
    App.render();
  } catch (e){ toast(e.message || String(e), true); }
}

/* ------------------------------------------------------------
   12. 設定
   ------------------------------------------------------------ */
function viewSettings(){
  const wrap = el('div');
  const S = Calc.S();
  const pending = {};
  const bind = (key, attrs) => {
    const i = inp(Object.assign({ value: S[key] ?? '' }, attrs));
    i.addEventListener('input', () => { pending[key] = i.value; markDirty(); });
    return i;
  };
  const bindSel = (key, options) => {
    const s = sel({}, options, S[key]);
    s.addEventListener('change', () => { pending[key] = s.value; markDirty(); });
    return s;
  };
  let saveBar = null;
  const markDirty = () => { if (saveBar) saveBar.hidden = false; };

  /* --- 表示（文字サイズ・配色）--- */
  wrap.appendChild(el('div', { class: 'card' },
    el('h2', {}, '表示',
      el('span', { class: 'note' },
        ({ m: '標準', l: '大', xl: '特大' })[LS.get('sw.fs', 'm')] + ' · ' +
        ({ auto: '自動', light: '明るい', dark: '暗い' })[LS.get('sw.theme', 'auto')])),
    el('button', { class: 'btn', onclick: openDisplaySheet }, 'Ａ　文字サイズ・配色を変える'),
    el('div', { class: 'hint' },
      '画面の右上にある「Ａ」からも、どの画面でも変えられます。')));

  /* --- 接続 --- */
  const c0 = el('div', { class: 'card' });
  c0.appendChild(el('h2', {}, 'スプレッドシートとの接続'));
  c0.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:calc(13px * var(--fs))' },
    el('span', { class: 'statusdot ' + (Store.isRemote ? (Store.online ? 'on' : 'off') : 'local') }),
    Store.isRemote ? (Store.online ? '共有モードで動いています' : '接続できていません')
                   : 'お試しモード（この端末にだけ保存されます）'));

  /* いまどの版が繋がっているか。
     「コードが古いまま」と出たときに、貼り替えが効いたかをここで確かめられます。 */
  if (Store.isRemote){
    const ok = !needsBackendUpdate() && Store.serverVersion === APP_VERSION;
    c0.appendChild(el('div', {
      style: 'background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px;' +
             'margin-bottom:12px;font-size:var(--t1);line-height:1.7' },
      el('div', { style: 'display:flex;gap:10px' },
        el('span', { style: 'color:var(--muted);min-width:118px' }, 'この画面の版'),
        el('b', {}, APP_VERSION)),
      el('div', { style: 'display:flex;gap:10px' },
        el('span', { style: 'color:var(--muted);min-width:118px' }, '画面を作った日時'),
        el('b', {}, BUILD_ID)),
      el('div', { style: 'display:flex;gap:10px' },
        el('span', { style: 'color:var(--muted);min-width:118px' }, 'スプレッドシート側'),
        el('b', { style: ok ? '' : 'color:var(--crit)' },
          Store.serverVersion || '不明（古い版です）')),
      el('div', { style: 'margin-top:6px;color:var(' + (ok ? '--good-ink' : '--crit') + ')' },
        ok ? '✓ 両方そろっています'
           : '✗ Code.gs を貼り替えて、デプロイを更新してください')));

    /* 画面が新しくなっていないか、その場で確かめる。
       ふだんはアプリを開くたびに自動でやっているので、押す必要はありません。 */
    const chk = el('button', { class: 'btn sm ghost', style: 'width:100%;margin-bottom:12px' },
      '🔄 新しい画面が出ていないか確かめる');
    chk.onclick = () => submitting(chk, async () => {
      const r = await Updater.check({ auto: false });
      if (r == null){ toast('この画面が最新です'); return; }
      toast('新しい画面があります。読み直します');
      setTimeout(() => Updater.apply(r), 600);
    });
    c0.appendChild(chk);
  }

  const fUrl = inp({ type: 'url', value: Store.cfg.url || '',
                     placeholder: 'https://script.google.com/macros/s/…/exec' });
  const fTok = inp({ type: 'text', value: Store.cfg.token || '', placeholder: '設定していなければ空欄' });
  const fUser = inp({ type: 'text', value: Store.cfg.user || '', placeholder: 'あなたの名前（記録者として残ります）' });
  // 接続欄も、下の保存バーで保存できるようにしておく（どちらで保存しても同じ結果）
  [fUrl, fTok, fUser].forEach(x => x.addEventListener('input', markDirty));
  c0.appendChild(field('ウェブアプリのURL', fUrl,
    'Apps Script を「ウェブアプリ」としてデプロイしたときに出るURLです。手順書を参照してください。'));
  c0.appendChild(el('div', { class: 'grid2' },
    field('書き込みの合言葉 <span class="opt">任意</span>', fTok), field('記録者名', fUser)));

  // このボタンが保存を兼ねます。名前が「ためす」だけだと
  // 「別に保存ボタンがあるはず」と探させてしまうので、両方を書いています。
  const testBtn = el('button', { class: 'btn primary' }, '保存して接続する');
  testBtn.onclick = () => submitting(testBtn, async () => {
    if (!fUrl.value.trim()) throw new Error('ウェブアプリのURLを入れてください');
    Store.saveCfg({ url: fUrl.value.trim(), token: fTok.value.trim(), user: fUser.value.trim() });
    await Store.init();
    App.ready = true;
    toast('接続できました（' + Store.cows.length + '頭）');
    App.render();
  });
  c0.appendChild(testBtn);
  c0.appendChild(el('div', { class: 'hint' },

function toCSV(rows, cols){
  const q = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');
}

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ',' || ch === '\t'){ row.push(cur); cur = ''; }
      else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch === '\r'){ /* skip */ }
      else cur += ch;
    }
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

/* ------------------------------------------------------------
   プリセット取り込みの中身
   ------------------------------------------------------------ */
const cell = (row, idx) => idx == null || idx < 0 ? '' : String(row[idx] ?? '').trim().replace(/[ 　]/g, '');
const numCell = (row, idx) => {
  const s = cell(row, idx).replace(/,/g, '');
  if (s === '' || s === '-' || s === '−' || s === '—') return '';
  const n = Number(s);
  return isNaN(n) ? '' : String(n);
};
function colIndex(header, ...names){
  for (const n of names){
    const i = header.findIndex(h => String(h).trim().replace(/[ 　\s]/g,'') === n);
    if (i >= 0) return i;
  }
  return -1;
}
function dateCell(row, idx){
  const s = cell(row, idx);
  if (!s) return '';
  const d = toDate(s) || parseJPDate(s) || parseExcelSerial(s);
  return d ? ymd(d) : '';
}
function parseExcelSerial(s){
  const n = Number(s);
  if (!isFinite(n) || n < 20000 || n > 60000) return null;
  // 1899-12-30 を起点に「日数」を足す。時差でずれないよう現地時間で組み立てる
  const base = new Date(1899, 11, 30);
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() + Math.floor(n));
}

/** ゲノム表（8.26database）→ 個体 ＋ ゲノム値 */
function importGenomeSheet(rows, ctx){
  const H = rows[0];
  const body = rows.slice(1);
  const iMgmt = colIndex(H, '管理番号');
  const iEar  = colIndex(H, '個体識別番号');
  const iDam  = colIndex(H, '親');
  const iBirth= colIndex(H, '生年月日');
  const iStat = colIndex(H, '在籍/その他');
  const iSire = colIndex(H, '種雄牛');
  const iTest = colIndex(H, '検査結果正式表示', '検査結果');

  // 形質は「管理番号・個体識別番号・生年月日・在籍/その他・種雄牛・検査結果・A2・親」以外の数値列
  const skip = new Set([iMgmt, iEar, iDam, iBirth, iStat, iSire, iTest,
                        colIndex(H, 'A2正式表示', 'A2')]);
  const traits = [];
  H.forEach((h, i) => {
    if (skip.has(i)) return;
    const name = String(h || '').trim().replace(/正式表示$/, '');
    if (name) traits.push({ i, name });
  });

  const cows = [], genes = [];
  // シート名が「8.26database」のような形なら、それを検査日として使う。
  // こうしておくと、同じシートを二度入れても重複せず、
  // 別の月のシートを入れると評価の履歴として積み上がります。
  // 検査日はシート名（例「8.26database」）から。年はファイル内の一番新しい生年月日から決める。
  // こうすると、いつ取り込んでも同じ日付になり、二度入れても重複しません。
  let newestBirth = '';
  body.forEach(r => { const b2 = dateCell(r, iBirth); if (b2 > newestBirth) newestBirth = b2; });
  const testedAt = sheetNameToDate(ctx && ctx.sheetName, newestBirth) || newestBirth || today();
  body.forEach(r => {
    const ear = cell(r, iEar).replace(/[^0-9]/g, '');
    const mgmt = cell(r, iMgmt).replace(/[^0-9A-Za-z]/g, '');
    if (!ear && !mgmt) return;
    const key = ear || ('M' + mgmt);
    const stat = cell(r, iStat);
    cows.push({
      cow_no: key, mgmt_no: mgmt, dam_mgmt_no: cell(r, iDam).replace(/[^0-9A-Za-z]/g, ''),
      birth_date: dateCell(r, iBirth),
      sire_name: cell(r, iSire),
      // 品種は上書きしない（和牛として登録済みの牛を潰さないため）
      status: (stat === 'その他') ? '売却・廃用' : '在籍'
    });
    traits.forEach(t => {
      const v = numCell(r, t.i);
      if (v === '') return;
      genes.push({ cow_no: key, subject: '自身', trait: t.name, value: v, tested_at: testedAt });
    });
  });
  return { cows, genomics: genes,
    summary: cows.length + '頭・ゲノム値' + genes.length + '件' };
}

/** 在籍牛一覧（牛群検定CSV）→ 個体（既存に上書き合流）＋ 繁殖 ＋ 乳検 */
function importHerdList(rows){
  const H = rows[0];
  const body = rows.slice(1);
  const I = n => colIndex(H, n);
  const iEar = I('耳標ID'), iBirth = I('生年月日'), iName = I('名号'),
        iBreed = I('品種'), iSex = I('性別'), iPar = I('産次'),
        iPen = I('牛群'), iCalv = I('最新分娩日'), iSire = I('父牛名'),
        iAi = I('最新授精日'), iFirstAi = I('初回授精日'), iAbbr = I('授精略号'),
        iPd = I('妊鑑日'), iPdRes = I('妊鑑結果'), iDim = I('分娩後日数'),
        iMilk = I('検定乳量'), iScc = I('体細胞数'), iReg = I('登録番号'),
        iDue = I('分娩予定日');

  const cows = [], repro = [], tests = [];
  const known = {};
  Store.cows.forEach(c => { if (c.cow_no) known[c.cow_no] = c; });

  const iFaMonth = I('初回授精月齢');

  body.forEach(r => {
    const ear = cell(r, iEar).replace(/[^0-9]/g, '');
    if (!ear) return;
    const ex = known[ear];
    const birth = dateCell(r, iBirth);
    const parRaw = cell(r, iPar);
    const parity = (parRaw === '-' || parRaw === '−') ? '' : parRaw;
    const nPar = num(parity);

    cows.push({
      cow_no: ear,
      // 管理番号はこのCSVには無いので、既に分かっている値を消さないよう引き継ぐ
      mgmt_no: ex ? ex.mgmt_no : '',
      dam_mgmt_no: ex ? ex.dam_mgmt_no : '',
      name: cell(r, iName), birth_date: birth,
      sex: normSex(cell(r, iSex)), breed: normBreed(cell(r, iBreed)),
      parity: parity,
      // 分娩予定日があれば受胎している証拠。未経産なら「妊娠+」群に入ります
      due_date: dateCell(r, iDue),
      // この列が生涯の初回授精月齢。CSVの「初回授精日」は今の産次の初回なので使わない
      first_ai_month: numCell(r, iFaMonth),
      pen: cell(r, iPen),
      sire_name: cell(r, iSire) || (ex ? ex.sire_name : ''),
      status: '在籍',
      program: ex ? ex.program : '',
      birth_weight: ex ? ex.birth_weight : '',
      birth_chest: ex ? ex.birth_chest : '',
      neck_no: ex ? ex.neck_no : ''
    });

    // 未経産なら「初回授精日」＝生涯の初回。経産なら今産次の初回なので but書きを残す
    const fa = dateCell(r, iFirstAi);
    if (fa) repro.push({ cow_no: ear, date: fa, type: 'AI', parity: parity,
      sire_code: cell(r, iAbbr),
      note: nPar ? '在籍牛一覧より（' + nPar + '産次の初回授精）' : '在籍牛一覧より（初回授精）' });
    const la = dateCell(r, iAi);
    if (la && la !== fa) repro.push({ cow_no: ear, date: la, type: 'AI', parity: parity,
      sire_code: cell(r, iAbbr), note: '在籍牛一覧より（最新授精）' });
    const pd = dateCell(r, iPd);
    if (pd) repro.push({ cow_no: ear, date: pd, type: '妊鑑', parity: parity,
      result: cell(r, iPdRes), note: '在籍牛一覧より' });
    const cv = dateCell(r, iCalv);
    if (cv) repro.push({ cow_no: ear, date: cv, type: '分娩',
      // 産次1の分娩だけが「初回分娩」。ここを取り違えると牧場平均が壊れる
      parity: parity,
      result: cell(r, I('直近産子の性')),
      note: nPar === 1 ? '在籍牛一覧より（初回分娩）' : '在籍牛一覧より（最新分娩）' });

    const mk = numCell(r, iMilk), sc = numCell(r, iScc), dim = numCell(r, iDim);
    if (mk !== '' || sc !== ''){
      // 検定日は分からないので「最新分娩日＋分娩後日数」で置く
      let d = '';
      if (cv && dim !== '') d = addDays(cv, Math.round(Number(dim)));
      if (!d) d = today();
      tests.push({ cow_no: ear, date: d, milk_kg: mk, scc: sc, dim: dim,
        parity: cell(r, iPar) === '-' ? '' : cell(r, iPar), note: '在籍牛一覧より' });
    }
  });
  return { cows, repro, milk_test: tests,
    summary: cows.length + '頭・繁殖' + repro.length + '件・乳検' + tests.length + '件' };
}

/**
 * 体高BW の database シート → 体重測定 ＋ 足りない個体情報
 * 4桁（個体識別番号の真ん中4桁）で既存の牛に紐づけます。
 */
function importBodyWeight(rows){
  const H = rows[0], body = rows.slice(1);
  const I = n => colIndex(H, n);
  const iTag = I('4桁'), iDam = I('親'), iDate = I('採材日'),
        iBirth = I('生年月日'), iAge = I('日齢'), iChest = I('胸囲'),
        iHeight = I('体高'), iActual = I('実測体重');

  const cows = [], seen = {}, unmatched = [];
  const wmap = {};   // 牛+日 → 1行にまとめる

  body.forEach(r => {
    const tag = cell(r, iTag).replace(/[^0-9A-Za-z]/g, '');
    const chest = numCell(r, iChest);
    const height = iHeight >= 0 ? numCell(r, iHeight) : '';
    const actual = iActual >= 0 ? numCell(r, iActual) : '';
    if (!tag) return;
    if (chest === '' && height === '' && actual === '') return;

    const birth = dateCell(r, iBirth);
    const age = numCell(r, iAge);
    let date = dateCell(r, iDate);
    if (!date && birth && age !== '') date = addDays(birth, Math.round(Number(age)));
    if (!date) return;

    let hit = null;
    const cands = cowsBy4(tag);
    if (cands.length === 1) hit = cands[0];
    else if (cands.length > 1) hit = cands.find(c => c.birth_date === birth) || cands[0];

    const key = hit ? hit.cow_no : ('M' + tag);
    if (!hit && !seen[key]){
      unmatched.push(tag);
      cows.push({ cow_no: key, mgmt_no: tag, birth_date: birth,
                  dam_mgmt_no: cell(r, iDam).replace(/[^0-9A-Za-z]/g, ''),
                  breed: 'ホルスタイン', status: '在籍' });
    } else if (hit && !seen[key]){
      const patch = { cow_no: hit.cow_no };
      let need = false;
      if (!hit.birth_date && birth){ patch.birth_date = birth; need = true; }
      if (!hit.dam_mgmt_no && cell(r, iDam)){
        patch.dam_mgmt_no = cell(r, iDam).replace(/[^0-9A-Za-z]/g, ''); need = true; }
      if (!hit.mgmt_no && tag){ patch.mgmt_no = tag; need = true; }
      if (need) cows.push(Object.assign({}, hit, patch));
    }
    seen[key] = true;

    // 同じ牛の同じ日は1行にまとめる（胸囲の行と実測体重の行が分かれていても拾う）
    const wk = key + '|' + date;
    const w = wmap[wk] = wmap[wk] || {
      cow_no: key, date: date, chest_cm: '', height_cm: '',
      weight_actual: '', weight_est: '', source: '', note: '体高BW取り込み' };
    if (chest !== '' && w.chest_cm === '') w.chest_cm = chest;
    if (height !== '' && w.height_cm === '') w.height_cm = height;
    if (actual !== '' && w.weight_actual === '') w.weight_actual = actual;
  });

  const weights = Object.keys(wmap).map(k => {
    const w = wmap[k];
    const est = w.chest_cm !== '' ? Calc.estWeight(w.chest_cm) : null;
    w.weight_est = est != null ? r1(est) : '';
    w.source = w.weight_actual !== '' ? '実測' : (w.chest_cm !== '' ? '胸囲' : '体高');
    return w;
  });

  return { cows, weights,
    summary: '体重測定' + weights.length + '件・' + Object.keys(seen).length + '頭'
      + (unmatched.length ? '（うち' + unmatched.length + '頭は新規登録）' : '') };
}

/** 「8.26database」「07.07」のようなシート名を日付にする */
function sheetNameToDate(name, notBefore){
  const m = String(name || '').match(/(\d{1,2})[.\-\/](\d{1,2})/);
  if (!m) return null;
  const mo = +m[1], da = +m[2];
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  // 「この日以降」が分かっていれば、それを満たす一番早い年を使う（取り込んだ日に依存しない）
  const floor = toDate(notBefore);
  if (floor){
    for (let y = floor.getFullYear(); y <= floor.getFullYear() + 2; y++){
      const d = new Date(y, mo - 1, da);
      if (d >= floor) return ymd(d);
    }
  }
  const now = new Date();
  let y = now.getFullYear();
  if (new Date(y, mo - 1, da) > now) y -= 1;
  return ymd(new Date(y, mo - 1, da));
}

/** 「令和6年4月1日」「2024年4月1日」「20240401」なども拾う */
function parseJPDate(s){
  s = String(s).trim();
  let m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^令和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);
  if (m) return new Date(2018 + (+m[1]), +m[2]-1, +m[3]);
  m = s.match(/^平成\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);
  if (m) return new Date(1988 + (+m[1]), +m[2]-1, +m[3]);
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m){ const y = +m[3] < 100 ? 2000 + (+m[3]) : +m[3]; return new Date(y, +m[1]-1, +m[2]); }
  return null;
}

/* ------------------------------------------------------------
   15. 測定日の分析（成長チャート・充足率・考察レポート）
   ------------------------------------------------------------
   佐藤さんがExcelでやっていた分析を、アプリの中で同じように見られるようにしたものです。
   ・測定日を選ぶ（複数選べます）
   ・胸囲／体重／体高 を標準曲線の上に散布して、標準以上・標準内・標準以下で塗り分け
   ・充足率の内訳と箱ひげ図
   ・発育遅延／平均以下／優良個体の一覧
   ------------------------------------------------------------ */

const Analysis = {
  loaded: false,
  loading: false,
  rows: [],          // { cow, date, day, chest, kg, height, ful, zone }
  dates: [],         // 測定日の一覧（新しい順）
  sel: [],           // 選択中の測定日
  metric: 'chest',   // chest | weight | height
  bucket: 'date',    // date | age   （箱ひげ図の切り口）

  reset(){ this.loaded = false; this.rows = []; this.dates = []; this.sel = []; },

  /** 体重記録をまとめて1回で取ってくる（1頭ずつ読むと通信回数が増えるため） */
  async load(){
    if (this.loaded || this.loading) return;
    this.loading = true;
    try {
      const d = await Store.call({ action: 'export', table: 'weights' });
      const byNo = {};
      Store.cows.forEach(c => byNo[String(c.cow_no)] = c);
      const rows = [];
      (d.rows || []).forEach(w => {
        const cow = byNo[String(w.cow_no)];
        if (!cow || !cow.birth_date) return;
        const day = daysBetween(cow.birth_date, w.date);
        if (day == null || day < 0 || day > 1200) return;
        const chest = num(w.chest_cm);
        const kg = num(w.weight_actual) ?? Calc.estWeight(chest);
        const height = num(w.height_cm);
        if (chest == null && kg == null && height == null) return;
        rows.push({ cow, date: ymd(w.date) || String(w.date), day, chest, kg, height,
                    ful: kg != null ? Calc.fulfillment(day, kg) : null });
      });
      this.rows = rows;
      this.dates = Array.from(new Set(rows.map(r => r.date))).filter(Boolean).sort().reverse();
      this.sel = this.dates.slice(0, 1);
      this.loaded = true;
    } finally { this.loading = false; }
  },

  selected(){
    if (!this.sel.length) return this.rows;
    const set = new Set(this.sel);
    return this.rows.filter(r => set.has(r.date));
  },

  metricInfo(){
    return {
      chest:  { key: 'chest',  std: 'chest',  label: '胸囲',  unit: 'cm', get: r => r.chest },
      weight: { key: 'weight', std: 'weight', label: '体重',  unit: 'kg', get: r => r.kg },
      height: { key: 'height', std: 'height', label: '体高',  unit: 'cm', get: r => r.height }
    }[this.metric];
  }
};

/** 測定日が多い牧場だと一覧が長くなりすぎるので、最初は新しい方から少しだけ出す */
let dateLimit = 12;

function datePicker(){
  const c = el('div', { class: 'card' });
  c.appendChild(el('h2', {}, '測定日',
    el('span', { class: 'note' }, Analysis.sel.length + ' / ' + Analysis.dates.length + '日を選択中')));

  // よく使う選び方を先に置く（下までスクロールしなくてよいように）
  c.appendChild(el('div', { class: 'btnrow', style: 'margin-bottom:12px' },
    el('button', { class: 'btn sm', onclick: () => { Analysis.sel = Analysis.dates.slice(0, 1); App.render(); } },
      '最新のみ'),
    el('button', { class: 'btn sm', onclick: () => { Analysis.sel = Analysis.dates.slice(0, 3); App.render(); } },
      '直近3回'),
    el('button', { class: 'btn sm', onclick: () => { Analysis.sel = Analysis.dates.slice(); App.render(); } },
      'すべて'),
    el('button', { class: 'btn sm ghost', onclick: () => { Analysis.sel = []; App.render(); } },
      '解除')));

  const chips = el('div', { class: 'chips sm' });
  const toggle = d => {
    const i = Analysis.sel.indexOf(d);
    if (i >= 0) Analysis.sel.splice(i, 1); else Analysis.sel.push(d);
    App.render();
  };
  // 選んである日は、古くても必ず出す
  const shown = Analysis.dates.filter((d, i) => i < dateLimit || Analysis.sel.includes(d));
  shown.forEach(d => {
    const n = Analysis.rows.filter(r => r.date === d).length;
    chips.appendChild(el('button', {
      class: 'chip', 'aria-pressed': Analysis.sel.includes(d),
      onclick: () => toggle(d)
    }, fmtDateFull(d).replace('年','/').replace('月','/').replace('日',''),
       el('span', { style: 'opacity:.65;margin-left:5px;font-weight:500' }, n)));
  });
  c.appendChild(chips);

  const rest = Analysis.dates.length - shown.length;
  if (rest > 0)
    c.appendChild(el('button', { class: 'btn ghost sm', style: 'width:100%;margin-top:10px',
      onclick: () => { dateLimit += 24; App.render(); } },
      '古い測定日をあと ' + rest + '日ぶん出す'));
  else if (dateLimit > 12)
    c.appendChild(el('button', { class: 'btn ghost sm', style: 'width:100%;margin-top:10px',
      onclick: () => { dateLimit = 12; App.render(); } }, '新しい12日だけにする'));

  if (!Analysis.sel.length)
    c.appendChild(el('div', { class: 'hint' }, '未選択のときは全期間を表示します。'));
  return c;
}

/* --- 成長チャート --- */
function growthChartCard(rows){
  const M = Analysis.metricInfo();
  const c = el('div', { class: 'card' });
  c.appendChild(el('h2', {}, '成長チャート',
    el('span', { class: 'note' }, '縦軸 ' + M.label + '（' + M.unit + '）／横軸 日齢')));

  const pts = rows.map(r => ({ r, v: M.get(r) })).filter(p => p.v != null);
  if (!pts.length){
    c.appendChild(el('div', { class: 'empty' }, M.label + 'の記録がありません'));
    return c;
  }

  const maxDay = Math.min(760, Math.max(...pts.map(p => p.r.day)) + 40);
  const std = [];
  for (let d = 0; d <= maxDay; d += 10){
    const s = Calc.std(M.std, d);
    if (s) std.push({ x: d, avg: s.avg, lo: s.min, hi: s.max });
  }

  // 測定日ごとに印の形と色を変える（Excelの散布図と同じ見せ方）
  const SHAPES = ['circle','square','triangle'];
  const COLS = ['--s4','--s2','--s7','--s5','--s8','--s1'];
  const byDate = {};
  pts.forEach(p => (byDate[p.r.date] = byDate[p.r.date] || []).push(p));
  const dates = Object.keys(byDate).sort();
  const scatter = dates.map((d, i) => ({
    name: dates.length > 1 ? fmtDateFull(d).replace('年','/').replace('月','/').replace('日','') : '測定値',
    color: cssVar(COLS[i % COLS.length]),
    shape: SHAPES[i % SHAPES.length],
    r: dates.length > 4 ? 3.2 : 3.8,
    points: byDate[d].map(p => ({
      x: p.r.day, y: p.v,
      label: p.r.cow.tag4 + '　' + p.r.day + '日齢',
      tip: r1(p.v) + M.unit + (p.r.ful != null ? '　充足率 ' + r1(p.r.ful) + '%' : '')
    }))
  }));

  const zoneOver = 'color-mix(in srgb, ' + cssVar('--s1') + ' 8%, transparent)';
  const zoneUnder = 'color-mix(in srgb, ' + cssVar('--s2') + ' 8%, transparent)';
  const top = Math.max(...std.map(s => s.hi), ...pts.map(p => p.v)) * 1.03;
  const bot = Math.min(...std.map(s => s.lo), ...pts.map(p => p.v)) * 0.97;

  c.appendChild(Chart.plot({
    height: 300,
    x: { domain: [0, maxDay], fmt: v => r0(v) + '日', tip: v => r0(v) + '日齢' },
    y: { domain: [bot, top], fmt: v => r0(v) },
    bands: [
      { color: zoneOver,  points: std.map(s => ({ x: s.x, lo: s.hi, hi: top })) },
      { color: zoneUnder, points: std.map(s => ({ x: s.x, lo: bot, hi: s.lo })) },
      { name: '標準の範囲', color: 'color-mix(in srgb, ' + cssVar('--s3') + ' 12%, transparent)',
        points: std.map(s => ({ x: s.x, lo: s.lo, hi: s.hi })) }
    ],
    series: [
      { name: '標準 最高', color: cssVar('--s1'), width: 1.8, noEndLabel: true,
        points: std.map(s => ({ x: s.x, y: s.hi })), fmt: v => r1(v) + M.unit },
      { name: '標準 平均', color: cssVar('--s3'), width: 2.2, noEndLabel: true,
        points: std.map(s => ({ x: s.x, y: s.avg })), fmt: v => r1(v) + M.unit },
      { name: '標準 最低', color: cssVar('--s2'), width: 1.8, noEndLabel: true,
        points: std.map(s => ({ x: s.x, y: s.lo })), fmt: v => r1(v) + M.unit }
    ],
    scatter,
    caption: '点をなぞると個体番号が出ます。青い線より上が標準以上、オレンジの線より下が標準以下です。'
  }));

  // ゾーンごとの頭数
  const z = { over: 0, in: 0, under: 0 };
  pts.forEach(p => { const k = Calc.stdZone(M.std, p.r.day, p.v); if (k) z[k]++; });
  const tot = z.over + z.in + z.under;
  if (tot){
    c.appendChild(el('div', { class: 'tiles', style: 'margin-top:12px' },
      el('div', { class: 'tile' }, el('div', { class: 'k' }, '標準以上'),
        el('div', { class: 'v' }, String(z.over)), el('div', { class: 'd' }, r0(z.over/tot*100) + '%')),
      el('div', { class: 'tile' }, el('div', { class: 'k' }, '標準内'),
        el('div', { class: 'v' }, String(z.in)), el('div', { class: 'd' }, r0(z.in/tot*100) + '%')),
      el('div', { class: 'tile' }, el('div', { class: 'k' }, '標準以下'),
        el('div', { class: 'v' }, String(z.under)),
        el('div', { class: 'd ' + (z.under/tot > .2 ? 'bad' : '') }, r0(z.under/tot*100) + '%'))));
  }
  return c;
}
