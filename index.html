    const meta = a.programMeta || this.programMeta(a.programKey);
    const marks = this.programMarks(meta.key);
    const minD = meta.weanMin, maxD = meta.weanMax;
    const thr  = num(S['wean.starter_threshold_kg'], 1.0);
    const mult = num(S['wean.bw_multiple'], 2.0);
    // 減乳開始は「離乳の何日前か」。プログラム表にピーク終了と離乳日があれば
    // その間隔をそのまま使い、群分け（groupOf）の減乳期と食い違わないようにする。
    const progGap = (marks.weanDay != null && marks.peakEnd != null && marks.weanDay > marks.peakEnd)
      ? marks.weanDay - marks.peakEnd : null;
    const stepDown = progGap != null ? progGap : num(S['wean.step_down_days'], 14);
    const reasons = [];
    const conf = [];

    /* 1) スターター摂取からの到達予測 */
    let dayByStarter = null;
    const ma = a.starterMA.filter(x => x.kg > 0);
    if (ma.length >= 3){
      const hit = ma.find(x => x.kg >= thr);
      if (hit){
        dayByStarter = hit.day;
        reasons.push(`スターターの3日平均が${r1(thr)}kgに到達済み（${hit.day}日齢）`);
        conf.push(1);
      } else {
        const tail = ma.slice(-7);
        const f = this.fitLine(tail.map(x => [x.day, x.kg]));
        if (f && f.m > 0.002){
          const d = (thr - f.b) / f.m;
          if (isFinite(d) && d > (a.ageDays || 0) && d < 200){
            dayByStarter = d;
            reasons.push(`直近${tail.length}日のスターターの伸び（1日あたり+${r2(f.m*1000)}g）から、${r0(d)}日齢で${r1(thr)}kgに到達する見込み`);
            conf.push(f.r2 != null ? clamp(f.r2, 0, 1) : .6);
          }
        } else if (f){
          reasons.push('スターターの摂取が横ばいのため、摂取量からの離乳日は読めていません');
          conf.push(.2);
        }
      }
    } else {
      reasons.push('スターターの記録が3日分に満たないため、摂取量からの判断はできていません');
      conf.push(.1);
    }

    /* 2) 体重からの到達予測 */
    let dayByWeight = null;
    const bw = a.birthWeight;
    if (bw && a.weights.length >= 2){
      const targetKg = bw * mult;
      const recent = a.weights.slice(-4);
      const f = this.fitLine(recent.map(p => [p.day, p.kg]));
      const cur = a.latest;
      if (cur && cur.kg >= targetKg){
        dayByWeight = cur.day;
        reasons.push(`出生体重${r1(bw)}kgの${r1(mult)}倍（${r1(targetKg)}kg）に到達済み（${cur.day}日齢・${r1(cur.kg)}kg）`);
        conf.push(1);
      } else if (f && f.m > 0.05){
        const d = (targetKg - f.b) / f.m;
        if (isFinite(d) && d < 250){
          dayByWeight = d;
          reasons.push(`直近の増体${r2(f.m)}kg/日なら、${r0(d)}日齢で${r1(targetKg)}kg（出生体重の${r1(mult)}倍）に届く見込み`);
          conf.push(f.r2 != null ? clamp(f.r2, 0, 1) : .6);
        }
      } else {
        reasons.push('直近の増体が読み取れないため、体重からの判断はできていません');
        conf.push(.2);
      }
    } else if (!bw){
      reasons.push('出生体重が未登録のため、体重倍率での判断ができていません');
      conf.push(.1);
    }

    /* 3) 統合 */
    let weanDay = null, basis = '';
    if (dayByStarter != null && dayByWeight != null){
      weanDay = Math.max(dayByStarter, dayByWeight);
      basis = weanDay === dayByStarter ? 'スターター摂取が律速' : '増体が律速';
    } else if (dayByStarter != null){ weanDay = dayByStarter; basis = 'スターター摂取のみで判断'; }
    else if (dayByWeight != null){ weanDay = dayByWeight; basis = '増体のみで判断'; }
    else if (marks.weanDay){ weanDay = marks.weanDay; basis = 'プログラムの既定値'; }

    let clamped = false;
    if (weanDay != null){
      const c2 = clamp(weanDay, minD, maxD);
      if (Math.abs(c2 - weanDay) > 0.5){ clamped = true;
        reasons.push(`${meta.name}の運用範囲（${r0(minD)}〜${r0(maxD)}日齢）に合わせて${r0(c2)}日齢に丸めました`); }
      weanDay = c2;
    }

    const stepDownDay = weanDay != null ? Math.round(weanDay - stepDown) : null;
    const peakEndDay = stepDownDay;
    const rampDay = marks.rampStart || null;
    const peakStartDay = marks.peakStart || null;

    const confidence = conf.length ? conf.reduce((x,y)=>x+y,0) / conf.length : 0;

    return {
      weanDay: weanDay != null ? Math.round(weanDay) : null,
      weanDate: weanDay != null ? addDays(a.cow.birth_date, Math.round(weanDay)) : null,
      stepDownDay,
      stepDownDate: stepDownDay != null ? addDays(a.cow.birth_date, stepDownDay) : null,
      peakStartDay,
      peakStartDate: peakStartDay != null ? addDays(a.cow.birth_date, peakStartDay) : null,
      peakEndDay,
      rampDay,
      rampDate: rampDay != null ? addDays(a.cow.birth_date, rampDay) : null,
      dayByStarter: dayByStarter != null ? Math.round(dayByStarter) : null,
      dayByWeight: dayByWeight != null ? Math.round(dayByWeight) : null,
      basis, clamped, reasons, confidence,
      peakL: marks.peakL, peakPerDay: marks.peakPerDay,
      programKey: meta.key, programName: meta.name, weanMin: minD, weanMax: maxD,
      targetKg: bw ? bw * mult : null
    };
  },

  /** 牧場内で何パーセンタイルか */
  percentile(cow, latest){
    const bm = Store.benchmark;
    if (!bm || !latest || !bm.weightByAge) return null;
    const rows = bm.weightByAge[cow.breed] || bm.weightByAge['未設定'];
    if (!rows || !rows.length) return null;
    const bk = Math.floor(latest.day / 10) * 10;
    let best = null, bestDist = 1e9;
    rows.forEach(r => { const d = Math.abs(r.day - bk); if (d < bestDist){ bestDist = d; best = r; } });
    if (!best || bestDist > 20 || best.n < 3) return null;
    const kg = latest.kg;
    const marks = [[best.p10,10],[best.p25,25],[best.p50,50],[best.p75,75],[best.p90,90]]
      .filter(m => m[0] != null);
    if (!marks.length) return null;
    let p;
    if (kg <= marks[0][0]) p = marks[0][1];
    else if (kg >= marks[marks.length-1][0]) p = marks[marks.length-1][1];
    else {
      for (let i = 0; i < marks.length - 1; i++){
        const [v0,p0] = marks[i], [v1,p1] = marks[i+1];
        if (kg >= v0 && kg <= v1){ p = v1 === v0 ? p0 : p0 + (p1-p0)*(kg-v0)/(v1-v0); break; }
      }
    }
    return { pct: p, bucket: best, n: best.n, kg };
  },

  reproSummary(cow, rows){
    const ai = rows.filter(r => r.type === 'AI' || r.type === '授精')
                   .sort((a,b) => String(a.date) < String(b.date) ? -1 : 1);
    const pd = rows.filter(r => r.type === '妊鑑')
                   .sort((a,b) => String(a.date) < String(b.date) ? -1 : 1);
    const calv = rows.filter(r => r.type === '分娩')
                     .sort((a,b) => String(a.date) < String(b.date) ? -1 : 1);
    const o = { ai, pd, calving: calv };
    o.firstAiDate = ai.length ? ai[0].date : null;
    // 牛群検定システムに初回授精月齢の記載があればそちらが正（CSVの「初回授精日」は
    // 今の産次の初回授精なので、経産牛では生涯の初回授精にならない）
    const statedAi = num(cow.first_ai_month);
    o.firstAiMonth = statedAi != null ? statedAi
      : (o.firstAiDate ? ageMonths(cow.birth_date, o.firstAiDate) : null);
    o.firstAiStated = statedAi != null;
    const firstCalv = calv.find(r => String(r.parity) === '1') || (num(cow.parity) === 1 ? calv[0] : null);
    o.firstCalvingDate = firstCalv ? firstCalv.date : null;
    o.firstCalvingMonth = o.firstCalvingDate ? ageMonths(cow.birth_date, o.firstCalvingDate) : null;
    o.parity = num(cow.parity);

    // 受胎日：妊娠鑑定＋の直前のAI。分娩があれば分娩の280日前で補正
    let concDate = null;
    const posPd = pd.filter(p => String(p.result || '').match(/^[+＋]|^陽性|^受胎/));
    if (posPd.length){
      const p0 = posPd[0];
      const before = ai.filter(x => String(x.date) <= String(p0.date));
      if (before.length) concDate = before[before.length - 1].date;
    }
    if (!concDate && o.firstCalvingDate) concDate = addDays(o.firstCalvingDate, -280);
    o.conceptionDate = concDate;
    o.conceptionMonth = concDate ? ageMonths(cow.birth_date, concDate) : null;
    o.aiToConception = concDate ? ai.filter(x => String(x.date) <= String(concDate)).length
                                : (ai.length || null);
    o.aiCount = ai.length;
    o.open = !concDate && ai.length > 0;
    return o;
  }
};

/* ------------------------------------------------------------
   5. グラフ（外部ライブラリなし・SVGを直接描く）
   ------------------------------------------------------------ */
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}

const Chart = {
  /**
   * 折れ線・面・棒をまとめて描く。
   * opts = { series, bands, bars, markers, x:{domain,label,fmt}, y:{...},
   *          height, caption, tableRows }
   */
  plot(opts){
    const W = 660, H = opts.height || 260;
    const P = { t: 18, r: 16, b: 42, l: 58 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;

    const series = (opts.series || []).filter(s => s.points && s.points.length);
    const bars   = (opts.bars || []).filter(s => s.points && s.points.length);
    const bands  = opts.bands || [];
    const hasScatter = (opts.scatter || []).some(s => s.points && s.points.length);

    // --- 定義域 ---
    let xs = [], ys = [];
    series.forEach(s => s.points.forEach(p => { xs.push(p.x); ys.push(p.y); }));
    const stacked = !!opts.stackBars && bars.length > 1;
    if (stacked){
      // 同じxの合計で定義域をとる（積み上げの高さ）
      const sum = {};
      bars.forEach(s => s.points.forEach(p => {
        xs.push(p.x); if (p.y == null) return;
        sum[p.x] = (sum[p.x] || 0) + p.y;
      }));
      Object.keys(sum).forEach(k => ys.push(sum[k]));
      ys.push(0);
    } else {
      bars.forEach(s => s.points.forEach(p => { xs.push(p.x); ys.push(p.y); ys.push(0); }));
    }
    bands.forEach(b => b.points.forEach(p => { xs.push(p.x); ys.push(p.lo); ys.push(p.hi); }));
    (opts.scatter || []).forEach(sc => (sc.points || []).forEach(p => { xs.push(p.x); ys.push(p.y); }));
    (opts.markers || []).forEach(m => xs.push(m.x));
    if (!xs.length) return el('div', { class: 'empty' }, el('div', { class: 'big' }, '📉'), 'データがありません');
    void hasScatter;

    let x0 = opts.x?.domain?.[0] ?? Math.min(...xs);
    let x1 = opts.x?.domain?.[1] ?? Math.max(...xs);
    if (x1 - x0 < 1) x1 = x0 + 1;
    let y0 = opts.y?.domain?.[0] ?? Math.min(...ys);
    let y1 = opts.y?.domain?.[1] ?? Math.max(...ys);
    if (opts.y?.zero) y0 = Math.min(0, y0);
    if (y1 - y0 < 1e-6) { y1 = y0 + 1; }
    const padY = (y1 - y0) * .10;
    if (opts.y?.domain == null){ y1 += padY; if (!opts.y?.zero) y0 -= padY; }
    if (opts.y?.zero) y0 = Math.min(0, y0);

    const X = v => P.l + (v - x0) / (x1 - x0) * iw;
    const Y = v => P.t + ih - (v - y0) / (y1 - y0) * ih;

    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
                            'aria-label': opts.caption || 'グラフ' });

    // --- 目盛り ---
    const yTicks = niceTicks(y0, y1, 4);
    const gridC = cssVar('--grid'), mutedC = cssVar('--muted'), lineC = cssVar('--line');
    yTicks.forEach(t => {
      if (t < y0 || t > y1) return;
      svg.appendChild(sv('line', { x1: P.l, x2: W - P.r, y1: Y(t), y2: Y(t),
        stroke: gridC, 'stroke-width': 1.4 }));
      const lb = sv('text', { x: P.l - 9, y: Y(t) + 6, 'text-anchor': 'end',
        fill: mutedC, 'font-size': 17 });
      lb.textContent = (opts.y?.fmt || (v => r0(v)))(t);
      svg.appendChild(lb);
    });
    const xTicks = niceTicks(x0, x1, Math.min(6, Math.max(3, Math.floor(iw / 90))));
    xTicks.forEach(t => {
      if (t < x0 || t > x1) return;
      const lb = sv('text', { x: X(t), y: H - 12, 'text-anchor': 'middle',
        fill: mutedC, 'font-size': 17 });
      lb.textContent = (opts.x?.fmt || (v => r0(v)))(t);
      svg.appendChild(lb);
    });
    // 基線
    svg.appendChild(sv('line', { x1: P.l, x2: W - P.r, y1: P.t + ih, y2: P.t + ih,
      stroke: lineC, 'stroke-width': 1.6 }));

    // --- 帯（分布のレンジ）---
    bands.forEach(b => {
      const pts = b.points.filter(p => p.lo != null && p.hi != null);
      if (pts.length < 2) return;
      const up = pts.map(p => `${X(p.x)},${Y(p.hi)}`).join(' ');
      const dn = pts.slice().reverse().map(p => `${X(p.x)},${Y(p.lo)}`).join(' ');
      svg.appendChild(sv('polygon', { points: up + ' ' + dn, fill: b.color || cssVar('--band'),
        stroke: 'none' }));
    });

    // --- 縦の目印（予測日など）。ラベルが重ならないよう段をずらす ---
    const placed = [];   // {x, row}
    (opts.markers || []).slice().sort((a,b) => a.x - b.x).forEach(m => {
      if (m.x < x0 || m.x > x1) return;
      svg.appendChild(sv('line', { x1: X(m.x), x2: X(m.x), y1: P.t, y2: P.t + ih,
        stroke: m.color || cssVar('--s2'), 'stroke-width': 1.5,
        'stroke-dasharray': m.solid ? null : '4 4', opacity: .75 }));
      if (!m.label) return;
      const px = X(m.x);
      const width = m.label.length * 17 + 12;
      let row = 0;
      while (placed.some(p => p.row === row && Math.abs(p.x - px) < (p.w + width) / 2)) row++;
      placed.push({ x: px, row, w: width });
      const anchor = px > W - width ? 'end' : 'start';
      const t = sv('text', { x: px + (anchor === 'end' ? -6 : 6), y: P.t + 16 + row * 20,
        fill: m.color || cssVar('--s2'), 'font-size': 17, 'font-weight': 700,
        'text-anchor': anchor });
      t.textContent = m.label;
      svg.appendChild(t);
    });

    // --- 棒 ---
    const uniqX = Array.from(new Set(bars.flatMap(s => s.points.map(p => p.x)))).sort((a,b)=>a-b);
    const bw = uniqX.length > 1
      ? Math.max(2, Math.min(16, iw / uniqX.length - 2))
      : 16;
    const base = {};   // 積み上げ用の積算値（xごと）
    bars.forEach((s, si) => {
      const last = si === bars.length - 1;
      s.points.forEach(p => {
        if (p.y == null || p.x < x0 || p.x > x1) return;
        let yTop, h;
        if (stacked){
          const b0 = base[p.x] || 0;
          const b1 = b0 + p.y;
          base[p.x] = b1;
          yTop = Y(Math.max(b0, b1));
          h = Math.abs(Y(b0) - Y(b1));
        } else {
          h = Math.max(0, Y(Math.min(0, y1 >= 0 ? 0 : y0)) - Y(p.y));
          yTop = p.y >= 0 ? Y(p.y) : Y(0);
        }
        if (stacked && Math.abs(p.y) < 1e-9) return;
        const r = stacked ? (last ? Math.min(4, bw/2) : 0) : Math.min(4, bw/2);
        svg.appendChild(sv('rect', {
          x: X(p.x) - bw/2, y: yTop, width: bw, height: Math.max(1.5, Math.abs(h)),
          fill: s.color, rx: r, opacity: s.opacity ?? 1
        }));
      });
    });

    // --- 折れ線 ---
    series.forEach(s => {
      const pts = s.points.filter(p => p.y != null).sort((a,b) => a.x - b.x);
      if (!pts.length) return;
      if (s.area){
        const d = `M${X(pts[0].x)},${Y(Math.max(y0,0))} ` +
          pts.map(p => `L${X(p.x)},${Y(p.y)}`).join(' ') +
          ` L${X(pts[pts.length-1].x)},${Y(Math.max(y0,0))} Z`;
        svg.appendChild(sv('path', { d, fill: s.color, opacity: .13, stroke: 'none' }));
      }
      if (pts.length > 1){
        svg.appendChild(sv('path', {
          d: 'M' + pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' L'),
          fill: 'none', stroke: s.color, 'stroke-width': s.width || 2,
          'stroke-linecap': 'round', 'stroke-linejoin': 'round',
          'stroke-dasharray': s.dashed ? '5 4' : null, opacity: s.opacity ?? 1
        }));
      }
      if (s.dots){
        pts.forEach(p => {
          const surf = cssVar('--surface');
          svg.appendChild(sv('circle', { cx: X(p.x), cy: Y(p.y), r: p.big ? 6 : 4.5,
            fill: p.hollow ? surf : s.color, stroke: p.hollow ? s.color : surf,
            'stroke-width': 2 }));
        });
      }
    });

    // --- 散布（線を引かず、印だけ打つ）---
    (opts.scatter || []).forEach(sc => {
      const shape = sc.shape || 'circle';
      (sc.points || []).forEach(p => {
        if (p.y == null || p.x < x0 || p.x > x1) return;
        const cx = X(p.x), cy = Y(p.y), r = sc.r || 3.6;
        if (shape === 'square')
          svg.appendChild(sv('rect', { x: cx - r, y: cy - r, width: r*2, height: r*2,
            rx: 1, fill: sc.color, opacity: sc.opacity ?? .85 }));
        else if (shape === 'triangle')
          svg.appendChild(sv('polygon', {
            points: `${cx},${cy-r*1.15} ${cx-r*1.05},${cy+r*0.8} ${cx+r*1.05},${cy+r*0.8}`,
            fill: sc.color, opacity: sc.opacity ?? .85 }));
        else
          svg.appendChild(sv('circle', { cx, cy, r, fill: sc.color, opacity: sc.opacity ?? .85 }));
      });
    });

    // --- 直接ラベル（最終点）---
    series.filter(s => s.label !== false && s.points.length).forEach(s => {
      const pts = s.points.filter(p => p.y != null).sort((a,b) => a.x - b.x);
      if (!pts.length || s.noEndLabel) return;
      const last = pts[pts.length - 1];
      if (X(last.x) > W - P.r - 4) return;
      const t = sv('text', { x: X(last.x) + 7, y: Y(last.y) + 3.5,
        fill: cssVar('--ink-2'), 'font-size': 17, 'font-weight': 650 });
      t.textContent = s.name;
      svg.appendChild(t);
    });

    // --- 当て先（ホバー）---
    const hover = sv('line', { x1: 0, x2: 0, y1: P.t, y2: P.t + ih,
      stroke: cssVar('--line'), 'stroke-width': 1, opacity: 0 });
    svg.appendChild(hover);

    const box = el('div', { class: 'chartbox' });
    box.appendChild(svg);
    const tip = el('div', { class: 'tip' });
    box.appendChild(tip);

    const all = series.concat(bars);
    const scatterPts = (opts.scatter || []).flatMap(sc =>
      (sc.points || []).map(p => Object.assign({}, p, { _name: sc.name, _color: sc.color })));
    const move = ev => {
      const rect = svg.getBoundingClientRect();
      const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      const vx = cx / rect.width * W;
      const dataX = x0 + (vx - P.l) / iw * (x1 - x0);
      let nearest = null, nd = 1e9, scHit = null;
      all.forEach(s => s.points.forEach(p => {
        const d = Math.abs(p.x - dataX);
        if (d < nd){ nd = d; nearest = p; }
      }));
      // 散布点は「一番近い点」を直接拾う（縦にも近いものを優先）
      if (scatterPts.length){
        const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
        const vy = cy / rect.height * H;
        let best = 1e9;
        scatterPts.forEach(p => {
          const dx = X(p.x) - vx, dy = Y(p.y) - vy;
          const d2 = dx*dx + dy*dy;
          if (d2 < best && d2 < 400){ best = d2; scHit = p; }
        });
      }
      if (scHit){
        hover.setAttribute('opacity', 0);
        tip.innerHTML = `<div style="font-weight:650;margin-bottom:2px">${esc(scHit.label || '')}</div>` +
          `<div class="r"><i style="background:${scHit._color}"></i>${esc(scHit._name || '')} <b>${esc(scHit.tip || r1(scHit.y))}</b></div>`;
        tip.classList.add('on');
        tip.style.left = clamp(X(scHit.x) / W * rect.width, 70, rect.width - 70) + 'px';
        tip.style.top = Math.max(28, Y(scHit.y) / H * rect.height - 8) + 'px';
        return;
      }
      if (!nearest || nd > (x1 - x0) / 12){ tip.classList.remove('on'); hover.setAttribute('opacity', 0); return; }
      hover.setAttribute('x1', X(nearest.x)); hover.setAttribute('x2', X(nearest.x));
      hover.setAttribute('opacity', .9);
      const rows = [];
      all.forEach(s => {
        const p = s.points.find(q => q.x === nearest.x);
        if (p && p.y != null) rows.push(
          `<div class="r"><i style="background:${s.color}"></i>${esc(s.name)} <b>${esc((s.fmt || opts.tipFmt || (v => r1(v)))(p.y))}</b></div>`);
      });
      tip.innerHTML = `<div style="font-weight:650;margin-bottom:2px">${esc((opts.x?.tip || opts.x?.fmt || (v=>r0(v)))(nearest.x))}</div>` + rows.join('');
      tip.classList.add('on');
      const px = X(nearest.x) / W * rect.width;
      tip.style.left = clamp(px, 60, rect.width - 60) + 'px';
      tip.style.top = Math.max(28, Y(nearest.y) / H * rect.height - 8) + 'px';
    };
    const leave = () => { tip.classList.remove('on'); hover.setAttribute('opacity', 0); };
    box.addEventListener('mousemove', move);
    box.addEventListener('mouseleave', leave);
    box.addEventListener('touchstart', move, { passive: true });
    box.addEventListener('touchmove', move, { passive: true });
    box.addEventListener('touchend', leave);

    // --- 凡例 ---
    const legendItems = [];
    bands.forEach(b => b.name && legendItems.push({ name: b.name, color: b.color, kind: 'band' }));
    all.forEach(s => s.name && legendItems.push({ name: s.name, color: s.color,
      kind: s.dots && s.points.length < 40 ? 'dot' : 'line' }));
    (opts.scatter || []).forEach(sc => sc.name && legendItems.push({
      name: sc.name, color: sc.color, kind: 'dot' }));

    const fig = el('figure', { class: 'chart' });
    if (legendItems.length >= 2){
      fig.appendChild(el('div', { class: 'legend' }, legendItems.map(li =>
        el('span', { class: 'li' },
          el('span', { class: 'sw ' + (li.kind === 'dot' ? 'dot' : li.kind === 'band' ? 'band' : ''),
                       style: 'background:' + li.color }),
          li.name))));
    }
    fig.appendChild(box);
    if (opts.caption) fig.appendChild(el('figcaption', {}, opts.caption));
    return fig;
  }
};

function niceTicks(lo, hi, n){
  if (!(isFinite(lo) && isFinite(hi)) || hi <= lo) return [lo];
  const raw = (hi - lo) / Math.max(1, n);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v*1e6)/1e6);
  return out;
}

/** 小さな横棒（パーセンタイル表示など） */
function meter(pct, opts){
  opts = opts || {};
  const p = clamp(pct == null ? 0 : pct, 0, 100);
  const color = opts.color || (p < 25 ? cssVar('--crit') : p < 40 ? cssVar('--serious')
              : p > 75 ? cssVar('--s3') : cssVar('--s1'));
  const wrap = el('div', { style: 'margin-top:8px' });
  const bar = el('div', { style: `position:relative;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden` });
  bar.appendChild(el('div', { style: `position:absolute;inset:0 auto 0 0;width:${p}%;background:${color};border-radius:5px` }));
  [25,50,75].forEach(t => bar.appendChild(el('div', {
    style: `position:absolute;left:${t}%;top:0;bottom:0;width:2px;background:var(--surface);opacity:.85` })));
  wrap.appendChild(bar);
  if (opts.labels !== false)
    wrap.appendChild(el('div', { style: 'display:flex;justify-content:space-between;font-size:calc(10.5px * var(--fs));color:var(--muted);margin-top:4px' },
      el('span', {}, '小さい'), el('span', {}, '牧場の真ん中'), el('span', {}, '大きい')));
  return wrap;
}

/* ------------------------------------------------------------
   箱ひげ図（充足率の分布など）
   groups = [{ label, values:[数値], color? }]
   ------------------------------------------------------------ */
Chart.box = function(opts){
  const groups = (opts.groups || []).filter(g => g.values && g.values.length);
  if (!groups.length)
    return el('div', { class: 'empty' }, el('div', { class: 'big' }, '📦'), 'データがありません');

  const W = 660, H = opts.height || 260;
  const P = { t: 16, r: 14, b: 46, l: 58 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;

  const stats = groups.map(g => {
    const v = g.values.slice().sort((a, b) => a - b);
    const q = p => pctl(v, p);
    const q1 = q(.25), q3 = q(.75), med = q(.5);
    const iqr = q3 - q1;
    const loF = q1 - 1.5 * iqr, hiF = q3 + 1.5 * iqr;
    const inl = v.filter(x => x >= loF && x <= hiF);
    return { label: g.label, color: g.color, n: v.length,
             min: inl.length ? inl[0] : v[0],
             max: inl.length ? inl[inl.length-1] : v[v.length-1],
             q1, q3, med, mean: v.reduce((a,b)=>a+b,0)/v.length,
             out: v.filter(x => x < loF || x > hiF) };
  });

  let lo = Math.min(...stats.map(s => Math.min(s.min, ...s.out)));
  let hi = Math.max(...stats.map(s => Math.max(s.max, ...s.out)));
  if (opts.y?.domain){ lo = opts.y.domain[0]; hi = opts.y.domain[1]; }
  else { const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad; }

  const Y = v => P.t + ih - (v - lo) / (hi - lo) * ih;
  const slot = iw / stats.length;
  const bw = Math.min(34, slot * .58);

  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
                          'aria-label': opts.caption || '箱ひげ図' });
  const gridC = cssVar('--grid'), mutedC = cssVar('--muted'), surf = cssVar('--surface');

  niceTicks(lo, hi, 4).forEach(t => {
    if (t < lo || t > hi) return;
    svg.appendChild(sv('line', { x1: P.l, x2: W - P.r, y1: Y(t), y2: Y(t),
      stroke: gridC, 'stroke-width': 1 }));
    const lb = sv('text', { x: P.l - 7, y: Y(t) + 4, 'text-anchor': 'end',
      fill: mutedC, 'font-size': 17 });
    lb.textContent = (opts.y?.fmt || (v => r0(v)))(t);
    svg.appendChild(lb);
  });

  // 基準線（充足率100%など）
  (opts.rules || []).forEach(rl => {
    if (rl.y < lo || rl.y > hi) return;
    svg.appendChild(sv('line', { x1: P.l, x2: W - P.r, y1: Y(rl.y), y2: Y(rl.y),
      stroke: rl.color || cssVar('--s3'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
    if (rl.label){
      const t = sv('text', { x: W - P.r - 3, y: Y(rl.y) - 5, 'text-anchor': 'end',
        fill: rl.color || cssVar('--s3'), 'font-size': 17, 'font-weight': 700 });
      t.textContent = rl.label; svg.appendChild(t);
    }
  });

  stats.forEach((s, i) => {
    const cx = P.l + slot * (i + .5);
    const col = s.color || cssVar('--s1');
    // ひげ
    svg.appendChild(sv('line', { x1: cx, x2: cx, y1: Y(s.min), y2: Y(s.max),
      stroke: col, 'stroke-width': 1.5, opacity: .7 }));
    [s.min, s.max].forEach(v => svg.appendChild(sv('line',
      { x1: cx - bw*.25, x2: cx + bw*.25, y1: Y(v), y2: Y(v), stroke: col, 'stroke-width': 1.5 })));
    // 箱
    svg.appendChild(sv('rect', { x: cx - bw/2, y: Y(s.q3), width: bw,
      height: Math.max(2, Y(s.q1) - Y(s.q3)), fill: col, opacity: .28, rx: 3,
      stroke: col, 'stroke-width': 1.5 }));
    // 中央値
    svg.appendChild(sv('line', { x1: cx - bw/2, x2: cx + bw/2, y1: Y(s.med), y2: Y(s.med),
      stroke: col, 'stroke-width': 2.5 }));
    // 平均（×印）
    const m = Y(s.mean), r = 3.4;
    svg.appendChild(sv('path', { d: `M${cx-r},${m-r} L${cx+r},${m+r} M${cx+r},${m-r} L${cx-r},${m+r}`,
      stroke: cssVar('--ink-2'), 'stroke-width': 1.6 }));
    // はずれ値
    s.out.forEach(v => { if (v >= lo && v <= hi)
      svg.appendChild(sv('circle', { cx, cy: Y(v), r: 2.6, fill: surf,
        stroke: col, 'stroke-width': 1.2 })); });
    // ラベル
    const lb = sv('text', { x: cx, y: H - 24, 'text-anchor': 'middle',
      fill: mutedC, 'font-size': 16 });
    lb.textContent = s.label;
    if (stats.length > 6) lb.setAttribute('transform', `rotate(-35 ${cx} ${H-24})`);
    svg.appendChild(lb);
    const nl = sv('text', { x: cx, y: H - 8, 'text-anchor': 'middle',
      fill: mutedC, 'font-size': 15, opacity: .8 });
    nl.textContent = 'n=' + s.n;
    if (stats.length <= 10) svg.appendChild(nl);
  });

  const box = el('div', { class: 'chartbox' });
  box.appendChild(svg);
  const tip = el('div', { class: 'tip' });
  box.appendChild(tip);
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    const vx = cx / rect.width * W;
    const i = Math.floor((vx - P.l) / slot);
    if (i < 0 || i >= stats.length){ tip.classList.remove('on'); return; }
    const s = stats[i], f = opts.y?.fmt || (v => r1(v));
    tip.innerHTML = `<div style="font-weight:650;margin-bottom:3px">${esc(s.label)}（${s.n}頭）</div>` +
      `<div>最大 <b>${f(s.max)}</b></div><div>75% <b>${f(s.q3)}</b></div>` +
      `<div>中央 <b>${f(s.med)}</b></div><div>25% <b>${f(s.q1)}</b></div>` +
      `<div>最小 <b>${f(s.min)}</b></div>` +
      `<div style="color:var(--muted)">平均 <b>${f(s.mean)}</b></div>`;
    tip.classList.add('on');
    tip.style.left = clamp((P.l + slot*(i+.5)) / W * rect.width, 70, rect.width - 70) + 'px';
    tip.style.top = Math.max(70, Y(s.q3) / H * rect.height) + 'px';
  };
  box.addEventListener('mousemove', move);
  box.addEventListener('mouseleave', () => tip.classList.remove('on'));
  box.addEventListener('touchstart', move, { passive: true });
  box.addEventListener('touchmove', move, { passive: true });

  const fig = el('figure', { class: 'chart' });
  fig.appendChild(el('div', { class: 'legend' },
    el('span', { class: 'li' },
      el('span', { class: 'sw band', style: 'background:color-mix(in srgb,var(--s1) 28%,transparent);border:1.5px solid var(--s1)' }),
      '箱＝25〜75%'),
    el('span', { class: 'li' }, el('span', { class: 'sw', style: 'background:var(--s1);height:3px' }), '中央値'),
    el('span', { class: 'li' }, el('span', { style: 'font-weight:700;color:var(--ink-2)' }, '×'), '平均'),
    el('span', { class: 'li' }, el('span', { class: 'sw dot', style: 'background:var(--surface);box-shadow:0 0 0 1.2px var(--s1)' }), 'はずれ値')));
  fig.appendChild(box);
  if (opts.caption) fig.appendChild(el('figcaption', {}, opts.caption));
  return fig;
};

/* ------------------------------------------------------------
   5b. Excel(.xlsx) の読み取り — 外部ライブラリなし
   ------------------------------------------------------------
   .xlsx は中身がZIPなので、ZIPを自前で開いて、
   ブラウザ標準の DecompressionStream で展開し、XMLを読みます。
   通信できない場所でもExcelがそのまま開けるようにするためです。
   ------------------------------------------------------------ */
const XlsxLite = {

  supported(){
    return typeof DecompressionStream === 'function' && typeof DOMParser === 'function';
  },

  /** ArrayBuffer → { sheets: [{name, rows:[[cell,...]]}] } */
  async read(buffer){
    if (!this.supported()) throw new Error('この端末のブラウザではExcelを直接開けません。CSVで保存してください。');
    const files = await this._unzip(buffer);

    const get = n => files[n] ? files[n] : null;
    const parse = txt => new DOMParser().parseFromString(txt, 'application/xml');

    // 共有文字列
    let shared = [];
    const ssRaw = get('xl/sharedStrings.xml');
    if (ssRaw){
      const doc = parse(ssRaw);
      shared = Array.from(doc.getElementsByTagName('si')).map(si => this._siText(si));
    }

    // ワークブック（シート名と rId）
    const wbRaw = get('xl/workbook.xml');
    if (!wbRaw) throw new Error('Excelの構造を読み取れませんでした');
    const wbDoc = parse(wbRaw);
    const relRaw = get('xl/_rels/workbook.xml.rels');
    const relMap = {};
    if (relRaw){
      const rd = parse(relRaw);
      Array.from(rd.getElementsByTagName('Relationship')).forEach(r => {
        let t = r.getAttribute('Target') || '';
        t = t.replace(/^\/?xl\//, '').replace(/^\//, '');
        relMap[r.getAttribute('Id')] = 'xl/' + t;
      });
    }

    const sheets = [];
    const nodes = wbDoc.getElementsByTagName('sheet');
    for (let i = 0; i < nodes.length; i++){
      const nd = nodes[i];
      const name = nd.getAttribute('name');
      const rid = nd.getAttribute('r:id') || nd.getAttributeNS(
        'http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let path = relMap[rid];
      if (!path || !files[path]) path = 'xl/worksheets/sheet' + (i + 1) + '.xml';
      const raw = get(path);
      if (!raw){ sheets.push({ name, rows: [] }); continue; }
      sheets.push({ name, rows: this._sheetRows(parse(raw), shared) });
    }
    return { sheets };
  },

  /**
   * <si> の本文だけを取り出す。
   * Excelの日本語セルには <rPh>（ふりがな）が入っていることがあり、
   * 単純に <t> を全部つなぐと「親」が「親オヤ」になってしまう。
   */
  _siText(node){
    let s = '';
    const walk = n => {
      for (let c = n.firstChild; c; c = c.nextSibling){
        if (c.nodeType !== 1) continue;
        const tag = (c.localName || c.nodeName || '').replace(/^.*:/, '');
        if (tag === 'rPh' || tag === 'phoneticPr') continue;   // ふりがなは飛ばす
        if (tag === 't') s += c.textContent;
        else walk(c);                                          // <r> の中の <t> は拾う
      }
    };
    walk(node);
    return s;
  },

  _sheetRows(doc, shared){
    const rowsOut = [];
    const rows = doc.getElementsByTagName('row');
    for (let i = 0; i < rows.length; i++){
      const rEl = rows[i];
      const rn = parseInt(rEl.getAttribute('r') || String(i + 1), 10);
      const arr = [];
      const cs = rEl.getElementsByTagName('c');
      for (let j = 0; j < cs.length; j++){
        const c = cs[j];
        const ref = c.getAttribute('r') || '';
        const col = this._colIndex(ref.replace(/[0-9]/g, ''));
        const t = c.getAttribute('t');
        let val = '';
        if (t === 'inlineStr'){
          const is = c.getElementsByTagName('is')[0];
          val = is ? this._siText(is) : '';
        } else {
          const v = c.getElementsByTagName('v')[0];
          if (v){
            val = v.textContent;
            if (t === 's') val = shared[parseInt(val, 10)] ?? '';
            else if (t === 'b') val = val === '1' ? 'TRUE' : 'FALSE';
          }
        }
        arr[col >= 0 ? col : arr.length] = val;
      }
      for (let k = 0; k < arr.length; k++) if (arr[k] === undefined) arr[k] = '';
      rowsOut[rn - 1] = arr;
    }
    for (let k = 0; k < rowsOut.length; k++) if (!rowsOut[k]) rowsOut[k] = [];
    return rowsOut;
  },

  _colIndex(letters){
    if (!letters) return -1;
    let n = 0;
    for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  },

  /* --- 最小限のZIP展開 --- */
  async _unzip(buffer){
    const dv = new DataView(buffer);
    const u8 = new Uint8Array(buffer);
    const len = dv.byteLength;

    // 末尾から End of Central Directory を探す
    let eocd = -1;
    for (let i = len - 22; i >= Math.max(0, len - 66000); i--){
      if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Excelファイルとして読めませんでした');
    const count = dv.getUint16(eocd + 10, true);
    let ptr = dv.getUint32(eocd + 16, true);

    const entries = [];
    for (let i = 0; i < count; i++){
      if (dv.getUint32(ptr, true) !== 0x02014b50) break;
      const method  = dv.getUint16(ptr + 10, true);
      const csize   = dv.getUint32(ptr + 20, true);
      const nameLen = dv.getUint16(ptr + 28, true);
      const extraLen= dv.getUint16(ptr + 30, true);
      const cmtLen  = dv.getUint16(ptr + 32, true);
      const lho     = dv.getUint32(ptr + 42, true);
      const name    = new TextDecoder('utf-8').decode(u8.subarray(ptr + 46, ptr + 46 + nameLen));
      entries.push({ name, method, csize, lho });
      ptr += 46 + nameLen + extraLen + cmtLen;
    }

    const want = n => /^xl\/(workbook\.xml|sharedStrings\.xml|_rels\/workbook\.xml\.rels|worksheets\/.+\.xml)$/.test(n);
    const out = {};
    for (const e of entries){
      if (!want(e.name)) continue;
      // ローカルヘッダを読んで実データの位置を出す
      const lnameLen = dv.getUint16(e.lho + 26, true);
      const lextraLen = dv.getUint16(e.lho + 28, true);
      const start = e.lho + 30 + lnameLen + lextraLen;
      const data = u8.subarray(start, start + e.csize);
      let bytes;
      if (e.method === 0) bytes = data;
      else if (e.method === 8) bytes = await this._inflateRaw(data);
      else continue;
      out[e.name] = new TextDecoder('utf-8').decode(bytes);
    }
    return out;
  },

  async _inflateRaw(bytes){
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
};

/* ------------------------------------------------------------
   6. 画面の骨格とルーティング
   ------------------------------------------------------------ */
const App = {
  view: 'search',
  cowNo: null,
  tab: 'overview',
  ready: false,
  recent: LS.get('sw.recent', []),

  go(view, opts){
    Object.assign(this, { view }, opts || {});
    if (view !== 'cow') this.cowNo = null;
    window.scrollTo(0, 0);
    this.render();
  },

  openCow(no, tab){
    this.view = 'cow'; this.cowNo = String(no); this.tab = tab || 'overview';
    this.recent = [String(no)].concat(this.recent.filter(x => x !== String(no))).slice(0, 8);
    LS.set('sw.recent', this.recent);
    window.scrollTo(0, 0);
    this.render();
  },

  /** 管理番号 → ネック番号 → 個体識別番号（下4桁も可）→ 名号 の順に探す */
  findCow(q){
    const s = String(q).trim().replace(/[\s　]/g, '');
    if (!s) return [];
    const seen = new Set(), out = [];
    const add = list => list.forEach(c => {
      if (!seen.has(c.cow_no)){ seen.add(c.cow_no); out.push(c); } });

    add(Store.cows.filter(c => c.tag4 === s));
    add(Store.cows.filter(c => c.neck_no === s));
    add(Store.cows.filter(c => c.cow_no === s));
    if (s.length >= 3){
      add(Store.cows.filter(c => c.tag4.startsWith(s)));
      add(Store.cows.filter(c => c.cow_no.endsWith(s)));
      add(Store.cows.filter(c => c.cow_no.startsWith(s)));
    }
    if (/[^0-9]/.test(s)) add(Store.cows.filter(c => c.name && c.name.includes(s)));
    return out;
  },

  setTop(title, sub, back){
    $('#topTitle').firstChild.nodeValue = title;
    $('#topSub').textContent = sub || '';
    $('#btnBack').hidden = !back;
  },

  render(){
    $$('.nav button').forEach(b =>
      b.setAttribute('aria-current',
        b.dataset.nav === this.view || (this.view === 'cow' && b.dataset.nav === 'search')
          ? 'page' : 'false'));

    const main = $('#main');
    main.innerHTML = '';
    const v = el('div', { class: 'view' });
    main.appendChild(v);

    if (!this.ready){ v.appendChild(viewLoading()); return; }

    // バックエンドが古いときは、どの画面でもいちばん上に出す
    const up = appUpdateNote();
    if (up) v.appendChild(up);
    const warn = backendUpdateNote();
    if (warn) v.appendChild(warn);

    switch (this.view){
      case 'search':   this.setTop('個体を探す', statusLine()); v.appendChild(viewSearch()); break;
      case 'cow':      viewCow(v); break;
      case 'entry':    this.setTop('今日の記録', statusLine()); v.appendChild(viewEntry()); break;
      case 'herd':     this.setTop('牛群', statusLine()); v.appendChild(viewHerd()); break;
      case 'settings': this.setTop('設定', statusLine()); v.appendChild(viewSettings()); break;
      case 'import':   this.setTop('データ取り込み', '', true); v.appendChild(viewImport()); break;
    }
  }
};

function statusLine(){
  if (Store.isRemote) return (Store.online ? '共有中' : '接続待ち') + ' · ' +
    Store.cows.length + '頭' + (Store.cfg.user ? ' · ' + Store.cfg.user : '');
  return 'お試しモード（この端末のみ）· ' + Store.cows.length + '頭';
}

function viewLoading(){
  return el('div', { class: 'empty' }, el('div', { class: 'spinner' }),
    el('div', { style: 'margin-top:14px' }, 'データを読み込んでいます…'));
}

/* ------------------------------------------------------------
   7. 検索画面 — 4桁テンキー
   ------------------------------------------------------------ */
let searchBuf = '';
let searchMode = LS.get('sw.searchMode', 'tag4');   // tag4 | neck

function viewSearch(){
  const wrap = el('div');

  if (!Store.cows.length){
    wrap.appendChild(el('div', { class: 'note' },
      el('b', {}, 'まだ牛が登録されていません。'), ' ',
      '「入力 → 出生登録」から1頭ずつ登録するか、',
      '「設定 → データ取り込み」で今までのExcel/CSVをまとめて読み込めます。'));
  }

  const card = el('div', { class: 'card' });

  // 検索の種類
  card.appendChild(el('div', { class: 'chips', style: 'margin-bottom:12px' },
    el('button', { class: 'chip', 'aria-pressed': searchMode === 'tag4',
      onclick: () => { searchMode = 'tag4'; LS.set('sw.searchMode','tag4'); App.render(); } }, '4桁'),
    el('button', { class: 'chip', 'aria-pressed': searchMode === 'neck',
      onclick: () => { searchMode = 'neck'; LS.set('sw.searchMode','neck'); App.render(); } }, 'ネック番号'),
    el('button', { class: 'chip', 'aria-pressed': searchMode === 'ear',
      onclick: () => { searchMode = 'ear'; LS.set('sw.searchMode','ear'); App.render(); } }, '耳標10桁')
  ));

  const disp = el('div', { class: 'bignum', id: 'searchDisp' });
  const paint = () => {
    const need = searchMode === 'ear' ? 4 : searchMode === 'neck' ? 3 : 4;
    const s = searchBuf.padEnd(Math.max(need, searchBuf.length), '·');
    disp.innerHTML = Array.from(s).map((ch, i) =>
      ch === '·' ? '<span class="ph">0</span>' : esc(ch)).join('');
    renderHits();
  };
  card.appendChild(disp);

  const hits = el('div', { id: 'searchHits' });

  function renderHits(){
    hits.innerHTML = '';
    if (!searchBuf){
      if (App.recent.length){
        hits.appendChild(el('div', { style: 'font-size:calc(11.5px * var(--fs));color:var(--muted);margin:14px 0 4px' }, '最近見た牛'));
        App.recent.forEach(no => {
          const c = Store.cows.find(x => x.cow_no === no);
          if (c) hits.appendChild(cowRow(c));
        });
      }
      return;
    }
    const found = searchMode === 'neck'
      ? Store.cows.filter(c => c.neck_no && (c.neck_no === searchBuf || c.neck_no.startsWith(searchBuf)))
      : searchMode === 'ear'
      ? Store.cows.filter(c => c.cow_no === searchBuf || c.cow_no.endsWith(searchBuf))
      : Store.cows.filter(c => c.tag4 === searchBuf ||
          (searchBuf.length >= 2 && c.tag4.startsWith(searchBuf)));
    if (!found.length){
      hits.appendChild(el('div', { class: 'empty', style: 'padding:22px 10px' },
        '該当なし',
        el('div', { style: 'margin-top:10px' },
          el('button', { class: 'btn sm', onclick: () => openBirthForm({ tag4: searchBuf }) },
            '＋ この番号で出生登録'))));
      return;
    }
    if (found.length === 1 && searchBuf.length >= (searchMode === 'ear' ? 4 : 3)){
      App.openCow(found[0].cow_no);
      return;
    }
    // タップされるより先に、いちばん上の牛の記録を取りに行っておく。
    // 押したときには、もう手元にあることが多くなります。
    if (found.length) Store.warm(found[0].cow_no);
    found.slice(0, 24).forEach(c => hits.appendChild(cowRow(c)));
  }

  const key = v => {
    if (v === 'del') searchBuf = searchBuf.slice(0, -1);
    else if (v === 'clr') searchBuf = '';
    else if (searchBuf.length < 10) searchBuf += v;
    paint();
  };

  const pad = el('div', { class: 'pad' });
  ['1','2','3','4','5','6','7','8','9'].forEach(n =>
    pad.appendChild(el('button', { onclick: () => key(n) }, n)));
  pad.appendChild(el('button', { class: 'sec', onclick: () => key('clr') }, 'C'));
  pad.appendChild(el('button', { onclick: () => key('0') }, '0'));
  pad.appendChild(el('button', { class: 'sec', onclick: () => key('del') }, '⌫'));
  card.appendChild(pad);

  card.appendChild(el('div', { style: 'margin-top:12px' },
    el('input', { class: 'inp', placeholder: '名号や個体識別番号10桁でも探せます',
      oninput: e => { searchBuf = e.target.value.trim(); renderHits(); } })));

  wrap.appendChild(card);
  wrap.appendChild(hits);
  paint();
  return wrap;
}

function cowRow(c, extra){
  const a = ageDays(c.birth_date);
  const m = ageMonths(c.birth_date);
  return el('div', { class: 'row', onclick: () => App.openCow(c.cow_no) },

    el('div', { class: 'mid' },

function needsBackendUpdate(){
  return Store.isRemote && Store.missingTables && Store.missingTables.length > 0;
}

const TABLE_LABEL = {
  pens: '牛舎の配置', colostrum: '初乳', daily_check: '毎日の作業チェック',
  cows: '個体', weights: '体重', milk_feed: '哺乳', starter: 'スターター',
  repro: '繁殖', events: '記録', genomics: 'ゲノム', milk_test: '乳検'
};

/**
 * 読み直したのに、まだ古い画面のままだったときの案内。
 * ふつうは自動で新しくなるので、これが出るのは
 * 「version.txt だけ上げて index.html を上げ忘れた」ときだけです。
 */
function appUpdateNote(){
  if (!Updater.stuck || !Updater.latest) return null;
  const c = el('div', { class: 'note warn' });
  c.appendChild(el('div', { style: 'font-weight:700;margin-bottom:6px' },
    '新しい画面が届いていません'));
  c.appendChild(el('div', {},
    'サーバ側は ', el('b', {}, Updater.latest), ' ですが、',
    'この画面は ', el('b', {}, BUILD_ID), ' のままです。',
    el('br'),
    'GitHub に index.html を上げ忘れていないか確かめてください（version.txt だけ新しい状態です）。'));
  const b = el('button', { class: 'btn sm', style: 'margin-top:8px' }, 'もう一度ためす');
  b.onclick = () => { sessionStorage.removeItem('sw.tried'); Updater.apply(Updater.latest); };
  c.appendChild(b);
  return c;
}

function backendUpdateNote(){
  if (!needsBackendUpdate()) return null;
  const names = Store.missingTables.map(t => TABLE_LABEL[t] || t);
  const c = el('div', { class: 'note crit' });
  c.appendChild(el('div', { style: 'font-weight:700;margin-bottom:6px' },
    'スプレッドシート側のコードが古いままです'));
  c.appendChild(el('div', {},
    'アプリの画面は新しくなっていますが、Apps Script のコードが前のままなので、',
    el('b', {}, names.join('・')),
    ' が保存できません。'));
  c.appendChild(el('div', { style: 'margin-top:8px' },
    '直し方（3分ほど）：',
    el('div', { style: 'margin-top:4px;line-height:1.9' },
      '① スプレッドシートを開く → 拡張機能 → Apps Script', el('br'),
      '② 中身をすべて消して、新しい ', el('b', {}, 'Code.gs'), ' を貼り付ける', el('br'),
      '③ 保存（💾）', el('br'),
      '④ 右上の ', el('b', {}, 'デプロイ'), ' → ', el('b', {}, 'デプロイを管理'),
      ' → ✏️（編集）', el('br'),
      '⑤ バージョンを ', el('b', {}, '「新バージョン」'), ' にして ',
      el('b', {}, 'デプロイ'))));
  c.appendChild(el('div', { style: 'margin-top:8px' },
    'URLは変わりません。データもそのまま残ります。'));
  return c;
}

const COW_TABS = [
  ['overview', '概要'], ['milk', '哺乳'], ['weight', '体重'],
  ['repro', '繁殖'], ['genome', 'ゲノム'], ['milktest', '乳検'], ['log', '記録']
];

async function viewCow(container){
  const cow = Store.cows.find(c => String(c.cow_no) === String(App.cowNo));
  if (!cow){
    App.setTop('見つかりません', '', true);
    container.appendChild(el('div', { class: 'empty' }, 'この個体は登録されていません'));
    return;
  }
  App.setTop(cow.tag4 + (cow.name ? ' ' + cow.name : ''),
    [cow.breed, cow.neck_no ? 'ネック ' + cow.neck_no : null,
     cow.birth_date ? ageDays(cow.birth_date) + '日齢' : null].filter(Boolean).join(' · '), true);

  /* 待たせないための組み立て。
     4桁・日齢・いまの体重は、もう手元にあるので先に出します。
     記録の読み込みを待つあいだ、真っ白な画面を見せないためです。 */
  container.appendChild(quickHeader(cow));

  const tabs = el('div', { class: 'tabs' });
  COW_TABS.forEach(([k, label]) => tabs.appendChild(el('button', {
    'aria-selected': App.tab === k,
    onclick: () => { App.tab = k; App.render(); }
  }, label)));
  container.appendChild(tabs);

  const body = el('div', {}, el('div', { class: 'empty' }, el('div', { class: 'spinner' })));
  container.appendChild(body);

  let rec;
  try { rec = await Store.cow(cow.cow_no); }
  catch (e){
    body.innerHTML = '';
    body.appendChild(el('div', { class: 'note crit' }, e.message));
    return;
  }
  // 途中で別の牛に移っていたら、もう描かない
  if (String(App.cowNo) !== String(cow.cow_no) || !container.isConnected) return;

  const a = Calc.analyze(cow, rec);
  container.replaceChild(cowHeader(cow, a), container.firstChild);

  body.innerHTML = '';
  ({
    overview: tabOverview, milk: tabMilk, weight: tabWeight,
    repro: tabRepro, genome: tabGenome, milktest: tabMilkTest, log: tabLog
  }[App.tab] || tabOverview)(body, cow, a);
}

function cowHeader(cow, a){
  const c = el('div', { class: 'card' });
  // 1行目：4桁・名号・生年月日・編集ボタン
  c.appendChild(el('div', { style: 'display:flex;align-items:flex-start;gap:14px' },
    el('div', { style: 'flex:none' },

                         'letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums' },
        cow.tag4 || '—'),
      el('div', { style: 'font-size:var(--t0);color:var(--muted);margin-top:4px;' +
                         'font-variant-numeric:tabular-nums' },
        fmtEarTag(cow.cow_no))),
    el('div', { style: 'flex:1;min-width:0' },
      el('div', { style: 'font-size:var(--t3);font-weight:700' }, cow.name || '（名号なし）'),
      el('div', { style: 'font-size:var(--t1);color:var(--ink-2);margin-top:3px;line-height:1.5' },
        [cow.birth_date ? fmtDateFull(cow.birth_date) + '生' : '生年月日 未登録',

    el('button', { class: 'iconbtn', title: '基本情報を編集',
      onclick: () => openBirthForm(cow) }, '✎')));

  // 2行目：品種・ネック・ステージ。カード幅いっぱいを使うので横に並びます
  const tags = el('div', { class: 'chips', style: 'margin:11px 0 13px' },
    cow.breed ? el('span', { class: 'badge b1' }, cow.breed) : null,
    cow.neck_no ? el('span', { class: 'badge' }, 'ネック ' + cow.neck_no) : null,
    a.stage ? el('span', { class: 'badge b2' }, a.stage.label) : null,
    cow.status ? el('span', { class: 'badge' }, cow.status) : null);
  if (tags.childNodes.length) c.appendChild(tags);

  // ここには「いちばん先に見たい3つ」だけを置く。

  const tiles = el('div', { class: 'tiles' });

                                  : '胸囲から推定 ' + fmtDate(a.latest.date)) : '未測定'));
  if (a.fulfillment != null)
    tiles.appendChild(cowTile('充足率', r1(a.fulfillment), '%',
      r0(a.latest.day) + '日齢の目標 ' + r0(a.target.low) + 'kg',
      a.fulfillment >= 100 ? 'good' : a.fulfillment < 90 ? 'bad' : ''));
  c.appendChild(tiles);
  return c;
}

function cowNumbersCard(cow, a){

  c.appendChild(el('h2', {}, 'この牛の数字'));

  tiles.appendChild(cowTile('増体 (DG)', dg == null ? '—' : r2(dg), 'kg/日',

      : (weanedNow ? '育成期目標 ' : '哺乳期目標 ') + r2(dgTarget) +
        (dg >= dgTarget ? ' 達成' : ' に届かず'),
    dg == null ? '' : (dg >= dgTarget ? 'good' : 'bad')));

  tiles.appendChild(cowTile('累計乾物量', a.cumDM ? r1(a.cumDM) : '—', 'kg',
    a.cumDM ? '乳 ' + r1(a.cumMilkDM) + ' ＋ 固形 ' + r1(a.cumStarterDM) : '記録なし'));

  if (a.percentile)
    tiles.appendChild(cowTile('牧場内の位置', r0(a.percentile.pct), '%tile',
      '同日齢' + a.percentile.n + '頭と比較',
      a.percentile.pct >= 50 ? 'good' : a.percentile.pct < 25 ? 'bad' : ''));

  tiles.appendChild(cowTile('出生体重', a.birthWeight ? r1(a.birthWeight) : '—', 'kg',
    cow.birth_chest ? '胸囲 ' + r1(num(cow.birth_chest)) + 'cm' : null));

  c.appendChild(tiles);
  return c;
}

/* --------------------------- 概要 --------------------------- */
function tabOverview(v, cow, a){
  v.appendChild(cowNumbersCard(cow, a));

  /* 予測タイムライン */
  const f = a.forecast;
  const card = el('div', { class: 'card' });
  card.appendChild(el('h2', {}, '哺乳ステージの見通し',
    el('span', { class: 'note' },
      f.confidence >= .7 ? '根拠しっかり' : f.confidence >= .4 ? 'おおよそ' : '参考程度')));

  // どちらの群で運用しているか
  card.appendChild(el('div', { style: 'display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px' },
    el('span', { class: 'badge ' + (a.programKey === 'b' ? 'b2' : 'b1') }, a.programMeta.name),
    el('span', { style: 'font-size:calc(11.5px * var(--fs));color:var(--muted)' },
      !a.programAuto ? '手動で設定'
        : /和牛|黒毛/.test(cow.breed || '') ? '品種から自動で判定'
        : a.birthWeight != null ? '出生体重から自動で判定'
        : '出生体重が未登録のため既定の群',
      '　離乳 ' + r0(f.weanMin) + '〜' + r0(f.weanMax) + '日'),
    el('button', { class: 'btn sm ghost', style: 'margin-left:auto',
      onclick: () => openProgramPicker(cow, a) }, '群を変える')));

  const tl = el('div', { class: 'tl' });
  const day = a.ageDays ?? 0;
  const item = (label, d, dateStr, body) => {
    const st = d == null ? '' : (day > d ? 'done' : (Math.abs(day - d) <= 2 ? 'now' : ''));
    return el('div', { class: 'it ' + st },
      el('div', { class: 'h' }, label,
        el('span', { class: 'd' }, d == null ? '—' : d + '日齢' + (dateStr ? ' ／ ' + fmtDate(dateStr) : ''))),
      body ? el('div', { class: 'b' }, body) : null);
  };
  tl.appendChild(item('増乳開始', f.rampDay, f.rampDate, a.programMeta.name + 'のプログラム'));
  tl.appendChild(item('ピーク到達', f.peakStartDay, f.peakStartDate,
    'ピーク ' + r1(f.peakL) + ' L/回（1日 ' + r1(f.peakPerDay) + ' L・粉 ' +
    r0(f.peakL * Calc.powderConc()) + ' g/回）'));
  tl.appendChild(item('減乳開始', f.stepDownDay, f.stepDownDate,
    '離乳の' + r0(num(Calc.S()['wean.step_down_days'], 14)) + '日前から段階的に減らす'));
  tl.appendChild(item('離乳', f.weanDay, f.weanDate, f.basis));
  card.appendChild(tl);

  if (f.reasons.length){
    const det = el('details', { style: 'margin-top:12px' });
    det.appendChild(el('summary', { style: 'font-size:calc(12.5px * var(--fs));color:var(--s1);cursor:pointer;font-weight:600' },
      'この予測の根拠'));
    const ul = el('ul', { style: 'margin:8px 0 0;padding-left:18px;font-size:calc(12.5px * var(--fs));color:var(--ink-2);line-height:1.75' });
    f.reasons.forEach(r => ul.appendChild(el('li', {}, r)));
    det.appendChild(ul);
    if (f.dayByStarter != null || f.dayByWeight != null)
      det.appendChild(el('div', { class: 'note', style: 'margin-top:10px' },
        'スターターからの見込み: ' + (f.dayByStarter ?? '—') + '日齢 ／ ',
        '体重からの見込み: ' + (f.dayByWeight ?? '—') + '日齢 → ',
        el('b', {}, '遅い方を採用')));
    card.appendChild(det);
  }
  v.appendChild(card);

  /* 今日やること */
  const todo = el('div', { class: 'card' });
  todo.appendChild(el('h2', {}, '今日の目安',
    el('span', { class: 'note' }, day == null ? '' : day + '日齢')));
  const prog = Calc.programAt(a.programKey, day);
  const todayDaily = a.daily.find(d => d.day === day);
  const weaned = a.stage.key === 'weaned' || !prog || prog.perDay <= 0;
  if (weaned){
    todo.appendChild(el('div', { class: 'note' },
      el('b', {}, '離乳済みです。'),
      a.forecast.weanDay != null
        ? ' 離乳の目安は ' + a.forecast.weanDay + '日齢でした（現在 ' + day + '日齢）。'
        : '',
      el('div', { style: 'margin-top:6px' },
        '育成期の目標増体は ' + r2(num(Calc.S()['target.dg_growing'], .8)) + ' kg/日、',
        '種付け目標は ' + r0(num(Calc.S()['target.breeding_weight_kg'], 380)) + ' kg です。')));
  } else if (prog){
    todo.appendChild(el('div', { class: 'grid2' },
      el('div', { class: 'tile' },
        el('div', { class: 'k' }, '1回あたり'),
        el('div', { class: 'v' }, r1(prog.perFeed), el('small', {}, 'L')),
        el('div', { class: 'd' }, '粉 ' + r0(prog.powderPerFeed) + ' g　× ' + r0(prog.feeds) + '回')),
      el('div', { class: 'tile' },
        el('div', { class: 'k' }, '今日の実績'),
        el('div', { class: 'v' }, todayDaily ? r1(todayDaily.milkL) : '—', el('small', {}, 'L/日')),
        el('div', { class: 'd ' + (todayDaily && todayDaily.milkL >= prog.perDay - .3 ? 'good' : '') },
          todayDaily ? (todayDaily.milkL >= prog.perDay - .3 ? '予定どおり'
                        : '不足 ' + r1(prog.perDay - todayDaily.milkL) + 'L')
                     : '目安 ' + r1(prog.perDay) + ' L/日'))));
    const S2 = Calc.S();
    todo.appendChild(el('div', { class: 'hint', style: 'margin-top:8px' },
      '朝 ' + S2['routine.am_milk'] + ' 哺乳 → ' + S2['routine.am_solid'] + ' スターター・牧草　／　' +
      '夕 ' + S2['routine.pm_solid'] + ' スターター・牧草 → ' + S2['routine.pm_milk'] + ' 哺乳'));
  }
  const lastW = a.latest;
  const daysSinceW = lastW ? day - lastW.day : null;
  if (daysSinceW != null && daysSinceW > 14)
    todo.appendChild(el('div', { class: 'note warn', style: 'margin-top:10px' },
      el('b', {}, '体重測定から' + daysSinceW + '日'), ' — 胸囲を測るタイミングです。'));
  if (f.weanDay != null && day >= f.weanDay - 7 && a.stage.key !== 'weaned')
    todo.appendChild(el('div', { class: 'note warn', style: 'margin-top:10px' },
      el('b', {}, '離乳が近づいています'), '（予測 ' + f.weanDay + '日齢）。スターターの食い込みを確認してください。'));

  todo.appendChild(el('div', { class: 'btnrow', style: 'margin-top:12px' },
    weaned ? null : el('button', { class: 'btn primary sm', onclick: () => openMilkForm(cow) }, '哺乳を記録'),
    weaned ? null : el('button', { class: 'btn sm', onclick: () => openStarterForm(cow) }, 'スターター'),
    el('button', { class: 'btn ' + (weaned ? 'primary ' : '') + 'sm',
      onclick: () => openWeightForm(cow) }, '体重・胸囲'),
    weaned ? el('button', { class: 'btn sm', onclick: () => openReproForm(cow) }, '繁殖') : null));
  v.appendChild(todo);

  /* 血統 */
  const ped = el('div', { class: 'card' });
  ped.appendChild(el('h2', {}, '血統とゲノム'));
  const dam = findDam(cow);
  const dl = el('dl', { class: 'kv' });
  const kv = (k, ...vals) => { dl.appendChild(el('dt', {}, k)); dl.appendChild(el('dd', {}, ...vals)); };
  kv('母', cow.dam_mgmt_no || cow.dam_no
    ? el('span', {},
        dam ? el('a', { href: '#', style: 'color:var(--s1);text-decoration:none;font-weight:650',
          onclick: e => { e.preventDefault(); App.openCow(dam.cow_no); } }, dam.tag4)
            : (cow.dam_mgmt_no || String(cow.dam_no).slice(-4)),
        dam && dam.name ? ' ' + dam.name : '',
        !dam && cow.dam_mgmt_no
          ? el('span', { class: 'badge', style: 'margin-left:7px' }, '未登録')
          : null,
        dam && cowsBy4(cow.dam_mgmt_no).length > 1
          ? el('span', { class: 'badge warn', style: 'margin-left:7px' }, '同じ4桁が複数')
          : null)
    : '未登録');
  kv('父・精液', [cow.sire_code, cow.sire_name].filter(Boolean).join(' ') || '未登録');
  ped.appendChild(dl);

  /* ゲノムは行数が多く、読むのに時間がかかるので、
     ここだけ後から埋めます（この欄を待って画面全体が止まらないように）。 */
  const gslot = el('div', {}, el('div', { class: 'hint', style: 'margin-top:10px' },
    el('span', { class: 'spinner sm' }), ' ゲノムを読み込んでいます…'));
  ped.appendChild(gslot);
  v.appendChild(ped);

  Store.cow(cow.cow_no, { tables: ['genomics'] }).then(rec2 => {
    if (String(App.cowNo) !== String(cow.cow_no) || !gslot.isConnected) return;
    const g = rec2.genomics || [];
    a.rec.genomics = g;
    gslot.innerHTML = '';
    if (g.length){
      gslot.appendChild(el('hr', { class: 'sep' }));
      gslot.appendChild(genomeHighlight(g));
      gslot.appendChild(el('button', { class: 'btn ghost sm', style: 'margin-top:10px',
        onclick: () => { App.tab = 'genome'; App.render(); } }, 'ゲノムの全項目を見る →'));
    } else {
      gslot.appendChild(el('div', { class: 'hint', style: 'margin-top:10px' },
        'この牛のゲノム値は登録されていません。'));
    }
  }).catch(() => {
    if (!gslot.isConnected) return;
    gslot.innerHTML = '';
    gslot.appendChild(el('div', { class: 'hint', style: 'margin-top:10px' },
      'ゲノムを読み込めませんでした。'));
  });

  /* 繁殖のサマリー（初回分娩まで） */
  if (a.ageMonths != null && a.ageMonths >= 8) v.appendChild(reproSummaryCard(cow, a));
}

/* --------------------------- 哺乳 --------------------------- */
function tabMilk(v, cow, a){
  v.appendChild(colostrumCard(cow, a));

  if (!a.daily.length){
    v.appendChild(el('div', { class: 'card' },
      el('div', { class: 'empty' }, el('div', { class: 'big' }, '🍼'),
        '哺乳の記録がまだありません',
        el('div', { style: 'margin-top:14px' },
          el('button', { class: 'btn primary sm', onclick: () => openMilkForm(cow) }, '哺乳を記録')))));
    return;
  }

  const maxDay = Math.max(a.ageDays ?? 0, a.lastFeedDay ?? 0, 100);
  const prog = Calc.program(a.programKey).filter(p => p.day <= maxDay);
  const others = Calc.programKeys().filter(k => k !== a.programKey).map(k => ({
    key: k, name: Calc.programMeta(k).name,
    pts: Calc.program(k).filter(p => p.day <= maxDay)
  })).filter(o => o.pts.length);
  const f = a.forecast;

  /* 1) 日々の哺乳量とスターター */
  const c1 = el('div', { class: 'card' });
  c1.appendChild(el('h2', {}, '哺乳量とスターター摂取',
    el('span', { class: 'note' }, a.programMeta.name)));
  c1.appendChild(Chart.plot({
    height: 250,
    x: { domain: [0, maxDay], label: '日齢', fmt: v => r0(v) + '日', tip: v => r0(v) + '日齢' },
    y: { zero: true, fmt: v => r1(v) },
    bars: [{ name: '哺乳量', color: cssVar('--s1'), opacity: .85,
             points: a.daily.map(d => ({ x: d.day, y: d.milkL })), fmt: v => r1(v) + ' L' }],
    series: [
      { name: a.programMeta.name, color: cssVar('--ink-2'), dashed: true, width: 2, noEndLabel: true,
        points: prog.map(p => ({ x: p.day, y: p.l })), fmt: v => r1(v) + ' L/日' }
    ].concat(others.map(o => ({
      name: o.name + '（参考）', color: cssVar('--muted'), dashed: true, width: 1,
      opacity: .4, noEndLabel: true,
      points: o.pts.map(p => ({ x: p.day, y: p.l })), fmt: v => r1(v) + ' L/日'
    }))).concat([
      { name: 'スターター', color: cssVar('--s2'), dots: a.daily.length < 40,
        points: a.daily.map(d => ({ x: d.day, y: d.starter })), fmt: v => r2(v) + ' kg' }
    ]),
    markers: [
      ...a.daily.filter(d => d.feces && d.feces !== '正常')
        .map(d => ({ x: d.day, color: /水下痢/.test(d.feces) ? cssVar('--crit') : cssVar('--warn'),
                     label: '' })),
      f.stepDownDay != null && f.stepDownDay <= maxDay
        ? { x: f.stepDownDay, label: '減乳', color: cssVar('--s4') } : null,
      f.weanDay != null && f.weanDay <= maxDay
        ? { x: f.weanDay, label: '離乳予測', color: cssVar('--s2') } : null,
      a.ageDays != null ? { x: a.ageDays, label: '今日', color: cssVar('--line'), solid: true } : null
    ].filter(Boolean),
    caption: '棒＝1日の哺乳量（L）、破線＝プログラムの基準線、オレンジ＝スターター摂取（kg）。' +
      (a.daily.some(d => d.feces && d.feces !== '正常')
        ? ' 縦の赤い線は便に異常があった日です。' : '')
  }));
  v.appendChild(c1);

  /* 2) 累計乾物量 */
  const c2 = el('div', { class: 'card' });
  c2.appendChild(el('h2', {}, '累計乾物摂取量',
    el('span', { class: 'note' }, '今回から新しく取れる数字')));
  c2.appendChild(Chart.plot({
    height: 220,
    x: { domain: [0, maxDay], fmt: v => r0(v) + '日', tip: v => r0(v) + '日齢' },
    y: { zero: true, fmt: v => r0(v) },
    series: [
      { name: '合計', color: cssVar('--s1'), area: true, width: 2.5,
        points: a.daily.map(d => ({ x: d.day, y: d.cumDM })), fmt: v => r1(v) + ' kg' },
      { name: '乳から', color: cssVar('--s3'),
        points: a.daily.map(d => ({ x: d.day, y: d.cumMilkDM })), fmt: v => r1(v) + ' kg' },
      { name: '固形飼料から', color: cssVar('--s2'),
        points: a.daily.map(d => ({ x: d.day, y: d.cumStarterDM })), fmt: v => r1(v) + ' kg' }
    ],
    caption: '代用乳は「' + esc(Calc.S()['milk.replacer_name'] || '未設定') + '」乾物' +
      r1(num(Calc.S()['milk.replacer_dm_pct'], 96)) + '%、調乳' +
      r0(Calc.powderConc(today())) + 'g/L で計算。設定画面で変更できます。'
  }));

  const tiles = el('div', { class: 'tiles', style: 'margin-top:12px' });
  const put = (k, val, u, d) => tiles.appendChild(el('div', { class: 'tile' },
    el('div', { class: 'k' }, k), el('div', { class: 'v' }, val, u ? el('small', {}, u) : null),
    d ? el('div', { class: 'd' }, d) : null));
  put('累計乾物量', r1(a.cumDM), 'kg');
  put('うち乳', r1(a.cumMilkDM), 'kg',
      a.cumDM ? r0(a.cumMilkDM / a.cumDM * 100) + '%' : null);
  put('うち固形', r1(a.cumStarterDM), 'kg',
      a.cumDM ? r0(a.cumStarterDM / a.cumDM * 100) + '%' : null);
  const totalMilkL = a.daily.reduce((s, d) => s + d.milkL, 0);
  put('累計哺乳量', r0(totalMilkL), 'L');
  const gain = a.latest && a.birthWeight ? a.latest.kg - a.birthWeight : null;
  if (gain != null && a.cumDM > 0)
    put('乾物1kgあたり増体', r2(gain / a.cumDM), 'kg', '飼料効率の目安');
  c2.appendChild(tiles);
  v.appendChild(c2);

  /* 3) 記録一覧 */
  const c3 = el('div', { class: 'card' });
  c3.appendChild(el('h2', {}, '日別の記録',
    el('button', { class: 'btn sm', onclick: () => openMilkForm(cow) }, '＋ 記録')));
  const all = a.daily.slice().reverse();
  const mkTable = rows => el('div', { class: 'tblwrap' }, el('table', { class: 't' },
    el('thead', {}, el('tr', {},
      el('th', {}, '日齢'), el('th', {}, '日付'), el('th', {}, '乳 L'),
      el('th', {}, 'ｽﾀｰﾀｰ kg'), el('th', {}, '累計DM kg'), el('th', {}, '便・残'))),
    el('tbody', {}, rows.map(d => el('tr', {},
      el('td', {}, d.day + '日'),
      el('td', {}, fmtDate(addDays(cow.birth_date, d.day))),
      el('td', {}, d.milkL ? r1(d.milkL) : '—'),
      el('td', {}, d.starter ? r2(d.starter) : '—'),
      el('td', {}, r1(d.cumDM)),
      el('td', {},
        d.feces && d.feces !== '正常'
          ? el('span', { class: 'badge ' + (/水下痢/.test(d.feces) ? 'crit' : 'warn') }, d.feces)
          : (d.feces ? el('span', { style: 'color:var(--muted)' }, d.feces) : ''),
        d.refused ? el('span', { class: 'badge warn', style: 'margin-left:4px' }, '残') : null))))));
  c3.appendChild(mkTable(all.slice(0, 14)));
  if (all.length > 14){
    const det = el('details', { style: 'margin-top:10px' });
    det.appendChild(el('summary', { style: 'font-size:calc(12.5px * var(--fs));color:var(--s1);cursor:pointer;font-weight:600' },
      '残り ' + (all.length - 14) + '日分を見る'));
    det.appendChild(mkTable(all.slice(14)));
    c3.appendChild(det);
  }
  v.appendChild(c3);
}

/* --------------------------- 体重 --------------------------- */
function tabWeight(v, cow, a){
  const S = Calc.S();

  /* 1) 発育曲線 */
  const c1 = el('div', { class: 'card' });
  c1.appendChild(el('h2', {}, '発育の推移と牧場内の位置'));

  if (!a.weights.length){
    c1.appendChild(el('div', { class: 'empty' }, el('div', { class: 'big' }, '⚖️'),
      '体重・胸囲の記録がありません',
      el('div', { style: 'margin-top:14px' },
        el('button', { class: 'btn primary sm', onclick: () => openWeightForm(cow) }, '胸囲を測る'))));
  } else {
    const maxDay = Math.max(a.ageDays ?? 0, a.weights[a.weights.length-1].day) + 20;
    const bm = Store.benchmark?.weightByAge?.[cow.breed] || Store.benchmark?.weightByAge?.['未設定'];
    const bands = [], extra = [];
    if (bm && bm.length >= 3){
      const use = bm.filter(r => r.day <= maxDay && r.n >= 3);
      if (use.length >= 3){
        bands.push({ name: '牧場の25〜75%', color: cssVar('--band'),
          points: use.map(r => ({ x: r.day, lo: r.p25, hi: r.p75 })) });
        extra.push({ name: '牧場の中央値', color: cssVar('--s1'), opacity: .55,
          width: 1.5, dashed: true, noEndLabel: true,
          points: use.map(r => ({ x: r.day, y: r.p50 })), fmt: v => r0(v) + ' kg' });
      }
    }
    // 牧場の目標体重（「目標・DG」シートの値）を帯で描く
    const tgtPts = [];
    for (let d = 0; d <= maxDay; d += 5){
      const t = Calc.targetWeight(d);
      if (t) tgtPts.push({ x: d, lo: t.low, hi: t.high, y: t.low });
    }
    if (tgtPts.length >= 2){
      bands.push({ name: '牧場の目標', color: 'color-mix(in srgb, ' + cssVar('--s3') + ' 14%, transparent)',
        points: tgtPts });
      extra.push({ name: '目標（下限）', color: cssVar('--s3'), dashed: true, width: 1.5,
        noEndLabel: true, points: tgtPts.map(p => ({ x: p.x, y: p.lo })),
        fmt: v => r0(v) + ' kg' });
    }

    c1.appendChild(Chart.plot({
      height: 260,
      x: { domain: [0, maxDay], fmt: v => r0(v) + '日', tip: v => r0(v) + '日齢' },
      y: { zero: true, fmt: v => r0(v) },
      bands,
      series: extra.concat([{
        name: 'この牛', color: cssVar('--s2'), dots: true, width: 2.5,
        points: a.weights.map(p => ({ x: p.day, y: p.kg, hollow: !p.measured })),
        fmt: v => r1(v) + ' kg'
      }]),
      markers: a.ageDays != null ? [{ x: a.ageDays, label: '今日', color: cssVar('--line'), solid: true }] : [],
      caption: '塗りつぶしの点＝実測体重、白抜きの点＝胸囲からの推定。青い帯＝同じ品種の牧場内25〜75%、緑の帯＝牧場の目標体重（目標・DGシートの下限〜上限）。'
    }));

    if (a.fulfillment != null){
      const f2 = a.fulfillment;
      c1.appendChild(el('div', { class: 'tiles', style: 'margin-top:14px' },
        el('div', { class: 'tile' },
          el('div', { class: 'k' }, '充足率'),
          el('div', { class: 'v' }, r1(f2), el('small', {}, '%')),
          el('div', { class: 'd ' + (f2 >= 100 ? 'good' : f2 < 90 ? 'bad' : '') },

/** 母を探す。ゲノム表の「親」は4桁（個体識別番号の真ん中4桁）で書かれている */
function findDam(cow){
  if (cow.dam_no){
    const d = Store.cows.find(x => x.cow_no === String(cow.dam_no));
    if (d) return d;
  }
  if (cow.dam_mgmt_no){
    const list = cowsBy4(cow.dam_mgmt_no);
    if (list.length === 1) return list[0];
    if (list.length > 1){
      // 4桁が重複しているときは、子より前に生まれている個体を選ぶ
      const born = list.filter(x => x.birth_date && cow.birth_date &&
                                    x.birth_date < cow.birth_date);
      if (born.length === 1) return born[0];
      return born[0] || list[0];
    }
  }
  return null;
}

/** 牧場内でその形質が何パーセンタイルか */
function traitPct(trait, value){
  const st = Store.benchmark?.genomics?.[trait];
  const v = num(value);
  if (!st || v == null) return null;
  const marks = [[st.p10,10],[st.p25,25],[st.p50,50],[st.p75,75],[st.p90,90]]
    .filter(m => m[0] != null);
  if (marks.length < 2) return null;
  if (v <= marks[0][0]) return { pct: 10, st };
  if (v >= marks[marks.length-1][0]) return { pct: 90, st };
  for (let i = 0; i < marks.length - 1; i++){
    const [v0,p0] = marks[i], [v1,p1] = marks[i+1];
    if (v >= v0 && v <= v1)
      return { pct: v1 === v0 ? p0 : p0 + (p1-p0)*(v-v0)/(v1-v0), st };
  }
  return null;
}

/* 画面の上のほうに出す代表形質。SCS は低いほど良い */
const KEY_TRAITS = ['TPI','NM$','乳量','蛋白量','脂肪量','PL','SCS','DPR','体型','乳器'];
const LOWER_IS_BETTER = ['SCS','体細胞'];

function genomeHighlight(rows){
  const self = rows.filter(g => String(g.subject || '自身') === '自身');
  const byTrait = {};
  self.forEach(g => { if (!byTrait[g.trait] || String(g.tested_at) > String(byTrait[g.trait].tested_at))
    byTrait[g.trait] = g; });
  const show = KEY_TRAITS.filter(t => byTrait[t]).slice(0, 6);
  if (!show.length) return genomeTable(rows);

  const tiles = el('div', { class: 'tiles' });
  show.forEach(t => {
    const g = byTrait[t];
    const p = traitPct(t, g.value);
    const better = LOWER_IS_BETTER.includes(t) ? (p ? 100 - p.pct : null) : (p ? p.pct : null);
    tiles.appendChild(el('div', { class: 'tile' },
      el('div', { class: 'k' }, t),
      el('div', { class: 'v' }, String(g.value)),
      p ? el('div', { class: 'd ' + (better >= 60 ? 'good' : better < 30 ? 'bad' : '') },
        '牧場内 ' + r0(better) + '%tile') : null));
  });
  return tiles;
}

function genomeTable(rows, opts){
  opts = opts || {};
  const bySubject = {};
  rows.forEach(g => (bySubject[g.subject || '自身'] = bySubject[g.subject || '自身'] || []).push(g));
  const wrap = el('div');
  Object.keys(bySubject).forEach(sub => {
    wrap.appendChild(el('div', { style: 'font-size:calc(12px * var(--fs));color:var(--muted);margin:12px 0 4px;font-weight:650' }, sub));
    wrap.appendChild(el('div', { class: 'tblwrap' }, el('table', { class: 't' },
      el('thead', {}, el('tr', {}, el('th', {}, '形質'), el('th', {}, '値'),
        el('th', {}, '牧場中央'), el('th', {}, '位置'))),
      el('tbody', {}, bySubject[sub].map(g => {
        const p = sub === '自身' ? traitPct(g.trait, g.value) : null;
        const better = p ? (LOWER_IS_BETTER.includes(g.trait) ? 100 - p.pct : p.pct) : null;
        return el('tr', {},
          el('td', {}, g.trait || '—'),
          el('td', { style: 'font-weight:650' },
            g.value === '' || g.value == null ? '—' : String(g.value)),
          el('td', { style: 'color:var(--muted)' }, p ? r1(p.st.p50) : '—'),
          el('td', {}, better == null ? '—'
            : el('span', { class: 'badge ' + (better >= 60 ? 'good' : better < 30 ? 'crit' : '') },
                r0(better) + '%')));
      })))));
  });
  return wrap;
}

async function damGenomeInto(container, dam, childRows){
  const slot = el('div', {}, el('span', { class: 'spinner' }));
  container.appendChild(slot);
  let rec;
  try { rec = await Store.cow(dam.cow_no, { tables: ['genomics'] }); }
  catch (e){ slot.innerHTML = ''; slot.appendChild(el('div', { class: 'note crit' }, e.message)); return; }
  const dg = (rec.genomics || []).filter(x => String(x.subject || '自身') === '自身');
  slot.innerHTML = '';
  if (!dg.length){
    slot.appendChild(el('div', { class: 'note' },
      '母 ' + dam.tag4 + ' のゲノムは測定されていません。'));
    return;
  }
  const cm = {}; childRows.filter(x => String(x.subject||'自身')==='自身')
    .forEach(x => cm[x.trait] = x.value);
  const dm = {}; dg.forEach(x => dm[x.trait] = x.value);
  const traits = KEY_TRAITS.filter(t => dm[t] != null || cm[t] != null);
  slot.appendChild(el('div', { class: 'tblwrap' }, el('table', { class: 't' },
    el('thead', {}, el('tr', {}, el('th', {}, '形質'), el('th', {}, 'この牛'),
      el('th', {}, '母 ' + dam.tag4), el('th', {}, '差'))),
    el('tbody', {}, traits.map(t => {
      const cv = num(cm[t]), dv = num(dm[t]);
      const diff = (cv != null && dv != null) ? cv - dv : null;
      const good = diff == null ? null
        : (LOWER_IS_BETTER.includes(t) ? diff < 0 : diff > 0);
      return el('tr', {},
        el('td', {}, t),
        el('td', { style: 'font-weight:650' }, cv == null ? '—' : String(cm[t])),
        el('td', {}, dv == null ? '—' : String(dm[t])),
        el('td', { style: diff == null ? '' : ('color:' + (good ? 'var(--good-ink)' : 'var(--crit)')) },
          diff == null ? '—' : (diff > 0 ? '+' : '') + r1(diff)));
    })))));

    '母と比べて改良が進んでいるかが見えます（SCSは下がっていれば改良）。'));

/* --------------------------- 記録（全ログ） --------------------------- */
function tabLog(v, cow, a){
  const items = [];
  const push = (date, type, text, table, row) => items.push({ date, type, text, table, row });
  (a.rec.weights || []).forEach(w => push(w.date, '体重',
    (w.chest_cm ? '胸囲 ' + r1(num(w.chest_cm)) + 'cm' : '') +
    (w.weight_actual ? ' 実測 ' + r1(num(w.weight_actual)) + 'kg' : '') , 'weights', w));
  (a.rec.milk_feed || []).forEach(m => push(m.date, '哺乳',
    (m.milk_type || '代用乳') + ' ' + r1(num(m.volume_l)) + 'L' +
    (/^[0-9]+$/.test(String(m.feeding_no || '')) ? '（' + m.feeding_no + '回目）'
      : m.feeding_no ? '（' + m.feeding_no + '）' : ''), 'milk_feed', m));
  (a.rec.starter || []).forEach(s => push(s.date, 'スターター',
    r2(num(s.intake_kg) ?? (num(s.offered_kg,0) - num(s.refused_kg,0))) + 'kg', 'starter', s));
  (a.rec.repro || []).forEach(r => push(r.date, r.type || '繁殖',
    [r.sire_code, r.sire_name, r.result].filter(Boolean).join(' '), 'repro', r));
  (a.rec.events || []).forEach(e => push(e.date, e.type || 'イベント', e.detail || '', 'events', e));

  items.sort((x, y) => String(x.date) < String(y.date) ? 1 : -1);

  const c = el('div', { class: 'card' });
  c.appendChild(el('h2', {}, 'すべての記録',
    el('button', { class: 'btn sm', onclick: () => openEventForm(cow) }, '＋ イベント')));
  if (!items.length){ c.appendChild(el('div', { class: 'empty' }, '記録がありません')); }
  else {
    items.slice(0, 200).forEach(it => {
      c.appendChild(el('div', { class: 'row', onclick: () => openDeleteSheet(cow, it) },
        el('div', { style: 'min-width:52px;font-size:calc(12px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums' },
          fmtDate(it.date),
          el('div', { style: 'font-size:calc(10.5px * var(--fs))' },
            (daysBetween(cow.birth_date, it.date) ?? '—') + '日')),
        el('div', { class: 'mid' },
          el('div', { class: 'l1' }, el('span', { class: 'badge' }, it.type),
            ' ', it.text || ''),
          it.row && it.row.note ? el('div', { class: 'l2' }, it.row.note) : null)));
    });
  }
  v.appendChild(c);
}

/* ------------------------------------------------------------
   初乳のカード
   ------------------------------------------------------------
   分娩からの時間・量・Brix・移行判定を1か所にまとめています。
   初乳の失敗はあとから取り返せないので、記録が無いときは
   「まだ記録がありません」とはっきり出して、入力に誘導します。
   ------------------------------------------------------------ */
function colostrumCard(cow, a){
  const c = el('div', { class: 'card' });
  const s = Calc.colostrumSummary(cow, a.rec.colostrum || []);
  const age = a.ageDays;

  c.appendChild(el('h2', {}, '初乳',
    el('span', { class: 'note' },
      s.feeds.length ? s.feeds.length + '回・計 ' + r1(s.totalL) + ' L' : '記録なし')));

  if (!s.feeds.length){
    const young = age != null && age <= 30;
    c.appendChild(el('div', { class: young ? 'note crit' : 'note' },
      el('b', {}, '初乳の記録がありません。'),
      young
        ? ' 飲ませた時間・量・Brix を残しておくと、あとで下痢や肺炎が出たときに原因の切り分けができます。'
        : ' この子が生まれたときの記録は残っていません。今後の子から記録していきましょう。'));
    const tgt = Calc.colostrumTargetL(cow);
    if (tgt != null)
      c.appendChild(el('div', { class: 'hint', style: 'margin:-4px 0 12px' },
        'この子の目安は ' + r1(tgt) + ' L（出生体重の' +
        r0(num(Calc.S()['colostrum.volume_pct_bw'], 10)) + '%）でした。'));
    c.appendChild(el('button', { class: 'btn primary',
      onclick: () => openColostrumForm(cow) }, '初乳を記録する'));
    return c;
  }

  /* 判定を並べる */
  const tiles = el('div', { class: 'tiles' });
  const put = (k, g, extra) => {
    if (!g) return;
    tiles.appendChild(el('div', { class: 'tile' },
      el('div', { class: 'k' }, k),
      el('div', { class: 'v', style: 'font-size:var(--t5);color:var(' +
        (g.tone === 'good' ? '--good-ink' : g.tone === 'warn' ? '--warn' : '--crit') + ')' },
        g.label),
      el('div', { class: 'd' }, extra || g.hint)));
  };
  put('飲ませた時間', s.timing);
  put('初乳の質', s.brix);
  if (s.targetL != null)
    tiles.appendChild(el('div', { class: 'tile' },
      el('div', { class: 'k' }, '飲んだ量'),
      el('div', { class: 'v' }, r1(s.totalL), el('small', {}, 'L')),
      el('div', { class: 'd ' + (s.enough ? 'good' : 'bad') },
        '目安 ' + r1(s.targetL) + ' L' + (s.enough ? '（達成）' : '（不足）'))));
  put('移行判定', s.transfer);
  if (tiles.childNodes.length) c.appendChild(tiles);

  if (s.transfer && (s.transfer.key === 'poor' || s.transfer.key === 'fair'))
    c.appendChild(el('div', { class: 'note crit', style: 'margin-top:12px' },
      el('b', {}, '初乳の移行が十分ではありません。'),
      ' 下痢・肺炎が出やすい個体として、しばらく重点的に見てください。'));

  /* 明細 */
  const tbl = el('table', { class: 't' },
    el('thead', {}, el('tr', {},
      el('th', {}, '日付'), el('th', {}, '回'), el('th', {}, '分娩から'),
      el('th', {}, '量'), el('th', {}, 'Brix'), el('th', {}, '種類'))),
    el('tbody', {}, s.feeds.map(f => el('tr', {
      style: 'cursor:pointer', onclick: () => openColostrumForm(cow, f) },
      el('td', {}, fmtDateFull(f.date).replace('年','/').replace('月','/').replace('日','')),
      el('td', {}, String(f.feeding_no || '')),
      el('td', {}, num(f.hours_after_birth) != null ? r1(f.hours_after_birth) + 'h' : '—'),
      el('td', {}, num(f.volume_l) != null ? r1(f.volume_l) + 'L' : '—'),
      el('td', {}, num(f.brix_pct) != null ? r1(f.brix_pct) + '%' : '—'),
      el('td', {}, f.source || '—')))));
  c.appendChild(el('div', { class: 'tblwrap', style: 'margin-top:12px' }, tbl));

  c.appendChild(el('div', { class: 'btnrow', style: 'margin-top:12px' },
    el('button', { class: 'btn sm', onclick: () => openColostrumForm(cow) }, '＋ 給与を追加'),
    el('button', { class: 'btn sm ghost',
      onclick: () => openTransferForm(cow, s.lastCheck || undefined) },
      s.lastCheck ? '移行判定を直す' : '＋ 移行判定（採血）')));
  return c;
}

/* ------------------------------------------------------------
   9. 入力フォーム（下から出るシート）
   ------------------------------------------------------------ */
function sheet(title, buildBody, opts){
  opts = opts || {};
  const overlay = el('div', { class: 'sheet' });
  const panel = el('div', { class: 'panel', onclick: e => e.stopPropagation() });
  const close = () => overlay.remove();
  overlay.addEventListener('click', close);
  panel.appendChild(el('div', { class: 'drag' }));
  panel.appendChild(el('h2', {}, title,
    el('button', { class: 'iconbtn', onclick: close, title: '閉じる' }, '✕')));
  const body = el('div');
  panel.appendChild(body);
  // 先に画面へ入れてから中身を組み立てる。
  // こうしないと、組み立ての途中で $('#…') が見つからず落ちます。
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  try {
    buildBody(body, close, panel);
  } catch (e) {
    body.appendChild(el('div', { class: 'note crit' },
      el('b', {}, '画面を開けませんでした。'), ' ', String(e && e.message || e)));
    throw e;
  }
  setTimeout(() => { const f = panel.querySelector('input:not([type=hidden]),select,textarea'); if (f && opts.focus !== false) f.focus(); }, 60);
  return { close, panel, body };
}

/** 「本当にやりますか」を1つだけ聞く小さなシート */
function confirmSheet(title, body, okLabel, onOk, opts){
  opts = opts || {};
  sheet(title, (b, close) => {
    b.appendChild(el('div', { class: 'note' + (opts.danger === false ? '' : ' warn') }, body));
    const ok = el('button', { class: 'btn ' + (opts.danger === false ? 'primary' : 'danger'),
                              style: 'width:100%;margin-top:12px' }, okLabel || 'すすめる');
    ok.onclick = () => submitting(ok, async () => { await onOk(); close(); });
    b.appendChild(ok);
    b.appendChild(el('button', { class: 'btn ghost', style: 'width:100%;margin-top:8px',
      onclick: close }, 'やめる'));
  }, { focus: false });
}

function field(label, input, hint){
  return el('label', { class: 'f' },
    el('span', { html: label }), input,
    hint ? el('div', { class: 'hint' }, hint) : null);
}
function inp(attrs){ return el('input', Object.assign({ class: 'inp' }, attrs)); }
function sel(attrs, options, value){
  const s = el('select', Object.assign({ class: 'inp' }, attrs));
  options.forEach(o => {
    const [v, t] = Array.isArray(o) ? o : [o, o];
    const op = el('option', { value: v }, t);
    if (String(v) === String(value ?? '')) op.selected = true;
    s.appendChild(op);
  });
  return s;
}

async function submitting(btn, fn){
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '';
  btn.appendChild(el('span', { class: 'spinner' }));
  try { await fn(); }
  catch (e){ toast(e.message || String(e), true); btn.disabled = false; btn.innerHTML = old; return false; }
  return true;
}

    const fNo   = inp({ type: 'text', inputmode: 'numeric', value: cow.cow_no || '',
                        placeholder: '10桁（分かれば）' });
    const fNeck = inp({ type: 'text', inputmode: 'numeric', value: cow.neck_no || '' });

                        placeholder: '母の管理番号' });

    const fBirth= inp({ type: 'date', value: cow.birth_date || today() });
