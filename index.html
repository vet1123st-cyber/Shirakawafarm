<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7">
<!-- 次に index.html を差し替えたとき、古いものが残りにくいようにする。
     （スマホのブラウザは、いちど読んだファイルをしばらく持ち続けるため） -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>白川牧場 個体データ</title>
<style>
/* ============================================================
   トークン
   ・--fs は文字サイズの倍率。1 / 1.14 / 1.3 を「表示」から選べる。
     画面じゅうの文字が calc(px * var(--fs)) なので一斉に大きくなる。
   ・--tap は指で押す最小の高さ。手袋でも押せるよう 56px を基準にした。
   ============================================================ */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ea; --surface-3:#e7e6de;
  --ink:#0b0b0b; --ink-2:#4a4946; --muted:#7d7b75;
  --grid:#e1e0d9; --line:#bab9ad; --ring:rgba(11,11,11,.12);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300;
  --band:rgba(42,120,214,.10); --band-2:rgba(42,120,214,.18);
  --shadow:0 1px 2px rgba(11,11,11,.06), 0 4px 14px rgba(11,11,11,.05);
  --shadow-up:0 -10px 18px -12px rgba(11,11,11,.30);
  --r:15px; --r-sm:11px;

  /* 文字サイズ */
  --fs:1;
  --tmicro:calc(10.5px * var(--fs)); /* 補助のさらに補助（飲み残し・便など） */
  --t0:calc(11px   * var(--fs));   /* 補足・単位 */
  --t1:calc(12px   * var(--fs));   /* 小さい説明 */
  --t2:calc(13.5px * var(--fs));   /* 表・副見出し */
  --t3:calc(15px   * var(--fs));   /* 本文・ボタン */
  --t4:calc(17px   * var(--fs));   /* 強調 */
  --t5:calc(20px   * var(--fs));   /* 見出し・数値 */
  --t6:calc(25px   * var(--fs));   /* 大きい数値 */
  --tnum:calc(38px * var(--fs));   /* テンキー表示 */

  /* 指で押す大きさ。iPhone の目安は 44px なので、そこを下限にする */
  --tap:48px; --tap-sm:42px;
}
:root[data-fs="l"]{ --fs:1.14; --tap:54px; --tap-sm:46px }
:root[data-fs="xl"]{ --fs:1.30; --tap:58px; --tap-sm:50px }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#252523; --surface-3:#32322f;
    --ink:#fff; --ink-2:#cac9be; --muted:#95938c;
    --grid:#2c2c2a; --line:#45443f; --ring:rgba(255,255,255,.13);
    --s1:#4e93e8; --s2:#e2662f; --s3:#22b37f; --s4:#d99400;
    --s5:#d55181; --s6:#12a012; --s7:#9085e9; --s8:#e66767;
    --good-ink:#3fc23f; --crit:#ef6363; --serious:#f09262;
    --band:rgba(78,147,232,.14); --band-2:rgba(78,147,232,.26);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-up:0 -10px 18px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#252523; --surface-3:#32322f;
  --ink:#fff; --ink-2:#cac9be; --muted:#95938c;
  --grid:#2c2c2a; --line:#45443f; --ring:rgba(255,255,255,.13);
  --s1:#4e93e8; --s2:#e2662f; --s3:#22b37f; --s4:#d99400;
  --s5:#d55181; --s6:#12a012; --s7:#9085e9; --s8:#e66767;
  --good-ink:#3fc23f; --crit:#ef6363; --serious:#f09262;
  --band:rgba(78,147,232,.14); --band-2:rgba(78,147,232,.26);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-up:0 -10px 18px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font:var(--t3)/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
[hidden]{display:none !important}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}

/* ============================================================
   骨格
   ============================================================ */
.app{max-width:760px;margin:0 auto;padding:0 14px}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--page);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  border-bottom:1px solid var(--grid);
  display:flex;align-items:center;gap:8px;
}
.topbar .title{font-size:var(--t3);font-weight:700;flex:1;min-width:0;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:var(--t0);color:var(--muted);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:var(--tap-sm);height:var(--tap-sm);flex:none;display:grid;place-items:center;
  border:1px solid var(--ring);background:var(--surface);border-radius:13px;
  cursor:pointer;font-size:var(--t4)
}
.iconbtn:active{background:var(--surface-2);transform:translateY(1px)}

.view{padding:14px 0 22px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 94%, transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--grid);
  padding:5px 5px calc(5px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
}
.nav button{
  background:none;border:0;padding:6px 2px 5px;border-radius:12px;min-height:52px;
  display:grid;justify-items:center;align-content:center;gap:3px;
  font-size:var(--t0);color:var(--muted);font-weight:600;
  cursor:pointer;line-height:1.15
}
.nav button .ic{font-size:calc(19px * var(--fs));line-height:1}
.nav button[aria-current="page"]{color:var(--s1);background:var(--surface-2);font-weight:700}
.nav button:active{background:var(--surface-3)}

/* ============================================================
   部品
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
  padding:13px;margin-bottom:10px;box-shadow:var(--shadow)
}
.card.tight{padding:11px}
.card>h2{font-size:var(--t2);color:var(--ink);font-weight:700;margin-bottom:12px;
  display:flex;align-items:baseline;gap:8px;justify-content:space-between}
/* 見出しの右肩に出す小さな添え書き。ブロックの .note とは別物なので打ち消す */
.card>h2 .note{font-size:var(--t0);color:var(--muted);font-weight:500;letter-spacing:0;
  text-align:right;background:none;padding:0;margin:0;border-radius:0;line-height:1.4}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:9px 15px;border-radius:12px;border:1px solid var(--ring);
  background:var(--surface);cursor:pointer;font-weight:700;font-size:var(--t3);width:100%;
  line-height:1.3
}
.btn:active{transform:translateY(1px);background:var(--surface-2)}
.btn.primary{background:var(--s1);color:#fff;border-color:transparent;
  box-shadow:0 2px 0 color-mix(in srgb,var(--s1) 70%,#000)}
.btn.primary:active{box-shadow:0 1px 0 color-mix(in srgb,var(--s1) 70%,#000)}
.btn.big{min-height:56px;font-size:var(--t3);border-radius:14px}
.btn.ghost{background:transparent}
.btn.sm{min-height:var(--tap-sm);font-size:var(--t2);padding:8px 14px;width:auto}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .sub{display:block;font-size:var(--t0);font-weight:600;opacity:.85;margin-top:2px}
.btn .lbl{display:block;text-align:left}
/* アイコンを上に置く縦型のボタン（2つ並べるとき） */
.btn.stack{flex-direction:column;gap:4px;min-height:92px;padding:12px 8px;text-align:center}
.btn.stack .lbl{text-align:center;font-size:var(--t3)}
.btn.stack .ic{font-size:calc(26px * var(--fs));line-height:1}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btnrow>.btn{width:auto;flex:1;min-width:132px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:400px){.grid3{grid-template-columns:1fr 1fr}}

label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:var(--t1);color:var(--ink-2);margin-bottom:6px;
  font-weight:700}
label.f>span .opt{color:var(--muted);font-weight:500}
.inp{
  width:100%;min-height:var(--tap);padding:11px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:max(16px, var(--t3))
}
.inp:focus{outline:3px solid var(--s1);outline-offset:-1px;border-color:transparent}
textarea.inp{min-height:84px;resize:vertical;line-height:1.55}
.hint{font-size:var(--t1);color:var(--muted);margin-top:6px;line-height:1.6}

/* 数値ステッパー（哺乳の ± など） */
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{
  width:var(--tap);min-width:var(--tap);height:var(--tap);flex:none;
  border-radius:13px;border:1px solid var(--ring);background:var(--surface-2);
  font-size:var(--t5);font-weight:700;cursor:pointer;display:grid;place-items:center;
  line-height:1
}
.stepper button:active{background:var(--surface-3);transform:translateY(1px)}
.stepper .inp{text-align:center;font-size:var(--t5);font-weight:700;padding:6px;
  font-variant-numeric:tabular-nums}

/* 統計タイル */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.tile{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 13px}
.tile .k{font-size:var(--t0);color:var(--muted);margin-bottom:3px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:var(--t6);font-weight:700;line-height:1.15;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.tile .v small{font-size:var(--t1);font-weight:600;color:var(--ink-2);margin-left:3px}
.tile .d{font-size:var(--t0);color:var(--muted);margin-top:3px;line-height:1.4}
.tile .d.good{color:var(--good-ink)} .tile .d.bad{color:var(--crit)}

/* バッジ */
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:var(--t0);font-weight:700;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);
  white-space:nowrap;line-height:1.4
}
.badge.b1{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.badge.b2{background:color-mix(in srgb,var(--s2) 18%,transparent);
  color:color-mix(in srgb,var(--s2) 82%,var(--ink))}
.badge.good{background:color-mix(in srgb,var(--good) 17%,transparent);color:var(--good-ink)}
.badge.warn{background:color-mix(in srgb,var(--warn) 26%,transparent);
  color:color-mix(in srgb,var(--warn) 50%,var(--ink))}
.badge.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}

/* テーブル */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.t{border-collapse:collapse;width:100%;font-size:var(--t2);min-width:100%}
table.t th,table.t td{padding:10px 10px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--grid)}
table.t th{color:var(--muted);font-weight:700;font-size:var(--t0);text-align:right;
  position:sticky;top:0;background:var(--surface)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{font-variant-numeric:tabular-nums}
table.t tbody tr:active{background:var(--surface-2)}

/* リスト行 */
.row{
  display:flex;align-items:center;gap:12px;padding:13px 4px;min-height:var(--tap);
  border-bottom:1px solid var(--grid);cursor:pointer
}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row .no{font-size:var(--t5);font-weight:800;letter-spacing:-.01em;min-width:62px;
  font-variant-numeric:tabular-nums;line-height:1.2}
.row .mid{flex:1;min-width:0}
.row .mid .l1{font-size:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:600}
.row .mid .l2{font-size:var(--t0);color:var(--muted);margin-top:2px}
.row .rt{text-align:right;font-size:var(--t1);color:var(--ink-2);
  font-variant-numeric:tabular-nums;flex:none;line-height:1.35}

/* タブ */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 -14px 13px;padding:0 14px 3px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:none;background:var(--surface);border:1px solid var(--ring);
  min-height:var(--tap-sm);padding:8px 16px;border-radius:12px;
  font-size:var(--t2);color:var(--ink-2);cursor:pointer;font-weight:700;white-space:nowrap
}
.tabs button:active{background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--s1);color:#fff;border-color:transparent}

/* テンキー */
/* テンキーは、片手で親指が届く幅に収める。
   画面いっぱいに広げても押しやすくはならず、下の一覧が見えなくなるだけなので。 */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;
  max-width:296px;margin-left:auto;margin-right:auto}
.pad button{
  min-height:calc(44px * var(--fs));border-radius:11px;border:1px solid var(--ring);
  background:var(--surface);
  font-size:calc(19px * var(--fs));font-weight:700;cursor:pointer;box-shadow:var(--shadow)
}
.pad button:active{background:var(--surface-2);transform:translateY(1px)}
.pad button.act{background:var(--s1);color:#fff;border-color:transparent;font-size:var(--t3)}
.pad button.sec{background:var(--surface-2);font-size:var(--t4)}
.bignum{
  font-size:var(--tnum);font-weight:800;letter-spacing:.12em;text-align:center;
  font-variant-numeric:tabular-nums;min-height:calc(42px * var(--fs));line-height:1.2
}
.bignum .ph{color:var(--grid)}

/* 下に固定される保存バー */
.actionbar{
  position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;
  background:var(--page);padding:7px 0 8px;margin:0 -2px;
  border-top:1px solid var(--grid);box-shadow:var(--shadow-up)
}
.actionbar .meta{text-align:center;font-size:var(--t0);color:var(--muted);margin-top:4px}
/* 保存バーの中のボタンは、画面を食わないように控えめの高さにする */
.actionbar .btn{min-height:46px;font-size:var(--t3);padding:8px 16px;border-radius:11px}
.actionbar .btn.big{min-height:46px;font-size:var(--t3)}

/* 和牛。ホルスタインと哺乳量が違うので、一目で分かるようにする */
.badge.wagyu{background:color-mix(in srgb,var(--s2) 20%,transparent);
  color:color-mix(in srgb,var(--s2) 80%,var(--ink))}
.wagyu-mark{box-shadow:inset 3px 0 0 var(--s2)}
.t-micro{font-size:var(--tmicro)}
/* シートの中の小見出し */
.seph{font-size:var(--t1);font-weight:700;color:var(--muted);
  margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--grid)}

/* タイムライン */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;
  background:var(--grid);border-radius:2px}
.tl .it{position:relative;padding:0 0 16px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";position:absolute;left:-22px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line)
}
.tl .it.done::before{background:var(--s1);border-color:var(--s1)}
.tl .it.now::before{background:var(--s2);border-color:var(--s2);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--s2) 22%,transparent)}
.tl .it .h{font-size:var(--t3);font-weight:700;display:flex;gap:8px;align-items:baseline;
  flex-wrap:wrap}
.tl .it .h .d{font-size:var(--t1);color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums}
.tl .it .b{font-size:var(--t1);color:var(--ink-2);margin-top:3px;line-height:1.55}

/* グラフ */
figure.chart{margin:0}
figure.chart figcaption{font-size:var(--t1);color:var(--muted);margin-top:8px;line-height:1.55}
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 2px;font-size:var(--t1);
  color:var(--ink-2)}
.legend .li{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:13px;height:3px;border-radius:2px;flex:none}
.legend .sw.dot{width:10px;height:10px;border-radius:50%}
.legend .sw.band{width:12px;height:12px;border-radius:3px}
.tip{
  position:absolute;pointer-events:none;z-index:5;background:var(--surface);
  border:1px solid var(--ring);border-radius:10px;padding:8px 11px;font-size:var(--t1);
  box-shadow:var(--shadow);white-space:nowrap;line-height:1.6;
  transform:translate(-50%,-100%);opacity:0;transition:opacity .1s
}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* モーダル */
.sheet{
  position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(11,11,11,.45);
  animation:fade .15s ease
}
.sheet .panel{
  background:var(--surface);width:100%;max-width:760px;
  border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.3,1)
}
@keyframes up{from{transform:translateY(22px)}to{transform:none}}
.sheet .drag{width:42px;height:5px;background:var(--line);border-radius:3px;
  margin:6px auto 14px}
.sheet h2{font-size:var(--t4);margin-bottom:15px;display:flex;justify-content:space-between;
  align-items:center;gap:10px}

/* お知らせ */
.toast{
  position:fixed;left:50%;bottom:calc(102px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:200;
  background:var(--ink);color:var(--page);padding:13px 19px;border-radius:13px;
  font-size:var(--t2);font-weight:700;box-shadow:var(--shadow);max-width:90vw;
  animation:up .2s ease;text-align:center
}
.toast.err{background:var(--crit);color:#fff}

.note{
  border-radius:var(--r-sm);padding:13px 14px;font-size:var(--t1);line-height:1.65;
  background:var(--surface-2);color:var(--ink-2);margin-bottom:13px
}
.note.warn{background:color-mix(in srgb,var(--warn) 17%,transparent)}
.note.crit{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
.note b{color:var(--ink)}
.note.crit b{color:var(--crit)}

.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:var(--t2);
  line-height:1.7}
.empty .big{font-size:calc(38px * var(--fs));margin-bottom:8px;opacity:.5}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 15px;font-size:var(--t2)}
.kv dt{color:var(--muted);font-size:var(--t1)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{

const $  = (s, r) => (r || document).querySelector(s);

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    // aria-* は true/false の「文字列」に意味があるので、false でも必ず書く。
    // （aria-pressed="" だと CSS の [aria-pressed="true"] に当たらず、
    //   選んだチップやタブに色がつきませんでした）
    if (k.startsWith('aria-') && typeof v === 'boolean'){
      n.setAttribute(k, v ? 'true' : 'false');
      continue;
    }
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return n;
}

const DAY = 86400000;
function toDate(v){
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const m = String(v).trim().replace(/\//g,'-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d;
}
function ymd(d){
  const x = toDate(d) || (d instanceof Date ? d : null);
  if (!x) return '';
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
const today = () => ymd(new Date());
function addDays(v, n){ const d = toDate(v); return d ? ymd(new Date(d.getTime() + n*DAY)) : ''; }
function daysBetween(a, b){
  const da = toDate(a), db = toDate(b);
  return (da && db) ? Math.round((db - da) / DAY) : null;
}
const ageDays   = (birth, on) => daysBetween(birth, on || today());
const ageMonths = (birth, on) => { const d = ageDays(birth, on); return d == null ? null : d / 30.4375; };
function fmtDate(v){
  const d = toDate(v); if (!d) return '—';
  return (d.getMonth()+1) + '/' + d.getDate();
}
function fmtDateFull(v){
  const d = toDate(v); if (!d) return '—';
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';

/* 牛群の定義。order は画面に並べる順 */
/* ------------------------------------------------------------
   牛舎の配置（ハッチ・ペアハッチ・群房・パドック）
   ------------------------------------------------------------
   row / col が見取り図の位置で、そのまま「実際に歩く順番」になります。
   哺乳ボードをこの順に並べると、飛ばしと重複が構造的に減ります。
   ------------------------------------------------------------ */
const PEN_KINDS = {
  hutch:  { key: 'hutch',  label: 'ハッチ',     cap: 1, w: 3, h: 3, color: '--s3' },
  pair:   { key: 'pair',   label: 'ペアハッチ', cap: 2, w: 5, h: 3, color: '--s1' },
  room:   { key: 'room',   label: '群房',       cap: 4, w: 5, h: 4, color: '--s4' },
  paddock:{ key: 'paddock',label: 'パドック',   cap: 8, w: 7, h: 4, color: '--s7' },
  // 建物は牛を入れる場所ではなく、図の背景として描く枠です
  building:{ key: 'building', label: '建物',    cap: 0, w: 15, h: 20, color: '--s2' },
  other:  { key: 'other',  label: 'その他',     cap: 0, w: 4, h: 3, color: '--muted' }
};
const PEN_KIND_LIST = Object.keys(PEN_KINDS).map(k => PEN_KINDS[k]);

function penKind(kind){
  const k = String(kind || '').trim();
  if (PEN_KINDS[k]) return PEN_KINDS[k];
  // 日本語のラベルで入っていても拾えるようにする
  const hit = PEN_KIND_LIST.find(x => x.label === k);
  return hit || PEN_KINDS.other;
}

/**
 * 見取り図の上に並べ直す。
 * x/y が無い古いデータは、row/col から自動で置き場所を作ります。
 * 歩く順番は y（上の列から）→ x（左から右へ）で決まります。
 */
function normalizePens(rows){
  const out = (rows || []).map(p => {
    const k = penKind(p.kind);
    return {
      id: p.id || '',
      name: String(p.name || '').trim(),
      kind: k.key,
      capacity: num(p.capacity, null),
      row: num(p.row, 1) || 1,
      col: num(p.col, 1) || 1,
      x: num(p.x, null), y: num(p.y, null),
      w: num(p.w, null) || k.w,
      h: num(p.h, null) || k.h,
      group_hint: String(p.group_hint || '').trim(),
      note: String(p.note || '').trim()
    };
  }).filter(p => p.name);

  // 位置が無いものは、row/col の並びから詰めて置く
  const needPlace = out.filter(p => p.x == null || p.y == null);
  if (needPlace.length){
    const byRow = {};
    needPlace.forEach(p => (byRow[p.row] = byRow[p.row] || []).push(p));
    let cursorY = 0;
    Object.keys(byRow).map(Number).sort((a, b) => a - b).forEach(r => {
      const line = byRow[r].sort((a, b) => a.col - b.col);
      let cursorX = 0, tall = 0;
      line.forEach(p => {
        p.x = cursorX; p.y = cursorY;
        cursorX += p.w + 1;
        tall = Math.max(tall, p.h);
      });
      cursorY += tall + 1;
    });
  }

  // まず図の並び（上から、左から）で仮に並べる
  out.sort((a, b) => (a.y - b.y) || (a.x - b.x) || (a.name < b.name ? -1 : 1));

  // col に「歩く順」が入っていればそちらを優先する。
  // 図の上下左右だけでは、実際に歩く順番までは決められないためです
  // （外のハッチを先に回るのか、牛舎の中からなのかは牧場ごとに違う）。
  // 建物の枠は歩く順に関係しないので、判定からも並べ替えからも外します。
  const rooms = out.filter(p => p.kind !== 'building');
  const seqs = rooms.map(p => p.col);
  const hasRoute = rooms.length > 1 &&
    seqs.every(v => v > 0) && new Set(seqs).size === rooms.length;
  if (hasRoute) rooms.sort((a, b) => a.col - b.col);

  rooms.forEach((p, i) => { p.order = i; p.seq = hasRoute ? p.col : i + 1; });
  out.forEach(p => {
    if (p.capacity == null) p.capacity = penKind(p.kind).cap || null;
  });
  // 建物を先頭に、そのあとを歩く順で返す（描くときは建物が背面）
  return out.filter(p => p.kind === 'building').concat(rooms);
}

const Pens = {
  /** 牛を入れられる部屋だけ（建物の枠は含めない） */
  all(){ return (Store.pens || []).filter(p => p.kind !== 'building'); },
  /** 図の背景に描く建物の枠 */
  buildings(){ return (Store.pens || []).filter(p => p.kind === 'building'); },
  every(){ return Store.pens || []; },
  byName(name){
    const s = String(name || '').trim();
    if (!s) return null;
    return this.all().find(p => p.name === s) || null;
  },
  /** 見取り図の広さ（マス目） */
  extent(){
    const list = this.all();
    if (!list.length) return { w: 12, h: 8 };
    return {
      w: Math.max(...list.map(p => p.x + p.w)) + 1,
      h: Math.max(...list.map(p => p.y + p.h)) + 1
    };
  },
  /** 同じ高さに並んでいる部屋を「1列目・2列目」としてまとめる */
  bands(){
    const ys = Array.from(new Set(this.all().map(p => p.y))).sort((a, b) => a - b);
    return ys.map((y, i) => ({ y, index: i + 1,
                               pens: this.all().filter(p => p.y === y) }));
  },
  bandOf(pen){
    const b = this.bands().find(x => x.y === pen.y);
    return b ? b.index : 1;
  },
  /** その部屋にいる牛（売却・廃用を除く） */
  cowsIn(name){
    const s = String(name || '').trim();
    return Store.cows.filter(c =>
      String(c.pen || '').trim() === s &&
      !/売却|廃用|死亡|出荷/.test(String(c.status || '')));
  },
  /** どこにも入っていない牛 */
  unassigned(){
    const names = new Set(this.all().map(p => p.name));
    return Store.cows.filter(c =>
      !/売却|廃用|死亡|出荷/.test(String(c.status || '')) &&
      !names.has(String(c.pen || '').trim()));
  },
  /** その牛の1つ前／1つ後ろの部屋 */
  neighbor(name, dir){
    const list = this.all();
    if (!list.length) return null;
    const i = list.findIndex(p => p.name === String(name || '').trim());
    if (i < 0) return dir > 0 ? list[0] : list[list.length - 1];
    const j = i + dir;
    return j >= 0 && j < list.length ? list[j] : null;
  },
  /** 定員に対する詰まり具合 */
  load(pen){
    const n = this.cowsIn(pen.name).length;
    const cap = num(pen.capacity, null);
    return { n, cap, over: cap != null && cap > 0 && n > cap,
             pct: cap ? Math.min(n / cap * 100, 100) : 0 };
  },
  /** マス目が空いているか（部屋を置くとき用） */
  freeAt(x, y, w, h, ignoreId){
    return !this.all().some(p =>
      p.id !== ignoreId &&
      x < p.x + p.w && p.x < x + w && y < p.y + p.h && p.y < y + h);
  }
};

/* ------------------------------------------------------------
   3. データ層 — 共有モード（GAS）と お試しモード（端末内）
   ------------------------------------------------------------ */
/**
 * 画面がバックエンド（Apps Script）に求める表の一覧。
 * ここに無い表を使おうとすると「不明な表です」という分かりにくい
 * エラーになるので、起動時に突き合わせて、はっきり伝えます。
 */
/**
 * APP_VERSION … スプレッドシート側（Code.gs）と揃っている必要がある版。
 *               表や列が増えたときだけ上げる。上げたら Code.gs のデプロイも必要。
 * BUILD_ID     … この index.html を作った日時。作るたびに毎回変わる。
 *               「新しい画面が出ていないか」を見るためだけに使う。
 *               build.sh が 2026-09-02-0335 を実際の日時に置き換えます。
 */
/* カルテを開いた瞬間に要る表と、タブを開いたときでいい表 */
const COW_CORE_TABLES = ['weights', 'milk_feed', 'starter', 'repro', 'events', 'colostrum'];
const COW_LAZY_TABLES = ['genomics', 'milk_test'];

const APP_VERSION = '2026-09-02a';
const BUILD_ID = '2026-09-02-0335';
const REQUIRED_TABLES = ['cows', 'weights', 'milk_feed', 'starter', 'repro', 'events',
                         'genomics', 'milk_test', 'colostrum', 'pens', 'daily_check',
                         'settings'];
/** あとから増えた表。古いバックエンドは「どの表があるか」を答えられないので、
    そのときはこの並びだけを「足りないもの」として案内します。 */
const NEW_TABLES = ['colostrum', 'pens', 'daily_check'];

const Store = {
  cfg: LS.get('sw.cfg', { url: '', token: '', user: '' }),
  settings: {},
  cows: [],
  benchmark: null,
  counts: {},
  recentEvents: {},   // cow_no -> 直近21日のイベント
  todayMilk: new Set(),      // 今日すでに哺乳を入力した牛
  colostrumDone: new Set(),  // 初乳を飲ませた記録がある牛
  latestWeight: {},          // cow_no -> 直近の体重 { date, kg, measured }
  handover: [],              // 直近7日の申し送り
  todayChecks: [],           // 今日の作業チェック
  pens: [],                  // 牛舎の配置（見取り図の順に並べたもの）
  serverVersion: null,       // バックエンド側の版
  missingTables: [],         // バックエンドに無い表（＝コードが古い）
  cache: {},          // cow_no -> 記録一式
  online: false,
  loading: false,

  get isRemote(){ return !!(this.cfg.url && /^https:\/\//.test(this.cfg.url)); },

  saveCfg(c){ this.cfg = Object.assign({}, this.cfg, c); LS.set('sw.cfg', this.cfg); },

  /* --- 通信 --- */
  async call(payload){
    if (!this.isRemote) return this.local(payload);
    const url = this.cfg.url;
    const body = Object.assign({ token: this.cfg.token, user: this.cfg.user }, payload);
    let res, txt;
    try {
      res = await fetch(url, {
        method: 'POST',
        // text/plain にすることで CORS の事前確認を回避します（GAS の制約対応）
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        redirect: 'follow'
      });
      txt = await res.text();
    } catch (e) {
      this.online = false;
      throw new Error('スプレッドシートに接続できませんでした。電波と、設定のURLを確認してください。');
    }
    let j;
    try { j = JSON.parse(txt); }
    catch (e) {
      this.online = false;
      throw new Error('スプレッドシートからの応答が読めませんでした。ウェブアプリの公開設定（アクセスできるユーザー＝全員）を確認してください。');
    }
    if (!j.ok){
      this.online = true;
      const msg = String(j.error || '不明なエラー');
      // 古い Code.gs は「不明な表です: pens」としか返してくれないので、
      // ここで、何をすればよいかが分かる言葉に置き換えます。
      if (/不明な表です|の表がありません/.test(msg)){
        const t = (msg.match(/[:：]\s*([a-z_]+)/) || [])[1] ||
                  (msg.match(/「([a-z_]+)」/) || [])[1] || '';
        throw new Error('スプレッドシート側のコードが古いままです' +
          (t ? '（' + t + ' の表がありません）' : '') + '。' +
          'Apps Script に新しい Code.gs を貼り替えて、' +
          '「デプロイ → デプロイを管理 → ✏️ → 新バージョン → デプロイ」をしてください。');
      }
      throw new Error(msg);
    }
    this.online = true;
    return j.data;
  },

  /* --- お試しモード（端末内） --- */
  localDB(){
    if (!this._db) this._db = LS.get('sw.db', {
      cows: [], weights: [], milk_feed: [], starter: [], repro: [], events: [],
      genomics: [], milk_test: [], colostrum: [], daily_check: [], pens: [], settings: {}
    });
    // あとから増えた表は、古い端末の保存分にも足しておく
    ['colostrum', 'daily_check', 'pens'].forEach(t => { if (!this._db[t]) this._db[t] = []; });
    return this._db;
  },
  saveLocal(){ LS.set('sw.db', this._db); },

  local(p){
    const db = this.localDB();
    const stamp = r => Object.assign({ id: r.id || uid(), updated_at: new Date().toISOString(),
                                       updated_by: this.cfg.user || '' }, r);
    switch (p.action){
      case 'init':
        const since = addDays(today(), -21);
        return { cows: db.cows, settings: Object.assign({}, DEFAULTS, db.settings),
                 benchmark: buildBenchmarkLocal(db, Object.assign({}, DEFAULTS, db.settings)),
                 recentEvents: db.events.filter(e => String(e.date) >= since)
                   .map(e => ({ cow_no: e.cow_no, date: e.date, type: e.type, detail: e.detail })),
                 todayMilk: Array.from(new Set(db.milk_feed
                   .filter(m => String(m.date || '').slice(0, 10) === today())
                   .map(m => String(m.cow_no)))),
                 latestWeight: latestWeightsLocal(db, Object.assign({}, DEFAULTS, db.settings)),
                 pens: (db.pens || []).filter(p =>
                   String(p.active) !== '0' && String(p.active) !== 'false'),
                 colostrumDone: Array.from(new Set((db.colostrum || [])
                   .filter(r => String(r.kind || '給与') === '給与')
                   .map(r => String(r.cow_no)))),
                 handover: (db.events || [])
                   .filter(e => e.type === '申し送り' && String(e.date) >= addDays(today(), -7))
                   .map(e => ({ cow_no: e.cow_no, date: e.date, detail: e.detail,
                                note: e.note, updated_by: e.updated_by })),
                 todayChecks: (db.daily_check || [])
                   .filter(r => String(r.date || '').slice(0, 10) === today())
                   .map(r => ({ date: r.date, slot: r.slot, item: r.item, done: r.done,
                                operator: r.operator, note: r.note })),
                 counts: { cows: db.cows.length, weights: db.weights.length,
                           milk_feed: db.milk_feed.length, starter: db.starter.length,
                           repro: db.repro.length, milk_test: db.milk_test.length,
                           genomics: db.genomics.length,
                           colostrum: (db.colostrum || []).length } };
      case 'cow': {
        const no = String(p.cow_no);
        const f = t => (db[t] || []).filter(r => String(r.cow_no) === no);
        const want = (p.tables && p.tables.length)
          ? p.tables
          : COW_CORE_TABLES.concat(COW_LAZY_TABLES);
        const out = {};
        want.forEach(t => { out[t] = f(t); });
        return out;
      }
      case 'saveCow': {
        const row = stamp(p.row);
        const i = db.cows.findIndex(c => String(c.cow_no) === String(row.cow_no));
        if (i >= 0){
          // 個体の編集画面からは「消したい」ことがあるので、渡された項目はそのまま反映する
          const merged = Object.assign({}, db.cows[i], row);
          merged.id = db.cows[i].id || row.id;
          db.cows[i] = merged;
          this.saveLocal(); return merged;
        }
        db.cows.push(row); this.saveLocal(); return row;
      }
      case 'append': { const row = stamp(p.row); db[p.table].push(row); this.saveLocal(); return row; }
      case 'update': {
        const i = db[p.table].findIndex(r => r.id === p.id);
        if (i < 0) throw new Error('対象の記録が見つかりません');
        db[p.table][i] = Object.assign({}, db[p.table][i], p.row,
          { updated_at: new Date().toISOString() });
        this.saveLocal(); return db[p.table][i];
      }
      case 'updateMany': {
        let n = 0;
        (p.rows || []).forEach(row => {
          const i = db[p.table].findIndex(r => String(r.id) === String(row.id));
          if (i < 0) return;
          db[p.table][i] = Object.assign({}, db[p.table][i], row,
            { updated_at: new Date().toISOString() });
          n++;
        });
        this.saveLocal(); return { updated: n };
      }
      case 'remove': {
        const i = db[p.table].findIndex(r => r.id === p.id);
        if (i >= 0) db[p.table].splice(i, 1);
        this.saveLocal(); return { deleted: true };
      }
      case 'replace': {
        // 指定した条件に合う既存行を消してから入れ直す（訂正のため）
        const m = p.match || {};
        const keys = Object.keys(m);
        db[p.table] = db[p.table].filter(x =>
          !keys.every(k => String(x[k] ?? '') === String(m[k] ?? '')));
        let n = 0;
        (p.rows || []).forEach(r => { db[p.table].push(stamp(r)); n++; });
        this.saveLocal(); return { replaced: n };
      }
      case 'bulk': {
        const dd = p.dedupe || null;
        const seen = {};
        if (dd && dd.length) db[p.table].forEach(x =>
          seen[dd.map(c => String(x[c] ?? '')).join('\u0001')] = true);
        let ins = 0, skip = 0;
        (p.rows || []).forEach(r => {
          if (dd && dd.length){
            const k = dd.map(c => String(r[c] ?? '')).join('\u0001');
            if (seen[k]){ skip++; return; }
            seen[k] = true;
          }
          const row = stamp(r);
          if (p.table === 'cows'){
            const i = db.cows.findIndex(c => String(c.cow_no) === String(row.cow_no));
            if (i >= 0){
              // 空の値では既存を上書きしない（GAS側の upsertCows_ と同じ動き）
              const merged = Object.assign({}, db.cows[i]);
              for (const k in row){
                const v = row[k];
                if (k === 'id' || k === 'created_at') continue;
                if (v !== undefined && v !== null && String(v) !== '') merged[k] = v;
              }
              merged.updated_at = new Date().toISOString();
              db.cows[i] = merged; ins++; return;
            }
          }
          db[p.table].push(row); ins++;
        });
        this.saveLocal(); return { inserted: ins, skipped: skip };
      }
      case 'saveSettings':
        db.settings = Object.assign({}, db.settings, p.settings);
        this.saveLocal(); return Object.assign({}, DEFAULTS, db.settings);
      case 'export': {
        let rows = db[p.table] || [];
        if (p.date){
          const d = String(p.date).slice(0, 10);
          rows = rows.filter(r => String(r.date || '').slice(0, 10) === d);
        }
        return { table: p.table, rows };
      }
      default: throw new Error('不明な操作: ' + p.action);
    }
  },

  /* --- 起動 --- */
  async init(){
    this.loading = true;
    const d = await this.call({ action: 'init' });
    this.cows = (d.cows || []).map(normalizeCow);
    this.settings = Object.assign({}, DEFAULTS, d.settings || {});
    this.benchmark = d.benchmark || null;
    this.counts = d.counts || {};
    // 直近のイベントを牛ごとに引けるようにしておく
    this.recentEvents = {};
    (d.recentEvents || []).forEach(e => {
      (this.recentEvents[String(e.cow_no)] = this.recentEvents[String(e.cow_no)] || []).push(e);
    });
    this.todayMilk = new Set((d.todayMilk || []).map(String));
  this.colostrumDone = new Set((d.colostrumDone || []).map(String));
    this.latestWeight = {};
    (d.latestWeight || []).forEach(w => { this.latestWeight[String(w.cow_no)] = w; });
    this.handover = (d.handover || []).slice()
      .sort((a, b) => String(a.date) < String(b.date) ? 1 : -1);
    this.todayChecks = d.todayChecks || [];
    this.penRows = d.pens || [];          // 生のまま（部屋を足し引きするときに使う）
    this.pens = normalizePens(this.penRows);

    // バックエンドが古いままでないかを確かめる。
    // 古い Code.gs は version も tables も返さないので、それ自体が目印になります。
    this.serverVersion = d.version || null;
    if (this.isRemote){
      const have = Array.isArray(d.tables) ? new Set(d.tables) : null;
      this.missingTables = have
        ? REQUIRED_TABLES.filter(t => !have.has(t))
        : NEW_TABLES.slice();      // 表の一覧を答えられない＝新しい表を知らない世代

      // 表はあっても「列」が古いことがある。
      // 古い Code.gs は pens の行に x（見取り図での位置）そのものを返さないので、
      // それを目印にする。ここを見落とすと、部屋を動かしても保存されない
      // ——という、いちばん気づきにくい壊れ方になります。
      const pens0 = (d.pens || [])[0];
      if (pens0 && !('x' in pens0) && this.missingTables.indexOf('pens') < 0)
        this.missingTables.push('pens');
    } else {
      this.missingTables = [];
    }

    this.cache = {};
    this.loading = false;
    return d;
  },

  /* ------------------------------------------------------------
     1頭ぶんのカルテを取りに行く
     ------------------------------------------------------------
     以前は8つの表をぜんぶ持ってきていました。そのうちゲノムは牧場全体で
     3,000行以上あり、これを読むのに一番時間がかかっていました。
     でも最初の画面に要るのは体重・哺乳・スターター・繁殖・記録・初乳だけです。
     ゲノムと乳検は、そのタブを開いたときに取りに行きます。
     ------------------------------------------------------------ */
  async cow(no, opts){
    opts = opts || {};
    const key = String(no);
    const want = opts.tables || COW_CORE_TABLES;
    const have = this.cache[key];
    const missing = want.filter(t => !have || !have[t]);
    if (!missing.length) return have;

    const d = await this.call({ action: 'cow', cow_no: key, tables: missing });
    const rec = have || {};
    // 返ってきたものは全部しまう（古いバックエンドは頼んでいない表も返してくる）
    Object.keys(d).forEach(t => {
      rec[t] = (d[t] || []).slice().sort((a,b) => String(a.date) < String(b.date) ? -1 : 1);
    });
    missing.forEach(t => { if (!rec[t]) rec[t] = []; });
    this.cache[key] = rec;
    return rec;
  },

  /** タップされる前に、そっと先に取りに行っておく（失敗しても何も言わない） */
  warm(no){
    const key = String(no);
    if (!key || this.cache[key] || this._warming === key) return;
    this._warming = key;
    this.cow(key).catch(() => {}).then(() => { if (this._warming === key) this._warming = null; });
  },

  invalidate(no){ if (no != null) delete this.cache[String(no)]; },

  /* ------------------------------------------------------------
     保存したあとの手当て
     ------------------------------------------------------------
     以前は1件保存するたびに Store.init() を呼び、牧場ぜんぶを読み直していました。
     スプレッドシートを何度も読むので、登録のたびに数秒待たされていました。
     いま書いた内容は手元で分かっているので、その分だけ手元の控えを直します。
     （牧場全体の集計は、次にアプリを開いたときに作り直されます）
     ------------------------------------------------------------ */
  noteWrite(table, row){
    if (!row) return;
    const no = String(row.cow_no || '');
    switch (table){
      case 'colostrum':
        if (no && String(row.kind || '給与') === '給与') this.colostrumDone.add(no);
        break;
      case 'milk_feed':
        if (no && ymd(row.date) === today()) this.todayMilk.add(no);
        break;
      case 'weights': {
        if (!no) return;
        const kg = num(row.weight_actual) ?? Calc.estWeight(row.chest_cm);
        const d = ymd(row.date);
        if (kg == null || !d) return;
        const cur = this.latestWeight[no];
        if (!cur || d >= cur.date)
          this.latestWeight[no] = { cow_no: no, date: d,
            kg: Math.round(kg * 10) / 10, measured: num(row.weight_actual) != null };
        break;
      }
      case 'events': {
        const e = { cow_no: row.cow_no, date: row.date, type: row.type,
                    detail: row.detail, note: row.note, updated_by: this.cfg.user || '' };
        if (no) (this.recentEvents[no] = this.recentEvents[no] || []).push(e);
        if (String(row.type) === '申し送り') this.handover = [e].concat(this.handover || []);
        break;
      }
      case 'daily_check': {
        const d = ymd(row.date);
        this.todayChecks = (this.todayChecks || [])
          .filter(x => !(x.date === d && x.slot === row.slot && x.item === row.item));
        this.todayChecks.push(row);
        break;
      }
      case 'cows': {
        // まとめて登録したとき用。空の値では上書きしない（GAS の upsertCows_ と同じ動き）
        if (!no) return;
        const i = this.cows.findIndex(c => String(c.cow_no) === no);
        if (i < 0){ this.cows.push(normalizeCow(row)); break; }
        const merged = Object.assign({}, this.cows[i]);
        for (const k in row){
          if (k === 'id' || k === 'created_at') continue;
          const v = row[k];
          if (v !== undefined && v !== null && String(v) !== '') merged[k] = v;
        }
        this.cows[i] = normalizeCow(merged);
        break;
      }
      case 'pens': {
        const i = (this.penRows || []).findIndex(p => String(p.id) === String(row.id));
        if (i >= 0) this.penRows[i] = Object.assign({}, this.penRows[i], row);
        else (this.penRows = this.penRows || []).push(row);
        this.pens = normalizePens(this.penRows);
        break;
      }
    }
  },

  /** 消したあとの手当て */
  noteDelete(table, id){
    if (table === 'pens'){
      this.penRows = (this.penRows || []).filter(p => String(p.id) !== String(id));
      this.pens = normalizePens(this.penRows);
    }
  },

  /** その日の作業チェックの控えから消す */
  noteCheckOff(date, slot, item){
    this.todayChecks = (this.todayChecks || [])
      .filter(x => !(x.date === date && x.slot === slot && x.item === item));
  },

  async add(table, row){
    const r = await this.call({ action: 'append', table, row });
    this.invalidate(row.cow_no);
    this.noteWrite(table, Object.assign({}, row, r || {}));
    return r;
  },
  async edit(table, id, row){
    const r = await this.call({ action: 'update', table, id, row });
    this.invalidate(row.cow_no);
    this.noteWrite(table, Object.assign({ id }, row));
    return r;
  },
  /**
   * 何行かをまとめて直す。
   * 牛舎の図を並べ直すときなど、1行ずつ送ると部屋の数だけ待たされるので、1回で送ります。
   * スプレッドシート側が古くてこの操作を知らないときは、これまで通り1行ずつ送ります。
   */
  async editMany(table, rows){
    const list = (rows || []).filter(r => r && r.id);
    if (!list.length) return { updated: 0 };
    try {
      const r = await this.call({ action: 'updateMany', table, rows: list });
      list.forEach(x => this.noteWrite(table, x));
      return r;
    } catch (e){
      if (!/不明な操作/.test(String(e && e.message))) throw e;
      for (const x of list){
        const { id, ...rest } = x;
        await this.edit(table, id, rest);
      }
      return { updated: list.length };
    }
  },
  async del(table, id, cow_no){
    const r = await this.call({ action: 'remove', table, id });
    this.invalidate(cow_no);
    this.noteDelete(table, id);
    return r;
  },
  async saveCow(row){
    const r = await this.call({ action: 'saveCow', row });
    const i = this.cows.findIndex(c => String(c.cow_no) === String(row.cow_no));
    const merged = normalizeCow(Object.assign({}, i >= 0 ? this.cows[i] : {}, r));
    if (i >= 0) this.cows[i] = merged; else this.cows.push(merged);
    this.invalidate(row.cow_no);
    return merged;
  },
  async saveSettings(obj){
    const s = await this.call({ action: 'saveSettings', settings: obj });
    this.settings = Object.assign({}, DEFAULTS, s);
    return this.settings;
  },
  /** 同じ条件の記録を入れ直す（訂正のときに使う） */
  async replace(table, match, rows){
    const r = await this.call({ action: 'replace', table, match, rows });
    this.cache = {};
    if (match && match.cow_no) this.invalidate(match.cow_no);
    (rows || []).forEach(x => this.noteWrite(table, x));
    return r;
  },

  async bulk(table, rows, dedupe){
    const r = await this.call({ action: 'bulk', table, rows, dedupe: dedupe || null });
    this.cache = {};
    (rows || []).forEach(x => this.noteWrite(table, x));
    return r;
  }
};

/**
 * 白川牧場の「4桁」は、個体識別番号10桁の 6〜9桁目（真ん中の4桁）です。
 *
 *   1504420660  →  15044 - 2066 - 0  →  4桁は 2066
 *
 * ゲノム表の「親」列もこの4桁で書かれています。
 * 提供された170頭で完全に一致することを確認済みです。
 * そのため4桁は個体識別番号から自動で求め、mgmt_no は
 * 「どうしても手で別の番号を付けたいとき」の上書き用としてだけ持ちます。
 */

/** 個体識別番号10桁 → 真ん中の4桁 */
function mid4(cowNo){
  const s = String(cowNo || '').replace(/[^0-9]/g, '');
  if (s.length === 10) return s.slice(5, 9);
  if (s.length > 4) return s.slice(-4);      // 桁数が違うときは下4桁で代用
  return s;
}

/** 個体識別番号を 12345-6789-0 の形に整える */
function fmtEarTag(cowNo){
  const s = String(cowNo || '').replace(/[^0-9]/g, '');
  if (s.length !== 10) return String(cowNo || '');
  return s.slice(0, 5) + '-' + s.slice(5, 9) + '-' + s.slice(9);
}
function normalizeCow(c){
  const o = Object.assign({}, c);
  o.cow_no = String(o.cow_no || '').trim();
  o.mgmt_no = String(o.mgmt_no || '').trim().replace(/[\s ]/g, '');
  o.neck_no = String(o.neck_no || '').trim();
  o.name = String(o.name || '').trim();
  o.birth_date = ymd(o.birth_date) || String(o.birth_date || '');
  o.breed = normBreed(o.breed);
  o.sex = normSex(o.sex);
  o.dam_mgmt_no = String(o.dam_mgmt_no || '').trim().replace(/[\s ]/g, '');
  o.dam_no = String(o.dam_no || '').trim();
  o.due_date = ymd(o.due_date) || String(o.due_date || '');
  // 画面に大きく出す4桁。原則は個体識別番号の真ん中4桁
  o.tag4 = mid4(o.cow_no) || o.mgmt_no;
  // 手で別番号を入れている場合はそちらを優先する
  if (o.mgmt_no && o.mgmt_no !== o.tag4) o.tag4 = o.mgmt_no;
  o.key4source = /^[0-9]{10}$/.test(o.cow_no) ? 'ear' : 'manual';
  return o;
}

/**
 * 和牛かどうか。
 * 哺乳の量がホルスタインとは違うので、現場で一目で分かるよう色を変えます。
 */
function isWagyu(cow){ return /和牛|黒毛/.test(String(cow && cow.breed || '')); }

function normBreed(v){
  const s = String(v || '').trim();
  if (!s) return '';
  if (/ホルス|Ｈ|ホルスタイン/.test(s)) return 'ホルスタイン';
  if (/黒毛|和牛|WAGYU/i.test(s)) return '和牛';
  if (/F1|交雑/.test(s)) return 'F1（交雑種）';
  if (/ジャージー|ジャ-ジ/.test(s)) return 'ジャージー';
  return s;
}
function normSex(v){
  const s = String(v || '').trim();
  if (/♀|雌|メス|F/i.test(s)) return '雌';
  if (/♂|雄|オス|M/i.test(s)) return '雄';
  return s;
}

/** 4桁 → 牛。同じ4桁の牛が複数いることがあるので、全部返す版も用意する */
function cowsBy4(no){
  const s = String(no || '').trim().replace(/[^0-9A-Za-z]/g, '');
  if (!s) return [];
  return Store.cows.filter(c => c.tag4 === s);
}
function cowByMgmt(no){
  const list = cowsBy4(no);
  return list.length ? list[0] : null;
}

/* お試しモードでのベンチマーク計算（GAS側と同じ考え方） */
function buildBenchmarkLocal(db, S){
  const a = num(S['weight.formula_a'], .0234), b = num(S['weight.formula_b'], -2.281),
        c0 = num(S['weight.formula_c'], 75.618);
  const byNo = {}; db.cows.forEach(c => byNo[String(c.cow_no)] = c);
  const buckets = {};
  db.weights.forEach(w => {
    const cow = byNo[String(w.cow_no)]; if (!cow || !cow.birth_date) return;
    const age = daysBetween(cow.birth_date, w.date);
    if (age == null || age < 0 || age > 900) return;
    let kg = num(w.weight_actual);
    if (kg == null){ const cg = num(w.chest_cm); if (cg) kg = a*cg*cg + b*cg + c0; }
    if (kg == null || kg <= 0 || kg > 1200) return;
    const breed = cow.breed || '未設定', bk = Math.floor(age/10)*10;
    ((buckets[breed] = buckets[breed] || {})[bk] = buckets[breed][bk] || []).push(kg);
  });
  const weightByAge = {};
  for (const breed in buckets){
    weightByAge[breed] = Object.keys(buckets[breed]).map(Number).sort((x,y)=>x-y).map(bk => {
      const arr = buckets[breed][bk].sort((x,y)=>x-y);
      return { day: bk, n: arr.length, p10: pctl(arr,.1), p25: pctl(arr,.25),
               p50: pctl(arr,.5), p75: pctl(arr,.75), p90: pctl(arr,.9) };
    });
  }
  const bw = {};
  db.cows.forEach(c => { const v = num(c.birth_weight);
    if (v && v > 0 && v < 120) (bw[c.breed || '未設定'] = bw[c.breed || '未設定'] || []).push(v); });
  const birthWeight = {};
  for (const b2 in bw){
    const arr = bw[b2].sort((x,y)=>x-y);
    birthWeight[b2] = { n: arr.length, p10: pctl(arr,.1), p25: pctl(arr,.25), p50: pctl(arr,.5),
                        p75: pctl(arr,.75), p90: pctl(arr,.9),
                        mean: arr.reduce((s,x)=>s+x,0)/arr.length };
  }
  return { weightByAge, birthWeight, repro: reproHerdLocal(db),
           genomics: genomicsHerdLocal(db),
           feedOutcome: feedOutcomeLocal(db, S, byNo) };
}

/** 牛ごとの直近の体重。共有モードの latestWeights_ と同じもの */
function latestWeightsLocal(db, S){
  const a = num(S['weight.formula_a'], .0234), b = num(S['weight.formula_b'], -2.281),
        c0 = num(S['weight.formula_c'], 75.618);
  const has = {}; (db.cows || []).forEach(c => has[String(c.cow_no)] = 1);
  const best = {};
  (db.weights || []).forEach(w => {
    const no = String(w.cow_no); if (!has[no]) return;
    let kg = num(w.weight_actual); const measured = kg != null;
    if (kg == null){ const cg = num(w.chest_cm); if (cg > 0) kg = a*cg*cg + b*cg + c0; }
    if (kg == null || kg <= 0) return;
    const d = String(w.date || '').slice(0, 10); if (!d) return;
    if (!best[no] || d >= best[no].date)
      best[no] = { cow_no: no, date: d, kg: Math.round(kg*10)/10, measured };
  });
  return Object.keys(best).map(k => best[k]);
}

/** 共有モード（GAS）の buildFeedOutcome_ と同じ計算を、お試しモードでも行う。
    どちらのモードでも同じ数字が出ないと、確認に使えないためです。 */
function feedOutcomeLocal(db, S, byNo){
  const a = num(S['weight.formula_a'], .0234), b = num(S['weight.formula_b'], -2.281),
        c0 = num(S['weight.formula_c'], 75.618);

  const wByCow = {};
  (db.weights || []).forEach(w => {
    const cow = byNo[String(w.cow_no)]; if (!cow || !cow.birth_date) return;
    const d = daysBetween(cow.birth_date, w.date);
    if (d == null || d < 0 || d > 400) return;
    let kg = num(w.weight_actual);
    if (kg == null){ const cg = num(w.chest_cm); if (cg > 0) kg = a*cg*cg + b*cg + c0; }
    if (kg == null || kg <= 0) return;
    (wByCow[String(w.cow_no)] = wByCow[String(w.cow_no)] || []).push({ day: d, kg });
  });

  const fByCow = {};
  (db.milk_feed || []).forEach(m => {
    const cow = byNo[String(m.cow_no)]; if (!cow || !cow.birth_date) return;
    const d = daysBetween(cow.birth_date, m.date);
    if (d == null || d < 0 || d > 200) return;
    const L = num(m.volume_l); if (L == null || L < 0) return;
    const key = String(m.cow_no);
    const per = /^[0-9]+$/.test(String(m.feeding_no || '').trim());
    const g = ((fByCow[key] = fByCow[key] || {})[d] =
      fByCow[key][d] || { per: 0, whole: 0, hasPer: false });
    if (per){ g.per += L; g.hasPer = true; } else g.whole += L;
  });

  const badByCow = {};
  (db.events || []).forEach(e => {
    const cow = byNo[String(e.cow_no)]; if (!cow || !cow.birth_date) return;
    if (!/便異常|下痢/.test(String(e.type) + String(e.detail))) return;
    const d = daysBetween(cow.birth_date, e.date); if (d == null) return;
    (badByCow[String(e.cow_no)] = badByCow[String(e.cow_no)] || []).push(d);
  });

  const near = (ws, day, tol) => {
    let best = null, bd = 1e9;
    ws.forEach(x => { const d = Math.abs(x.day - day); if (d < bd){ bd = d; best = x; } });
    return bd <= tol ? best : null;
  };

  const cells = {};
  Object.keys(fByCow).forEach(no => {
    const days = Object.keys(fByCow[no]).map(Number).sort((x, y) => x - y);
    if (!days.length) return;
    const ws = (wByCow[no] || []).slice().sort((x, y) => x.day - y.day);
    const bad = badByCow[no] || [];
    for (let bk = 0; bk <= 100; bk += 10){
      const inBk = days.filter(d => d >= bk && d < bk + 10);
      if (inBk.length < 3) continue;
      let sum = 0;
      inBk.forEach(d => { const g = fByCow[no][d]; sum += g.hasPer ? g.per : g.whole; });
      const perDay = sum / inBk.length;
      if (!(perDay > 0)) continue;
      const level = Math.round(perDay * 2) / 2;
      const key = bk + '|' + level;
      const c = (cells[key] = cells[key] || { dg: [], scours: 0, n: 0 });
      c.n++;
      if (bad.some(d => d >= bk && d < bk + 17)) c.scours++;
      const w0 = near(ws, bk, 6), w1 = near(ws, bk + 20, 8);
      if (w0 && w1 && w1.day > w0.day) c.dg.push((w1.kg - w0.kg) / (w1.day - w0.day));
    }
  });

  return Object.keys(cells).map(key => {
    const [bk, lv] = key.split('|').map(Number);
    const c = cells[key], dg = c.dg.slice().sort((x, y) => x - y);
    return { day: bk, level: lv, n: c.n, dgN: dg.length,
             dgP25: dg.length ? pctl(dg, .25) : null,
             dgP50: dg.length ? pctl(dg, .50) : null,
             dgP75: dg.length ? pctl(dg, .75) : null,
             scoursPct: c.n ? c.scours / c.n * 100 : null };
  }).sort((x, y) => (x.day - y.day) || (x.level - y.level));
}

function genomicsHerdLocal(db){
  const by = {};
  (db.genomics || []).forEach(r => {
    if (String(r.subject || '自身') !== '自身') return;
    const v = num(r.value); if (v == null) return;
    const t = String(r.trait || ''); if (!t) return;
    (by[t] = by[t] || []).push(v);
  });
  const out = {};
  for (const t in by){
    const arr = by[t].sort((a,b) => a-b);
    if (arr.length < 5) continue;
    out[t] = { n: arr.length, min: arr[0], max: arr[arr.length-1],
               p10: pctl(arr,.1), p25: pctl(arr,.25), p50: pctl(arr,.5),
               p75: pctl(arr,.75), p90: pctl(arr,.9),
               mean: arr.reduce((x,y)=>x+y,0)/arr.length };
  }
  return out;
}

function reproHerdLocal(db){
  const byNo = {}; db.cows.forEach(c => byNo[String(c.cow_no)] = c);
  const per = {};
  db.repro.forEach(r => {
    const no = String(r.cow_no);
    (per[no] = per[no] || { ai: [], calving: [] });
    if (r.type === 'AI' || r.type === '授精') per[no].ai.push(r);
    if (r.type === '分娩') per[no].calving.push(r);
  });
  const firstAi = [], concep = [], calving = [], aiCount = [];

  // 初回授精月齢は牛群検定システムの記載値を最優先
  db.cows.forEach(c => {
    const m = num(c.first_ai_month);
    if (m != null && m > 5 && m < 40) firstAi.push(m);
  });

  for (const no in per){
    const cow = byNo[no]; if (!cow || !cow.birth_date) continue;
    const p = per[no];
    p.ai.sort((x,y)=> String(x.date) < String(y.date) ? -1 : 1);
    if (num(cow.first_ai_month) == null && p.ai.length){
      const m = ageMonths(cow.birth_date, p.ai[0].date);
      if (m != null && m > 5 && m < 40) firstAi.push(m);
    }
    // 初回分娩は「産次1」と分かっている記録だけ
    let first = null;
    p.calving.forEach(r => {
      if (String(r.parity) === '1' && (!first || String(r.date) < String(first.date))) first = r;
    });
    if (first){
      const mc = ageMonths(cow.birth_date, first.date);
      if (mc != null && mc > 15 && mc < 50) calving.push(mc);
      const conc = addDays(first.date, -280);
      const mm = ageMonths(cow.birth_date, conc);
      if (mm != null && mm > 5 && mm < 40) concep.push(mm);
      const n = p.ai.filter(x => String(x.date) <= conc).length;
      if (n > 0 && n < 15) aiCount.push(n);
    }
  }
  const st = arr => { if (!arr.length) return null; const s2 = arr.slice().sort((a,b)=>a-b);
    return { n: s2.length, mean: s2.reduce((x,y)=>x+y,0)/s2.length,
             p25: pctl(s2,.25), p50: pctl(s2,.5), p75: pctl(s2,.75) }; };
  return { first_ai_month: st(firstAi), conception_month: st(concep),
           first_calving_month: st(calving), ai_per_conception: st(aiCount) };
}

function pctl(sorted, p){
  if (!sorted.length) return null;
  const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}

/* ------------------------------------------------------------
   4. 計算 — 体重・乾物量・発育・予測
   ------------------------------------------------------------ */
const Calc = {
  S(){ return Store.settings; },

  /** 胸囲(cm) → 推定体重(kg)。この牧場の実測データから導いた式 */
  estWeight(chestCm){
    const c = num(chestCm); if (c == null || c <= 0) return null;
    const S = this.S();
    const a = num(S['weight.formula_a'], .0234),
          b = num(S['weight.formula_b'], -2.281),
          k = num(S['weight.formula_c'], 75.618);
    const w = a*c*c + b*c + k;
    return w > 0 ? w : null;
  },

  /**
   * 白川牧場の標準値。kind は 'weight'（体重kg）/ 'chest'（胸囲cm）/ 'height'（体高cm）。
   * 「7.白川体高BW」の 体重・胸囲・体高 シートの値をそのまま使っています。
   * 返り値 { avg, min, max }。日齢の間は直線で補間します。
   */
  std(kind, days){
    if (days == null || days < 0) return null;
    const parse = key => {
      const ck = '_c_' + key;
      if (!this[ck] || this[ck].src !== this.S()[key]){
        this[ck] = { src: this.S()[key],
          pts: String(this.S()[key] || '').split(',').map(t => {
            const m = t.trim().match(/^([\d.]+)\s*:\s*([\d.]+)$/);
            return m ? { d: +m[1], v: +m[2] } : null;
          }).filter(Boolean).sort((x, y) => x.d - y.d) };
      }
      return this[ck].pts;
    };
    const interp = pts => {
      if (!pts.length) return null;
      if (days <= pts[0].d) return pts[0].v;
      for (let i = 0; i < pts.length - 1; i++){
        if (days <= pts[i+1].d){
          const a = pts[i], b = pts[i+1];
          if (b.d === a.d) return b.v;          // 同じ日齢が2つ書かれていても壊れないように
          return a.v + (b.v - a.v) * (days - a.d) / (b.d - a.d);
        }
      }
      return pts[pts.length-1].v;   // 表の外は最後の値で止める
    };
    const avg = interp(parse('std.' + kind + '.avg'));
    if (avg == null) return null;
    return { avg: avg,
             min: interp(parse('std.' + kind + '.min')) ?? avg,
             max: interp(parse('std.' + kind + '.max')) ?? avg };
  },

  /** 推奨体重（＝体重の標準平均） */
  targetWeight(days){
    const s = this.std('weight', days);
    return s ? { low: s.avg, high: s.max, min: s.min, mid: s.avg } : null;
  },

  /** 充足率（%）＝ 体重 ÷ 推奨体重 × 100。牧場のシートと同じ定義 */
  fulfillment(days, kg){
    const s = this.std('weight', days);
    if (!s || kg == null || !s.avg) return null;
    return kg / s.avg * 100;
  },

  /**
   * 牛群の分け方。牛舎での運用に合わせた群に分けます。
   *   初乳・移行乳 → 哺乳①増乳 → ②ピーク → ③減乳 → ④離乳
   *   → 育成 → 種付け期 → 未経産 妊娠+ → 経産
   */
  groupOf(cow, onDate){
    const S = this.S();
    if (/売却|廃用|死亡|出荷/.test(String(cow.status || ''))) return GROUPS.sold;

    const parity = num(cow.parity);
    if (parity != null && parity >= 1) return GROUPS.milking;

    const d = ageDays(cow.birth_date, onDate);
    const m = ageMonths(cow.birth_date, onDate);
    if (d == null) return GROUPS.unknown;

    const colo = num(S['group.colostrum_days'], 3);
    if (d <= colo) return GROUPS.colostrum;

    const key = this.programKey(cow);
    const meta = this.programMeta(key);
    const marks = this.programMarks(key);
    const wean = marks.weanDay || meta.weanMax;
    const trans = num(S['group.wean_transition_days'], 14);

    if (d < (marks.peakStart || 35)) return GROUPS.milk1;
    if (d < (marks.peakEnd || 50))   return GROUPS.milk2;
    if (d < wean)                    return GROUPS.milk3;
    if (d < wean + trans)            return GROUPS.milk4;

    // 未経産で受胎している（分娩予定日がある）
    if (cow.due_date) return GROUPS.pregnant;

    const bm = num(S['group.breeding_month'], 10);
    if (m != null && m >= bm) return GROUPS.breeding;
    return GROUPS.growing;
  },

  /** 標準のどこか: 'over'（標準以上）/ 'in'（標準内）/ 'under'（標準以下） */
  stdZone(kind, days, value){
    const s = this.std(kind, days);
    if (!s || value == null) return null;
    if (value > s.max) return 'over';
    if (value < s.min) return 'under';
    return 'in';
  },

  /** 逆算：目標体重に必要な胸囲 */
  chestForWeight(kg){
    const S = this.S();
    const a = num(S['weight.formula_a'], .0234),
          b = num(S['weight.formula_b'], -2.281),
          k = num(S['weight.formula_c'], 75.618) - num(kg);
    const disc = b*b - 4*a*k;
    if (disc < 0) return null;
    return (-b + Math.sqrt(disc)) / (2*a);
  },

  /**
   * 1回の哺乳の乾物量(kg)。
   *
   * この牧場の測り方：「お湯1Lに代用乳140g」。アプリに記録する給与量Lも
   * お湯の量なので、粉の量は そのまま 給与量L × 濃度g/L です。
   * （現メニューの「ピーク5L＝700g」＝ 5×140 と一致します）
   */
  milkDM(rec){
    const S = this.S();
    const L = num(rec.volume_l, 0) || 0;
    if (L <= 0) return 0;
    const type = rec.milk_type || '代用乳';
    if (type === '代用乳'){
      const g = num(rec.powder_g_per_l, null) ?? this.powderConc(rec.date);
      const dm = num(S['milk.replacer_dm_pct'], 96) / 100;
      return L * g / 1000 * dm;
    }
    const key = type === '初乳' ? 'milk.colostrum_dm_pct'
              : type === '移行乳' ? 'milk.transition_dm_pct' : 'milk.whole_dm_pct';
    return L * num(S[key], 12.5) / 100;
  },

  /** 1回の哺乳に使う粉の量(g)。画面表示と乾物計算で同じ式を使うためのもの */
  powderG(rec){
    if ((rec.milk_type || '代用乳') !== '代用乳') return 0;
    const L = num(rec.volume_l, 0) || 0;
    const g = num(rec.powder_g_per_l, null) ?? this.powderConc(rec.date);
    return L * g;
  },

  /** その日付に適用される調乳濃度(g/L)。冬期は自動で切り替わる */
  powderConc(dateStr){
    const S = this.S();
    const d = toDate(dateStr) || new Date();
    const winter = String(S['milk.winter_months'] || '')
      .split(',').map(s => parseInt(s.trim(), 10)).filter(n => n >= 1 && n <= 12);
    const m = d.getMonth() + 1;
    return winter.includes(m)
      ? num(S['milk.powder_g_per_l_winter'], num(S['milk.powder_g_per_l'], 140))
      : num(S['milk.powder_g_per_l'], 140);
  },

  starterDM(kg){
    return (num(kg, 0) || 0) * num(this.S()['starter.dm_pct'], 88) / 100;
  },

  /* ---- 哺乳プログラム（2群運用）---------------------------- */

  perDay(){ return num(this.S()['program.feedings_per_day'], 2) || 2; },

  programKeys(){
    return String(this.S()['program.keys'] || 'a,b')
      .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  },

  /** 牛が属する群のキー。未設定なら品種と出生体重から提案 */
  programKey(cow){
    const explicit = String(cow && cow.program || '').toLowerCase();
    if (this.programKeys().includes(explicit)) return explicit;
    return this.suggestProgram(cow);
  },

  /** 和牛は専用群へ。ホルスタインは出生体重が下位側なら発育停滞群へ */
  suggestProgram(cow){
    const S = this.S();
    const dflt = String(S['program.default'] || 'a').toLowerCase();
    const wag = String(S['program.wagyu_key'] || '').toLowerCase();
    if (wag && this.programKeys().includes(wag) &&
        /和牛|黒毛/.test(String(cow && cow.breed || ''))) return wag;
    const bw = num(cow && cow.birth_weight);
    if (bw == null) return dflt;
    let thr = num(S['program.assign_bw_kg']);
    if (thr == null){
      const stats = Store.benchmark?.birthWeight?.[cow.breed] ||
                    Store.benchmark?.birthWeight?.['未設定'];
      if (stats && stats.n >= 10 && stats.p25 != null) thr = stats.p25;
    }
    if (thr == null) return dflt;
    const keys = this.programKeys();
    const slow = String(S['program.slow_key'] || 'b').toLowerCase();
    return bw < thr && keys.includes(slow) ? slow : dflt;
  },

  programMeta(key){
    const S = this.S();
    const keys = this.programKeys();
    const k = keys.includes(String(key || '').toLowerCase())
      ? String(key).toLowerCase() : (keys[0] || 'a');
    return {
      key: k,
      name: S['program.' + k + '.name'] || (k.toUpperCase() + '群'),
      weanMin: num(S['program.' + k + '.wean_min'], 75),
      weanMax: num(S['program.' + k + '.wean_max'], 100),
      provisional: String(S['program.' + k + '.provisional'] || '') === '1',
      raw: S['program.' + k + '.schedule'] || ''
    };
  },

  /** 「日齢 → 1回あたりL / 1日あたりL」の配列に展開 */
  program(key){
    const meta = this.programMeta(key);
    const per = this.perDay();
    const pts = String(meta.raw).split(',').map(s => {
      const m = s.trim().match(/^(\d+)\s*:\s*([\d.]+)$/);
      return m ? { day: +m[1], l: +m[2] } : null;
    }).filter(Boolean).sort((a,b) => a.day - b.day);
    if (!pts.length) return [];
    const last = pts[pts.length - 1].day;
    const out = [];
    for (let d = 1; d <= Math.max(last, 120); d++){
      let cur = pts[0].l;
      for (const p of pts) if (d >= p.day) cur = p.l;
      out.push({ day: d, perFeed: cur, l: cur * per });
    }
    return out;
  },

  /** その日齢の目安。{ perFeed, perDay, powderG } */
  programAt(key, day, onDate){
    const p = this.program(key);
    if (!p.length || day == null) return null;
    const x = p[clamp(Math.round(day) - 1, 0, p.length - 1)];
    const g = this.powderConc(onDate);
    return { perFeed: x.perFeed, perDay: x.l, feeds: this.perDay(),
             powderPerFeed: x.perFeed * g, powderPerDay: x.l * g };
  },

  /** プログラム上の節目 */
  /* ============================================================
     初乳
     ============================================================ */

  /** 初乳そのものの質（Brix）。22%以上で合格が一般的な目安 */
  colostrumBrixGrade(brix){
    const S = this.S();
    const v = num(brix);
    if (v == null) return null;
    const good = num(S['colostrum.brix_good'], 22);
    const fair = num(S['colostrum.brix_fair'], 18);
    if (v >= good) return { key: 'good', label: '合格', tone: 'good',
      hint: 'Brix ' + r1(v) + '%（' + r0(good) + '%以上）' };
    if (v >= fair) return { key: 'fair', label: 'やや薄い', tone: 'warn',
      hint: 'Brix ' + r1(v) + '%。量を増やすか、質の良い初乳に替えたい' };
    return { key: 'poor', label: '不足', tone: 'crit',
      hint: 'Brix ' + r1(v) + '%。別の初乳（凍結初乳など）に替えてください' };
  },

  /** 1回目までの時間。分娩直後ほど吸収率が高く、時間とともに急に落ちる */
  colostrumTimingGrade(hours){
    const S = this.S();
    const h = num(hours);
    if (h == null) return null;
    const best = num(S['colostrum.first_hours_best'], 2);
    const ok = num(S['colostrum.first_hours_ok'], 6);
    if (h <= best) return { key: 'good', label: '理想的', tone: 'good',
      hint: '分娩から' + r1(h) + '時間（' + r0(best) + '時間以内）' };
    if (h <= ok) return { key: 'fair', label: '許容', tone: 'warn',
      hint: '分娩から' + r1(h) + '時間。次はもう少し早く飲ませたい' };
    return { key: 'poor', label: '遅い', tone: 'crit',
      hint: '分娩から' + r1(h) + '時間。この時間だと吸収率がかなり落ちます' };
  },

  /** 生後1週の血清総蛋白から、移行がうまくいったかを4段階で見る */
  colostrumTransferGrade(tp){
    const S = this.S();
    const v = num(tp);
    if (v == null) return null;
    const ex = num(S['colostrum.serum_tp_excellent'], 6.2);
    const gd = num(S['colostrum.serum_tp_good'], 5.8);
    const fr = num(S['colostrum.serum_tp_fair'], 5.1);
    if (v >= ex) return { key: 'excellent', label: '優', tone: 'good',
      hint: '総蛋白 ' + r1(v) + ' g/dL' };
    if (v >= gd) return { key: 'good', label: '良', tone: 'good',
      hint: '総蛋白 ' + r1(v) + ' g/dL' };
    if (v >= fr) return { key: 'fair', label: '可', tone: 'warn',
      hint: '総蛋白 ' + r1(v) + ' g/dL。下痢・肺炎に注意して見てください' };
    return { key: 'poor', label: '移行不全', tone: 'crit',
      hint: '総蛋白 ' + r1(v) + ' g/dL。今後の下痢・肺炎のリスクが高い個体です' };
  },

  /** その牛に飲ませたい初乳の量（体重の10%が目安） */
  colostrumTargetL(cow){
    const S = this.S();
    const bw = num(cow && cow.birth_weight);
    const pct = num(S['colostrum.volume_pct_bw'], 10) / 100;
    if (bw == null || bw <= 0) return null;
    return Math.round(bw * pct * 10) / 10;
  },

  /** 1頭分の初乳記録をまとめる */
  colostrumSummary(cow, rows){
    const list = (rows || []).slice()
      .sort((a, b) => String(a.date + (a.feeding_no || '')) <
                      String(b.date + (b.feeding_no || '')) ? -1 : 1);
    const feeds = list.filter(r => String(r.kind || '給与') === '給与');
    const checks = list.filter(r => String(r.kind) === '移行判定');
    const first = feeds[0] || null;
    const totalL = feeds.reduce((s, r) => s + (num(r.volume_l, 0) || 0), 0);
    const targetL = this.colostrumTargetL(cow);
    const lastCheck = checks[checks.length - 1] || null;
    return {
      feeds, checks, first, totalL, targetL,
      timing: first ? this.colostrumTimingGrade(first.hours_after_birth) : null,
      brix: first ? this.colostrumBrixGrade(first.brix_pct) : null,
      transfer: lastCheck
        ? this.colostrumTransferGrade(num(lastCheck.serum_tp) != null
            ? lastCheck.serum_tp : this.serumBrixToTp(lastCheck.serum_brix))
        : null,
      lastCheck,
      // 4.0L と 4.2L の違いを「不足」と言うと現場が疲れるので、5%の余裕を見る
      enough: targetL != null && totalL > 0 ? totalL >= targetL * 0.95 : null
    };
  },

  /** 血清Brix(%) から総蛋白(g/dL) へのおおよその換算。実測の総蛋白があればそちらを使う */
  serumBrixToTp(brix){
    const v = num(brix);
    return v == null ? null : Math.round((v * 0.75 + 0.1) * 100) / 100;
  },

  /* ============================================================
     1回量の安全確認
     ============================================================ */

  /**
   * この牧場のプログラムが、標準体重に対して最大で何%の1回量になっているか。
   *
   * 教科書的な「1回◯%まで」という線を持ち込むと、白川牧場のプログラム
   * （増乳〜ピークで体重の 7.0〜7.6%/回）がまるごと危険域になってしまい、
   * 現場の実感と合いません。そこで上限は牧場自身の運用から導きます。
   * 「いつもの一番多いときより、さらに多い」ときだけ声をかける形です。
   */
  /**
   * 牧場自身の記録から「この量で育てた牛はどうだったか」を引く。
   * データが貯まるまでは null を返し、画面には「まだ足りません」と出します。
   *   day     … 日齢
   *   perDay  … 1日あたりの給与量 L
   */
  feedRecord(day, perDay){
    const rows = Store.benchmark && Store.benchmark.feedOutcome;
    if (!rows || !rows.length || day == null || !(perDay > 0)) return null;
    const bk = Math.floor(day / 10) * 10;
    const here = rows.filter(r => r.day === bk);
    if (!here.length) return null;
    const level = Math.round(perDay * 2) / 2;
    // ぴったりの水準が無ければ、いちばん近い水準を使う
    let best = null, bd = 1e9;
    here.forEach(r => { const d = Math.abs(r.level - level); if (d < bd){ bd = d; best = r; } });
    if (!best || bd > 1.0) return null;
    return Object.assign({ bucket: bk, matched: bd < 1e-9, levels: here }, best);
  },

  /** その日齢帯で、牧場がこれまで実際に与えてきた量の幅 */
  feedRangeSeen(day){
    const rows = Store.benchmark && Store.benchmark.feedOutcome;
    if (!rows || day == null) return null;
    const bk = Math.floor(day / 10) * 10;
    const here = rows.filter(r => r.day === bk && r.n > 0);
    if (!here.length) return null;
    const total = here.reduce((s, r) => s + r.n, 0);
    return { bucket: bk, n: total,
             min: Math.min(...here.map(r => r.level)),
             max: Math.max(...here.map(r => r.level)),
             rows: here.slice().sort((a, b) => a.level - b.level) };
  },

  programMaxPctBW(key){
    const p = this.program(key);
    if (!p.length) return null;
    let max = null;
    p.forEach(x => {
      if (!(x.perFeed > 0)) return;
      const s = this.std('weight', x.day);
      if (!s || !s.avg) return;
      const pct = x.perFeed / s.avg * 100;
      if (max == null || pct > max) max = pct;
    });
    return max;
  },

  /**
   * 1回あたりの給与量が、その牛にとって無理のない範囲かを見る。
   *   perFeed  … 1回あたりのL
   *   kg       … その牛の体重（推定でよい）
   *   opts     … { prevPerFeed, feces, refused, programPerFeed, progKey }
   * 返り値の level は ok / watch / high / low。
   */
  feedSafety(perFeed, kg, opts){
    const S = this.S();
    opts = opts || {};
    const L = num(perFeed);
    const w = num(kg);
    const out = { level: 'ok', pctBW: null, ceilPct: null, notes: [] };
    if (L == null || L <= 0) return out;

    /* 1) 体重に対する1回量 */
    if (w != null && w > 0){
      out.pctBW = L / w * 100;
      const ceil = this.programMaxPctBW(opts.progKey || S['program.default'] || 'a');
      if (ceil != null){
        const margin = num(S['safe.pct_bw_margin'], 15) / 100;
        out.ceilPct = ceil;
        if (out.pctBW > ceil * (1 + margin)){
          out.level = 'high';
          out.notes.push('体重に対して1回 ' + r1(out.pctBW) + '%。' +
            'いつもの一番多いとき（' + r1(ceil) + '%）より多い量です');
        }
      }
    }

    /* 2) 前回からの増やし幅 */
    const prev = num(opts.prevPerFeed);
    const step = num(S['safe.step_up_l'], 0.5);
    if (prev != null && L - prev > step + 1e-9){
      if (out.level === 'ok') out.level = 'watch';
      out.notes.push('前回より +' + r1(L - prev) + ' L。' +
        '一度に増やすのは ' + r1(step) + ' L までにしています');
    }

    /* 3) 下痢が出ている最中の増量 */
    const bad = opts.feces && opts.feces !== '正常';
    if (bad && prev != null && L > prev + 1e-9){
      out.level = 'high';
      out.notes.push('便がゆるい日に増やそうとしています。まず量を戻すか据え置きに');
    }
    if (bad && out.level === 'ok'){
      out.level = 'watch';
      out.notes.push('便がゆるいので、増やさずに様子を見てください');
    }

    /* 4) 目安より少ない */
    const prog = num(opts.programPerFeed);
    const short = num(S['safe.short_l'], 1.0);
    if (prog != null && prog - L >= short - 1e-9){
      if (out.level === 'ok' || out.level === 'watch') out.level = 'low';
      out.notes.push('目安より −' + r1(prog - L) + ' L。' +
        (opts.shortDays > 1 ? opts.shortDays + '日続いています。カルテを見てください'
                            : '続くようならカルテを見てください'));
    }

    /* 5) 目安より多い（日齢に対して多すぎないか） */
    const over = num(S['safe.over_l'], 1.0);
    if (prog != null && L - prog >= over - 1e-9){
      if (out.level === 'ok') out.level = 'watch';
      out.notes.push('目安より +' + r1(L - prog) + ' L。' +
        r0(opts.day) + '日齢の量としては多めです');
    }
    return out;
  },

  programMarks(key){
    const p = this.program(key);
    if (!p.length) return {};
    let peakL = 0, peakStart = null, peakEnd = null, rampStart = null, weanDay = null;
    p.forEach(x => { if (x.perFeed > peakL) peakL = x.perFeed; });
    for (const x of p){
      if (rampStart == null && x.perFeed > p[0].perFeed) rampStart = x.day;
      if (x.perFeed >= peakL && peakStart == null) peakStart = x.day;
      if (peakStart != null && x.perFeed < peakL && peakEnd == null) peakEnd = x.day;
      if (x.perFeed <= 0 && weanDay == null) weanDay = x.day;
    }
    return { rampStart, peakStart, peakEnd, peakL, peakPerDay: peakL * this.perDay(), weanDay };
  },

  /** 1頭分をまとめて解析する。画面はここが返すものだけを見る */
  analyze(cow, rec){
    const S = this.S();
    const out = { cow, rec };
    const birth = cow.birth_date;
    out.ageDays = ageDays(birth);
    out.ageMonths = ageMonths(birth);
    out.programKey = this.programKey(cow);
    out.programMeta = this.programMeta(out.programKey);
    out.programAuto = !this.programKeys().includes(String(cow.program || '').toLowerCase());

    /* --- 体重の系列 --- */
    const pts = [];
    (rec.weights || []).forEach(w => {
      const d = daysBetween(birth, w.date);
      if (d == null || d < 0) return;
      const actual = num(w.weight_actual);
      const est = actual == null ? this.estWeight(w.chest_cm) : null;
      const kg = actual != null ? actual : est;
      if (kg == null) return;
      pts.push({ day: d, date: w.date, kg, chest: num(w.chest_cm),
                 measured: actual != null, id: w.id, note: w.note, source: w.source });
    });
    const bw = num(cow.birth_weight);
    if (bw != null && bw > 0 && !pts.some(p => p.day === 0)){
      pts.unshift({ day: 0, date: birth, kg: bw, chest: num(cow.birth_chest),
                    measured: true, birth: true });
    }
    pts.sort((a,b) => a.day - b.day);
    out.weights = pts;
    out.latest = pts.length ? pts[pts.length - 1] : null;
    out.birthWeight = bw;

    /* --- 増体（DG） --- */
    out.dgOverall = null; out.dgRecent = null;
    if (pts.length >= 2){
      const a = pts[0], b = pts[pts.length - 1];
      if (b.day > a.day) out.dgOverall = (b.kg - a.kg) / (b.day - a.day);
      const tail = pts.slice(-3);
      if (tail.length >= 2){
        const f = this.fitLine(tail.map(p => [p.day, p.kg]));
        if (f && isFinite(f.m)) out.dgRecent = f.m;
      }
    }

    /* --- 哺乳とスターターを日別に集計 --- */
    const byDay = {};
    const touch = d => (byDay[d] = byDay[d] || { day: d, milkL: 0, milkDM: 0, starter: 0,
                                                 starterDM: 0, powderG: 0, types: {},
                                                 feces: '', refused: '', note: '', mixed: false });
    /* 同じ日に「1日分でまとめた行」と「朝・夕に分けた行」が混在すると
       二重計上になるため、回ごとの行がある日はそちらだけを使う */
    const feedByDay = {};
    (rec.milk_feed || []).forEach(m => {
      const d = daysBetween(birth, m.date); if (d == null || d < 0) return;
      const perFeed = /^[0-9]+$/.test(String(m.feeding_no || '').trim());
      (feedByDay[d] = feedByDay[d] || { per: [], whole: [] })[perFeed ? 'per' : 'whole'].push(m);
    });
    Object.keys(feedByDay).forEach(k => {
      const d = +k;
      const g = feedByDay[d];
      const use = g.per.length ? g.per : g.whole;
      const t = touch(d);
      if (g.per.length && g.whole.length) t.mixed = true;   // 画面で注意を出すため
      use.forEach(m => {
        const L = num(m.volume_l, 0) || 0;
        t.milkL += L;
        t.milkDM += this.milkDM(m);
        t.powderG += this.powderG(m);
        t.types[m.milk_type || '代用乳'] = (t.types[m.milk_type || '代用乳'] || 0) + L;
        if (m.feces) t.feces = m.feces;
        if (m.refused) t.refused = m.refused;
        if (m.note && !t.note) t.note = m.note;
      });
    });
    (rec.starter || []).forEach(s => {
      const d = daysBetween(birth, s.date); if (d == null || d < 0) return;
      const t = touch(d);
      let kg = num(s.intake_kg);
      if (kg == null){
        const off = num(s.offered_kg, 0) || 0, ref = num(s.refused_kg, 0) || 0;
        kg = Math.max(0, off - ref);
      }
      t.starter += kg;
      t.starterDM += this.starterDM(kg);
    });
    const days = Object.keys(byDay).map(Number).sort((a,b) => a-b);
    let cumMilk = 0, cumStarter = 0, cumTotal = 0;
    const series = days.map(d => {
      const t = byDay[d];
      cumMilk += t.milkDM; cumStarter += t.starterDM; cumTotal += t.milkDM + t.starterDM;
      return Object.assign({}, t, { cumMilkDM: cumMilk, cumStarterDM: cumStarter,
                                    cumDM: cumTotal, dm: t.milkDM + t.starterDM });
    });
    out.daily = series;
    out.cumDM = cumTotal;
    out.cumMilkDM = cumMilk;
    out.cumStarterDM = cumStarter;
    out.lastFeedDay = days.length ? days[days.length - 1] : null;

    /* --- 3日移動平均のスターター摂取 --- */
    out.starterMA = series.map((s, i) => {
      const w = series.slice(Math.max(0, i-2), i+1);
      return { day: s.day, kg: w.reduce((x,y) => x + y.starter, 0) / w.length };
    });

    /* --- 現在のステージ --- */
    out.stage = this.stageOf(out, rec);

    /* --- 予測 --- */
    out.forecast = this.forecast(out, rec);

    /* --- 牧場内での位置 --- */
    out.percentile = this.percentile(cow, out.latest);

    /* --- 目標体重に対する充足率 --- */
    out.target = out.latest ? this.targetWeight(out.latest.day) : null;
    out.fulfillment = out.latest ? this.fulfillment(out.latest.day, out.latest.kg) : null;

    /* --- 繁殖 --- */
    out.repro = this.reproSummary(cow, rec.repro || []);

    return out;
  },

  stageOf(a, rec){
    const ev = (rec.events || []).slice().sort((x,y) => String(x.date) < String(y.date) ? -1 : 1);
    const find = t => ev.filter(e => e.type === t).pop();
    const wean = find('離乳'), down = find('減乳開始'), peak = find('ピーク到達'), ramp = find('増乳開始');
    const day = a.ageDays;
    if (wean) return { key: 'weaned', label: '離乳済み', since: wean.date, source: '記録' };
    if (down) return { key: 'stepdown', label: '減乳期', since: down.date, source: '記録' };
    if (peak) return { key: 'peak', label: 'ピーク期', since: peak.date, source: '記録' };
    if (ramp) return { key: 'ramp', label: '増乳期', since: ramp.date, source: '記録' };

    // 記録がなければプログラム上の日齢から推定
    const m = this.programMarks(a.programKey);
    if (day == null) return { key: 'unknown', label: '—', source: '' };
    if (m.weanDay && day >= m.weanDay) return { key: 'weaned', label: '離乳済み（推定）', source: '日齢' };
    if (m.peakEnd && day >= m.peakEnd)  return { key: 'stepdown', label: '減乳期（推定）', source: '日齢' };
    if (m.peakStart && day >= m.peakStart) return { key: 'peak', label: 'ピーク期（推定）', source: '日齢' };
    if (m.rampStart && day >= m.rampStart) return { key: 'ramp', label: '増乳期（推定）', source: '日齢' };
    if (day <= 3) return { key: 'colostrum', label: '初乳期', source: '日齢' };
    return { key: 'early', label: '哺乳初期', source: '日齢' };
  },

  /** 最小二乗の直線あてはめ */
  fitLine(pairs){
    const n = pairs.length;
    if (n < 2) return null;
    let sx=0, sy=0, sxx=0, sxy=0;
    for (const [x,y] of pairs){ sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
    const den = n*sxx - sx*sx;
    if (Math.abs(den) < 1e-9) return null;
    const m = (n*sxy - sx*sy) / den;
    const b = (sy - m*sx) / n;
    // 決定係数
    const my = sy/n;
    let ssRes = 0, ssTot = 0;
    for (const [x,y] of pairs){ const p = m*x + b; ssRes += (y-p)**2; ssTot += (y-my)**2; }
    return { m, b, r2: ssTot > 0 ? 1 - ssRes/ssTot : null, n };
  },

  /**
   * 増乳・ピーク・減乳・離乳の予測。
   * 根拠を reasons に積んで画面に出す（ブラックボックスにしない）
   */
  forecast(a, rec){
    const S = this.S();
